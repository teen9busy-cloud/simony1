<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시모니 1.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#f4f7f6; --panel:#fff; --line:#dfe5e2; --line2:#eef2f0;
  --ink:#1c2b25; --sub:#66766e; --accent:#1b5e20; --accent-soft:#eaf1ec;
  --accent-dark:#12401a;
  --warn:#b3261e; --radius:6px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Malgun Gothic","맑은 고딕",sans-serif;font-size:17px;line-height:1.6}
button{font-family:inherit;font-size:17px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:17px}
.hidden{display:none !important}

/* 헤더 */
header{background:var(--accent);color:#fff;padding:0 20px;display:flex;
  align-items:center;gap:18px;height:68px;position:sticky;top:0;z-index:50}
header h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.3px}
header .spacer{flex:1}
header .who{font-size:15px;opacity:.9}
header .ver{font-size:13px;opacity:.65;background:rgba(255,255,255,.15);
  padding:3px 8px;border-radius:12px;letter-spacing:.02em}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;
  padding:6px 12px;border-radius:var(--radius)}
header button:hover{background:rgba(255,255,255,.28)}

.wrap{max-width:1080px;margin:0 auto;padding:20px}

/* 탭 */
nav.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:15px 20px;color:var(--sub);font-size:17px;
  border-bottom:2px solid transparent;margin-bottom:-2px;font-weight:600}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

.panel{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:20px;margin-bottom:16px}
.panel h2{margin:0 0 4px;font-size:20.5px}
.panel .desc{color:var(--sub);font-size:15px;margin-bottom:16px}

/* 폼 */
.section-title{font-size:15px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);padding:7px 12px;border-radius:var(--radius);
  margin:22px 0 12px}
.section-title:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field.wide{grid-column:1/-1}
.field label{display:block;font-size:16px;font-weight:700;margin-bottom:6px}
.field label .req{color:var(--warn);margin-left:3px}
.field input[type=text],.field input[type=number],.field input[type=date],
.field input[type=time],.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--radius);background:#fff}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;padding:10px 12px;
  border:1px solid var(--line);border-radius:var(--radius);background:#fff;
  max-height:190px;overflow:auto}
.checks label{display:flex;align-items:center;gap:5px;font-weight:400;
  font-size:15px;margin:0;cursor:pointer}
.hint{font-size:14px;color:var(--sub);margin-top:4px}
.err{border-color:var(--warn) !important}

/* 버튼 */
.btn{background:var(--accent);color:#fff;border:0;padding:14px 24px;
  border-radius:var(--radius);font-weight:700}
.btn:hover{background:#164a19}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
.btn.ghost:hover{background:var(--line2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;margin-top:22px;padding-top:16px;
  border-top:1px solid var(--line2)}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:16.5px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll-x table{min-width:860px}
td.nowrap,th.nowrap{white-space:nowrap}
th,td{padding:14px 14px;text-align:left;border-bottom:1px solid var(--line2)}
th{background:var(--line2);font-weight:700;font-size:15px;color:var(--sub);
  position:sticky;top:0}
tbody tr:hover{background:var(--accent-soft);cursor:pointer}
.empty{padding:40px 20px;text-align:center;color:var(--sub)}

/* 로그인 */
#loginView{max-width:380px;margin:70px auto}
#loginView .panel{padding:28px}
#loginView h2{font-size:23px;text-align:center;margin-bottom:20px}
#loginView .field{margin-bottom:14px}
#loginView .btn{width:100%}

/* 알림 */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:var(--radius);
  z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast.bad{background:var(--warn)}
.msg{padding:10px 12px;border-radius:var(--radius);font-size:15px;margin-bottom:14px}
.msg.bad{background:#fdeceb;color:var(--warn);border:1px solid #f5c6c2}
.msg.info{background:var(--accent-soft);color:var(--accent)}

/* 내담자 선택 */
.client-box{border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;background:#fafcfb;margin-bottom:6px}
.client-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.client-row .field{flex:1;min-width:130px}
.picked{display:flex;align-items:center;gap:12px;background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:var(--radius);padding:10px 14px}
.picked b{font-size:17px}
.results{margin-top:10px;border:1px solid var(--line);border-radius:var(--radius);
  background:#fff;max-height:210px;overflow:auto}
.results div{padding:9px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.results div:hover{background:var(--accent-soft)}
.results div:last-child{border-bottom:0}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(20,30,26,.45);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.modal{background:#fff;border-radius:var(--radius);max-width:720px;width:100%;
  padding:24px}
.modal h3{margin:0 0 16px;font-size:19.5px}
.dl{display:grid;grid-template-columns:170px 1fr;gap:1px;background:var(--line2);
  border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden}
.dl dt{background:#fafcfb;padding:9px 12px;font-weight:600;font-size:15px}
.dl dd{background:#fff;padding:9px 12px;margin:0;font-size:15px;white-space:pre-wrap}

/* 검색 바 */
.searchbar{display:flex;gap:10px;align-items:stretch;margin-bottom:6px}
.searchbar input{flex:1;padding:14px 16px;font-size:19.5px;border:2px solid var(--line);
  border-radius:var(--radius);background:#fff}
.searchbar input:focus{outline:0;border-color:var(--accent)}
.searchbar .btn{padding:0 28px;font-size:18.5px}

/* 퀵 버튼 */
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--sub);
  margin:22px 0 10px}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.qbtn{display:flex;flex-direction:column;justify-content:center;gap:3px;
  min-height:74px;padding:14px 16px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius);transition:background .12s,border-color .12s}
.qbtn:hover{background:var(--accent-soft);border-left-color:var(--accent-dark)}
.qbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qbtn b{font-size:19px;font-weight:700;color:var(--ink)}
.qbtn span{font-size:15px;color:var(--sub)}
.qbtn.alert{border-left-color:var(--warn)}
.qbtn.alert b{color:var(--warn)}

/* 이메일 도메인 빠른 입력 */
.domains{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.domain-chip{background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);
  border-radius:20px;padding:6px 13px;font-size:15.5px;font-weight:600}
.domain-chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 집단상담 참여자 */
.member-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:8px;margin-top:12px}
.member{display:flex;align-items:center;gap:9px;background:#fff;
  border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:10px 12px}
.member b{font-size:18px}
.member span{flex:1;font-size:14.5px;color:var(--sub)}
.member .btn{padding:4px 10px;font-size:15px}

/* 엑셀형 표 */
.grid-table{font-size:15.5px}
.grid-table th{position:sticky;top:0;z-index:2;background:var(--line2);
  box-shadow:inset 0 -1px 0 var(--line)}
/* 머리글은 스크롤 상자 맨 위에 붙습니다.
   페이지 헤더 높이만큼 내리면 상자 안에서는 첫 줄이 가려집니다. */
.grid-table td{padding:9px 11px;white-space:nowrap;max-width:220px;
  overflow:hidden;text-overflow:ellipsis}
.grid-table td.g-first{font-weight:700}
.grid-table tbody tr{cursor:pointer}
.grid-table tbody tr:nth-child(even){background:#fbfcfb}
.grid-table tbody tr:hover{background:var(--accent-soft)}
.cnt{font-size:16px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);padding:3px 10px;border-radius:12px;margin-left:6px}

/* 변경 이력 */
.audit-day{font-size:15px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);padding:7px 12px;border-radius:var(--radius);
  margin:20px 0 12px}
.chg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:15.5px;margin-top:5px;padding:5px 9px;background:var(--bg);
  border-radius:var(--radius)}
.chg-f{font-weight:700;min-width:90px}
.chg-b{color:var(--warn);text-decoration:line-through;opacity:.75}
.chg-arrow{color:var(--sub)}
.chg-a{color:var(--accent);font-weight:600}

/* 기록 카드 목록 */
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:13px 16px;cursor:pointer;transition:background .12s}
.rec:hover{background:var(--accent-soft)}
.rec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rec-name{font-size:19px;font-weight:700}
.rec-sub{font-size:15.5px;color:var(--sub)}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line2)}
.rec-grid > div{font-size:16px}
.rec-grid span{display:block;font-size:13px;color:var(--sub);margin-bottom:1px}

/* 시간 범위 입력 */
.timerange{display:flex;align-items:center;gap:9px}
.timerange input{flex:1;min-width:110px}
.tr-sep{color:var(--sub);font-weight:700}

/* 다중 선택 배타 항목 */
.checks label.excl{font-weight:700;color:var(--accent)}
.checks label.locked{opacity:.4;cursor:not-allowed}

/* 자동으로 채워진 칸 */
.prefilled{background:#f3f9f4}

/* 내담자 카드 목록 */
.person-list{display:flex;flex-direction:column;gap:10px}
.person{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:background .12s}
.person:hover{background:var(--accent-soft)}
.p-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.p-name{font-size:20.5px;font-weight:700}
.p-sub{font-size:16px;color:var(--sub)}
.p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}
.p-grid > div{font-size:16px}
.p-grid span{display:block;font-size:13px;color:var(--sub);margin-bottom:1px}

/* 선택된 내담자 정보 */
.picked-box{border:2px solid var(--accent);border-radius:var(--radius);
  padding:14px 16px;background:var(--accent-soft)}
.picked-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.picked-top b{font-size:22px}
.picked-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.picked-grid > div{background:#fff;border-radius:var(--radius);padding:9px 12px}
.picked-grid span{display:block;font-size:14px;color:var(--sub);margin-bottom:2px}
.picked-grid b{font-size:16.5px}

/* 내담자 상세 */
.who-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;
  padding-bottom:14px;border-bottom:2px solid var(--accent);margin-bottom:16px}
.who-head .nm{font-size:30px;font-weight:700;letter-spacing:-.5px}
.who-head .meta{color:var(--sub);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{background:var(--accent-soft);color:var(--accent);border-radius:20px;
  padding:5px 13px;font-size:15.5px;font-weight:600}
.chip.risk{background:#fdeceb;color:var(--warn)}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:18px}
.tl-item{position:relative;padding:12px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.tl-item:last-child{border-bottom:0}
.tl-item:hover{background:var(--accent-soft)}
.tl-item::before{content:'';position:absolute;left:-25px;top:19px;width:11px;height:11px;
  border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.tl-date{font-size:15px;color:var(--sub)}
.tl-title{font-weight:700;font-size:18px;margin:2px 0}
.tl-body{font-size:16px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 간이검사 문항 */
.qcard{border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:12px;background:#fff}
.qcard.miss{border-color:var(--warn);background:#fdf5f4}
.qtext{font-size:19px;font-weight:600;line-height:1.5;margin-bottom:14px}
.qno{display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:16px;font-weight:700;margin-right:10px;flex-shrink:0}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qopt{flex:1;min-width:130px;padding:14px 12px;font-size:17px;
  background:var(--bg);border:2px solid var(--line);border-radius:var(--radius);
  color:var(--ink);text-align:center;transition:all .12s}
.qopt:hover{border-color:var(--accent);background:var(--accent-soft)}
.qopt.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

/* 검사 결과 점수 */
.scores{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.score-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score-label{width:80px;font-weight:700;font-size:18.5px;flex-shrink:0}
.score-num{width:60px;text-align:right;font-weight:700;font-size:18.5px;flex-shrink:0}
.score-num.over{color:var(--warn)}
.score-cut{width:80px;font-size:15px;color:var(--sub);flex-shrink:0}
.bar-fill.over{background:var(--warn)}

/* 드래그 앤 드롭 영역 */
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;min-height:130px;margin-top:14px;padding:22px;text-align:center;cursor:pointer;
  border:2px dashed var(--line);border-radius:var(--radius);background:#fafcfb;
  transition:all .12s}
.dropzone:hover{border-color:var(--accent);background:var(--accent-soft)}
.dropzone.over{border-color:var(--accent);background:var(--accent-soft);
  border-style:solid;transform:scale(1.01)}
.dropzone b{font-size:19px}
.dropzone span{font-size:15.5px;color:var(--sub)}
.other-input{margin-top:7px}

/* 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:14px 16px}
.card.warn{border-color:var(--warn);background:#fdeceb}
.card-label{font-size:14px;color:var(--sub);margin-bottom:6px}
.card-value{font-size:25.5px;font-weight:700;letter-spacing:-.5px}
.card.warn .card-value{color:var(--warn)}

/* 막대 */
.bars{display:flex;flex-direction:column;gap:7px}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-label{width:170px;flex-shrink:0;font-size:15px;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.bar-track{flex:1;height:18px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--accent);border-radius:3px;min-width:2px}
.bar-num{width:88px;flex-shrink:0;text-align:right;font-size:15px;font-weight:600}
.bar-pct{color:var(--sub);font-weight:400;margin-left:6px;font-size:14px}

@media(max-width:720px){
  .bar-label{width:96px}
  .bar-num{width:70px}
}

@media(max-width:720px){
  .grid{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr}
  .dl dt{padding-bottom:2px}
  .wrap{padding:14px}
}
</style>
</head>
<body>

<!-- ══════ 설정 (최초 1회) ══════ -->
<div id="setupView" class="hidden">
  <div class="wrap" style="max-width:520px;margin-top:60px">
    <div class="panel">
      <h2>연결 설정</h2>
      <p class="desc">Supabase 대시보드 → Settings → API 에서 값을 복사해 넣으세요.
        이 브라우저에만 저장됩니다.</p>
      <div class="msg info">여러 사람이 쓸 때는 이 화면이 뜨지 않게 하는 편이 낫습니다.
        simony.html 맨 위의 <b>SUPABASE_URL</b>과 <b>SUPABASE_KEY</b>에 값을 적어 두면
        모두가 바로 로그인 화면으로 들어갑니다.</div>
      <div class="field" style="margin-bottom:12px">
        <label>Project URL</label>
        <input type="text" id="cfgUrl" placeholder="https://xxxx.supabase.co">
      </div>
      <div class="field">
        <label>anon public 키</label>
        <input type="text" id="cfgKey" placeholder="eyJhbGciOi...">
        <div class="hint">service_role 키가 아니라 anon 키를 넣으세요.</div>
      </div>
      <div class="actions"><button class="btn" onclick="saveConfig()">저장하고 시작</button></div>
    </div>
  </div>
</div>

<!-- ══════ 로그인 ══════ -->
<div id="loginView" class="hidden">
  <div class="panel">
    <h2>시모니 1.0</h2>
    <div id="loginMsg"></div>
    <div class="field"><label>아이디</label>
      <input type="text" id="email" autocomplete="username"
        placeholder="아이디" autocapitalize="off" spellcheck="false"
        onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
      <div class="hint">영문 소문자와 숫자로 된 아이디입니다. 모르시면 관리자에게 물어보세요.</div></div>
    <div class="field"><label>비밀번호</label>
      <input type="password" id="password" autocomplete="current-password"
        onkeydown="if(event.key==='Enter')doLogin()"></div>
    <label class="hint" style="display:flex;align-items:center;gap:7px;margin-bottom:14px;cursor:pointer">
      <input type="checkbox" id="remember"> 이 기기에서 아이디 기억하기</label>
    <button class="btn" id="loginBtn" onclick="doLogin()">로그인</button>
    <div class="hint" style="text-align:center;margin-top:14px" id="cfgLink"></div>
  </div>
</div>

<!-- ══════ 메인 ══════ -->
<div id="appView" class="hidden">
  <header>
    <h1>시모니 1.0</h1>
    <span class="ver" id="verTag"></span>
    <span class="who" id="whoami"></span>
    <span class="spacer"></span>
    <button onclick="doLogout()">로그아웃</button>
  </header>
  <div class="wrap">
    <nav class="tabs" id="tabs"></nav>
    <div id="content"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════

/* ── 생년월일: 8자리를 연속으로 치면 자동으로 하이픈이 들어갑니다 ──
   '19820801' → '1982-08-01'.  점·슬래시로 쳐도 받아줍니다. */
function normalizeBirth(v){
  const digits = String(v||'').replace(/[^0-9]/g,'');
  if(digits.length!==8) return null;
  const y=+digits.slice(0,4), m=+digits.slice(4,6), d=+digits.slice(6,8);
  if(y<1900 || y>new Date().getFullYear()) return null;
  if(m<1||m>12||d<1||d>31) return null;
  const dt=new Date(y, m-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return null;
  return `${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}`;
}
// 입력하는 동안 하이픈을 넣어 보여줍니다 (값 자체는 저장 시 normalizeBirth로 확정)
function maskBirth(el){
  const digits = el.value.replace(/[^0-9]/g,'').slice(0,8);
  let out = digits;
  if(digits.length>6) out = digits.slice(0,4)+'-'+digits.slice(4,6)+'-'+digits.slice(6);
  else if(digits.length>4) out = digits.slice(0,4)+'-'+digits.slice(4);
  el.value = out;
  const ok = digits.length===8 && normalizeBirth(digits);
  el.classList.toggle('err', digits.length===8 && !ok);
  return ok ? normalizeBirth(digits) : null;
}
// 생년월일 입력칸 HTML (공통)

    placeholder="19820801" value="${esc(value||'')}"
    oninput="maskBirth(this)${onDone?';'+onDone:''}">
    <div class="hint">숫자 8자리를 이어서 입력하면 자동으로 형식이 맞춰집니다</div>`;
}

/* ── 생년월일 → 연령대 (만 나이 기준) ── */
function ageFromBirth(birth){
  const b = normalizeBirth(birth) || birth;
  if(!b || !/^\d{4}-\d{2}-\d{2}$/.test(b)) return null;
  const [y,m,d] = b.split('-').map(Number);
  const t = new Date();
  let age = t.getFullYear()-y;
  if(t.getMonth()+1 < m || (t.getMonth()+1===m && t.getDate()<d)) age--;
  return age>=0 && age<120 ? age : null;
}
function ageGroupFromBirth(birth){
  const age = ageFromBirth(birth);
  if(age===null) return null;
  if(age<20) return '20대';
  if(age>=60) return '60대 이상';
  return Math.floor(age/10)*10 + '대';
}

function apiBase(){
  return (API_URL || localStorage.getItem('sb_api') || '').replace(/\/$/,'');
}
async function apiCall(path, opts){
  const base = apiBase();
  if(!base) throw new Error('백엔드 주소가 설정되지 않았습니다. 관리 → 내담자 DB 화면에서 등록하세요.');
  const { data:{ session } } = await sb.auth.getSession();
  const headers = Object.assign({}, opts?.headers||{});
  if(session?.access_token) headers['Authorization'] = 'Bearer '+session.access_token;
  const res = await fetch(base+path, Object.assign({}, opts, { headers }));
  if(!res.ok){
    let msg = res.status+' 오류';
    try{ const j = await res.json(); msg = j.error || msg; }catch(e){}
    throw new Error(msg);
  }
  return res;
}

    S.regions = allRegions || [];

    const { data: mine } = await sb.from('user_regions').select('region_id').eq('user_id', me.id);
    const seed = new Set((mine||[]).map(r=>r.region_id));
    let grew = true;
    while(grew){                       // 하위지역까지 펼치기
      grew = false;
      for(const r of (allRegions||[])){
        if(r.parent_id && seed.has(r.parent_id) && !seed.has(r.id)){ seed.add(r.id); grew = true; }
      }
    }
    S.regions = (allRegions||[]).filter(r=>seed.has(r.id));
  }

  const { data: forms } = await sb.from('forms').select('*').eq('is_active',true).order('sort_order');
  S.forms = forms || [];

  await loadLookups();

  const roleLabel = { super_admin:'최종관리자', manager:'중간관리자', counselor:'상담사' }[me.role] || me.role;

}

async function loadLookups(){

// lookup_source와 지역에 맞는 선택지 목록
function lookupOptions(source, regionId){
  // 소방서/센터 = 그 지역의 하위지역 목록
  if(source==='subregion'){
    if(!regionId) return [];
    const kids = S.allRegions.filter(r=>r.parent_id===regionId);
    if(kids.length) return kids.map(r=>r.name);
    // 이미 하위지역을 고른 상태라면 형제들을 보여 준다
    const me = S.allRegions.find(r=>r.id===regionId);
    if(me?.parent_id){
      return S.allRegions.filter(r=>r.parent_id===me.parent_id).map(r=>r.name);
    }
    return [];
  }
  if(source==='department'){
    return S.depts.filter(d=>!regionId || d.region_id===regionId).map(d=>d.name);
  }
  if(source==='rank' || source==='duty'){
    return (S.codes[source]||[])
      .filter(c=>!c.region_id || !regionId || c.region_id===regionId)
      .map(c=>c.label);
  }
  return [];
}
const OTHER = '기타(직접 입력)';

/* 지역 목록을 상위 → 그 하위 순서로 줄 세웁니다.
   그냥 나열하면 상위와 하위가 뒤섞여 어느 것이 상위인지 알 수 없습니다. */
function regionTree(list){
  const arr = list || S.regions;
  const tops = arr.filter(r=>!r.parent_id)
    .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0) || a.name.localeCompare(b.name));
  const out = [];
  for(const t of tops){
    out.push({ ...t, depth:0 });
    arr.filter(r=>r.parent_id===t.id)
      .sort((a,b)=>(a.sort_order||0)-(b.sort_order||0) || a.name.localeCompare(b.name))
      .forEach(k=>out.push({ ...k, depth:1 }));
  }
  // 상위가 목록에 없는 하위지역도 빠뜨리지 않습니다
  const seen = new Set(out.map(r=>r.id));
  arr.filter(r=>!seen.has(r.id)).forEach(r=>out.push({ ...r, depth:1 }));
  return out;
}
// 드롭다운 항목 만들기
function regionOptionsHTML(selectedId, opt){
  const showKind = !(opt && opt.plain);
  return regionTree().map(r=>{
    const label = r.depth
      ? '　└ ' + r.name
      : r.name + (showKind ? ' (상위지역)' : '');
    return `<option value="${r.id}" ${r.id===selectedId?'selected':''}>${esc(label)}</option>`;
  }).join('');
}
// 목록에 이미 '기타'가 들어 있으면 별도의 직접 입력 항목을 만들지 않습니다
function hasOwnOther(list){

function needOther(f, list){

   openTab은 기록을 남기고, 뒤로가기로 들어올 때는 showTab만 부릅니다. */
function openTab(tab, opts){
  const replace = opts && opts.replace;
  if(location.hash.slice(1) !== tab){
    if(replace) history.replaceState({ tab }, '', '#'+tab);
    else history.pushState({ tab }, '', '#'+tab);
  }
  showTab(tab);
}

function openClient(id){
  if(location.hash.slice(1) !== 'client:'+id){
    history.pushState({ tab:'client:'+id }, '', '#client:'+id);
  }
  return showClient(id);
}
function routeFromHash(){
  const raw = location.hash.slice(1);
  if(!raw){ showTab('home'); return; }
  if(raw.startsWith('client:')){ showClient(raw.slice(7)); return; }
  showTab(raw);
}

  routeFromHash();
});

function showTab(tab){
  S.tab = tab;
  document.querySelectorAll('#tabs button').forEach(b=>
    b.classList.toggle('on', b.dataset.tab===tab
      || (tab.startsWith('admin:') && b.dataset.tab==='admin:forms')
      || (tab.startsWith('list') && b.dataset.tab==='list')));
  const [mode,id] = tab.split(':');
  if(mode==='home'){ renderHome(); return; }
  if(mode==='myclients'){ showMyClients(); return; }
  if(mode==='stats'){ renderStats(); return; }
  if(mode==='admin'){ renderAdmin(id); return; }
  if(mode==='list'){
    // 폼을 지정하지 않으면 마지막으로 보던 폼(없으면 첫 폼)을 씁니다
    S.form = S.forms.find(f=>f.id===(id || S._listForm)) || S.forms[0];
    S._listForm = S.form?.id;
    renderList();
    return;
  }
  S.form = S.forms.find(f=>f.id===id);
  if(mode==='form') renderForm();
}

/* ═══════════════════════════════════════════════════
   폼 렌더러 — form_fields 정의대로 입력 화면을 그림
   ═══════════════════════════════════════════════════ */
async function renderForm(){
  const c=$('content');
  c.innerHTML='<div class="panel"><div class="empty">불러오는 중…</div></div>';

  const { data: fields, error } = await sb.from('form_fields').select('*')
    .eq('form_id', S.form.id).eq('is_active', true).order('sort_order');
  if(error){ c.innerHTML=`<div class="panel"><div class="msg bad">항목을 불러오지 못했습니다: ${esc(error.message)}</div></div>`; return; }
  S.fields = fields || [];
  S.client = S._preClient || null;
  S.members = [];
  const preRegion = S._preClient?.region_id;
  S._preClient = null;

  // 지역 선택
  const regionOpts = regionOptionsHTML(preRegion, { plain:true });

  let html = `<div class="panel">
    <h2>${esc(S.form.title)}</h2>
    <div class="desc">${esc(S.form.description||'')}</div>
    <div class="section-title">작성 정보</div>
    <div class="grid">
      <div class="field">
        <label>지역<span class="req">*</span></label>
        <select id="f_region" onchange="onRegionChange()">${regionOpts}</select>
      </div>
      <div class="field">
        <label>작성자</label>
        <input type="text" value="${esc(S.me.name)}" disabled>
      </div>
    </div>`;

  if(S.form.links_client) html += isGroupForm() ? memberPickerHTML() : clientPickerHTML();

  // 항목을 구획별로 묶어 렌더링
  const bySection = {};
  for(const f of S.fields){
    const k = f.section || '입력 항목';
    (bySection[k] = bySection[k] || []).push(f);
  }
  for(const [sec, list] of Object.entries(bySection)){
    html += `<div class="section-title">${esc(sec)}</div><div class="grid">`;
    html += list.map(f=>renderField(f, preRegion || S.regions[0]?.id)).join('');
    html += `</div>`;
  }

  html += `<div class="actions">
      <button class="btn" id="saveBtn" onclick="saveRecord()">저장</button>
      <button class="btn ghost" onclick="renderForm()">초기화</button>
    </div></div>`;
  c.innerHTML = html;
  if(isGroupForm()){
    if(S.client){ S.members=[S.client]; S.client=null; }
    renderMemberArea();
  }else if(S.client){
    renderClientArea();     // 상세페이지에서 넘어온 경우 미리 선택된 상태로
    applyAutoFill();
    prefillFromClient(S.client);
  }
}

// 항목 하나를 유형에 맞는 입력칸으로 변환
function renderField(f, regionId){
  const id = 'fld_'+f.field_key;
  const req = f.required ? '<span class="req">*</span>' : '';
  const wide = ['textarea','multiselect'].includes(f.field_type) ? ' wide' : '';
  let input='';

  // 자동 계산 항목 (생년월일 → 연령대)
  if(f.auto_fill==='age_group'){
    return `<div class="field" data-key="${f.field_key}">
      <label for="${id}">${esc(f.label)}${req}</label>
      <input type="text" id="${id}" readonly placeholder="생년월일을 넣으면 자동으로 채워집니다"
        style="background:var(--line2)">
      <div class="hint">내담자를 고르면 만 나이로 계산해 자동으로 채웁니다</div></div>`;
  }

  switch(f.field_type){
    case 'textarea':
      input = `<textarea id="${id}"></textarea>`; break;
    case 'number':
      input = `<input type="number" id="${id}">`; break;
    case 'date':
      input = `<input type="date" id="${id}">`; break;
    case 'time':
      input = `<input type="time" id="${id}" onchange="recalcDuration()">`; break;
    case 'timerange':
      // 시작·종료를 골라 넣으면 소요시간이 자동으로 계산됩니다
      input = `<div class="timerange">
          <input type="time" id="${id}_start" onchange="recalcDuration()" step="300">
          <span class="tr-sep">→</span>
          <input type="time" id="${id}_end" onchange="recalcDuration()" step="300">
        </div>
        <div class="hint" id="${id}_out">시작과 종료를 고르면 소요시간이 자동으로 채워집니다</div>`;
      break;
    case 'checkbox':
      input = `<label style="font-weight:400"><input type="checkbox" id="${id}"> 예</label>`; break;
    case 'select': {
      // 마스터 표 연동이면 지역에 맞는 선택지를 실시간으로 만든다
      const dynamic = !!f.lookup_source;
      const list = dynamic ? lookupOptions(f.lookup_source, regionId) : (f.options||[]);
      const opts = list.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
      // 목록에 이미 '기타'류가 있으면 따로 붙이지 않습니다.
      // 그러지 않으면 '기타'와 '기타(직접 입력)'이 나란히 떠서 헷갈립니다.
      const other = needOther(f, list) ? `<option value="${OTHER}">${OTHER}</option>` : '';
      input = `<select id="${id}" ${dynamic?`data-lookup="${f.lookup_source}"`:''}
          onchange="toggleOther('${id}')">
          <option value="">— 선택 —</option>${opts}${other}</select>
        <input type="text" id="${id}_other" class="other-input hidden"
          placeholder="${esc(f.label)}을(를) 직접 입력">`;
      if(dynamic && !list.length){
        input += `<div class="hint" style="color:var(--warn)">
          이 지역의 ${esc(f.label)} 목록이 아직 없습니다. 관리 → 소속과 직급에서 추가하세요.</div>`;
      }
      break;
    }
    case 'multiselect': {
      // exclusive_options에 든 항목은 다른 것과 함께 고를 수 없습니다 (예: '1. 정상')
      const excl = new Set(f.exclusive_options||[]);
      const boxes = (f.options||[]).map(o=>
        `<label${excl.has(o)?' class="excl"':''}>
          <input type="checkbox" name="${id}" value="${esc(o)}"
            ${excl.has(o)?'data-exclusive="1"':''}
            onchange="onMultiPick('${id}', this)"> ${esc(o)}</label>`).join('');
      input = `<div class="checks" id="${id}">${boxes||'<span class="hint">선택지가 없습니다</span>'}</div>`
        + (excl.size ? `<div class="hint">'${esc([...excl][0])}'을(를) 고르면 나머지는 함께 고를 수 없습니다</div>` : '');
      break;
    }
    case 'file':
      input = `<input type="text" id="${id}" placeholder="파일 주소(URL)">
               <div class="hint">파일 업로드는 다음 버전에 연결됩니다. 지금은 주소를 붙여넣으세요.</div>`; break;
    default:
      input = `<input type="text" id="${id}">`;
  }
  return `<div class="field${wide}" data-key="${f.field_key}">
    <label for="${id}">${esc(f.label)}${req}</label>${input}</div>`;
}

/* 다중 선택에서 '정상' 같은 배타 항목 처리
   · 배타 항목을 고르면 나머지가 모두 풀리고 잠깁니다
   · 나머지를 고르면 배타 항목이 풀립니다 */
function onMultiPick(groupId, el){
  const boxes = [...document.querySelectorAll(`input[name="${groupId}"]`)];
  const isExcl = el.dataset.exclusive === '1';
  if(isExcl && el.checked){
    boxes.forEach(b=>{ if(b!==el) b.checked = false; });
  }else if(!isExcl && el.checked){
    boxes.forEach(b=>{ if(b.dataset.exclusive === '1') b.checked = false; });
  }
  syncExclusiveLock(groupId);
}
// 배타 항목이 켜져 있으면 나머지를 눌러도 반응하지 않게 흐리게 만듭니다
function syncExclusiveLock(groupId){
  const boxes = [...document.querySelectorAll(`input[name="${groupId}"]`)];
  const exclOn = boxes.some(b=>b.dataset.exclusive === '1' && b.checked);
  boxes.forEach(b=>{
    if(b.dataset.exclusive === '1') return;
    b.disabled = exclOn;
    b.closest('label')?.classList.toggle('locked', exclOn);
  });
}

/* 시작·종료 시각에서 소요시간(분)을 계산해 넣습니다.
   자정을 넘기면 다음 날로 봅니다(야간 상담 대비). */
function minutesOf(v){
  const m = String(v||'').match(/^(\d{1,2}):(\d{2})/);
  return m ? (+m[1])*60 + (+m[2]) : null;
}
function recalcDuration(){
  let a=null, b=null, outId=null;
  // 시작~종료가 한 항목으로 묶인 경우
  for(const f of (S.fields||[])){
    if(f.field_type!=='timerange') continue;
    const st=$('fld_'+f.field_key+'_start'), en=$('fld_'+f.field_key+'_end');
    if(!st||!en) continue;
    a=minutesOf(st.value); b=minutesOf(en.value); outId='fld_'+f.field_key+'_out';
    break;
  }
  // 시작·종료가 따로 있는 경우 (집단상담)
  if(a===null && b===null){
    const st=$('fld_time_start'), en=$('fld_time_end');
    if(st&&en){ a=minutesOf(st.value); b=minutesOf(en.value); }
  }
  if(a===null || b===null) return;
  let diff = b - a;
  if(diff < 0) diff += 24*60;          // 자정을 넘긴 경우
  const dur = $('fld_duration') || $('fld_duration_min');
  if(dur) dur.value = diff;
  const out = outId ? $(outId) : null;
  if(out) out.textContent = diff>0
    ? `소요시간 ${diff}분 (${Math.floor(diff/60)}시간 ${diff%60}분)`
    : '종료 시각이 시작보다 빠릅니다. 다시 확인해 주세요.';
}

// '기타(직접 입력)'을 고르면 옆에 텍스트칸이 열린다
function toggleOther(id){
  const sel=$(id), other=$(id+'_other');
  if(!sel||!other) return;
  const on = sel.value===OTHER;
  other.classList.toggle('hidden', !on);
  if(!on){ other.value=''; other.classList.remove('err'); }
}
// 값을 넣어 준 뒤 직접 입력칸까지 한 번에 맞춰 줍니다
function setSelectValue(id, v){
  const sel=$(id); if(!sel) return false;
  const opts=[...sel.options].map(o=>o.value);
  if(opts.includes(v)){ sel.value=v; toggleOther(id); return true; }
  if(opts.includes(OTHER)){
    sel.value=OTHER; toggleOther(id);
    const other=$(id+'_other'); if(other) other.value=v;
    return true;
  }
  return false;
}
// 셀렉트의 실제 값 (기타면 직접 입력값)
function selectValue(id){
  const sel=$(id); if(!sel) return null;
  if(sel.value===OTHER){
    const v=$(id+'_other')?.value.trim();
    return v || null;
  }
  return sel.value || null;
}

// 지역이 바뀌면 지역에 매인 드롭다운(상세소속 등)을 다시 만든다
function refreshLookupFields(){
  const regionId = $('f_region')?.value;
  document.querySelectorAll('select[data-lookup]').forEach(sel=>{
    const src = sel.dataset.lookup;
    const prev = sel.value;
    const list = lookupOptions(src, regionId);
    const withOther = !hasOwnOther(list);
    sel.innerHTML = '<option value="">— 선택 —</option>'
      + list.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')
      + (withOther ? `<option value="${OTHER}">${OTHER}</option>` : '');
    // 이전 값이 새 목록에도 있으면 유지
    if(prev && (list.includes(prev) || (withOther && prev===OTHER))) sel.value = prev;
    else { sel.value=''; }
    toggleOther(sel.id);   // 직접 입력칸 상태를 선택값에 맞춰 정리
  });
}

// 선택된 내담자에서 자동 계산 항목을 채운다
function applyAutoFill(){
  for(const f of S.fields){
    if(f.auto_fill!=='age_group') continue;
    const el = $('fld_'+f.field_key);
    if(!el) continue;
    const g = S.client?.birth_date ? ageGroupFromBirth(S.client.birth_date) : null;
    el.value = g || '';
  }
}

async function searchMember(){
  const q = $('mSearch').value.trim();
  const box = $('mResults');
  if(!q){ box.innerHTML=''; return; }
  const region = $('f_region').value;
  const { data, error } = await sb.from('clients').select('*')
    .eq('region_id', region).ilike('name', `%${q}%`)
    .in('status', ['재직','휴직']).limit(30);
  if(error){ box.innerHTML=`<div class="msg bad">${esc(error.message)}</div>`; return; }
  const already = new Set(S.members.map(m=>m.id));
  const rows = (data||[]).filter(c=>!already.has(c.id));
  if(!rows.length){
    box.innerHTML = `<div class="hint" style="margin-top:10px">
      ${(data||[]).length ? '찾은 사람은 이미 참여자에 있습니다.'
        : `'${esc(q)}' 이름의 내담자가 이 지역에 없습니다.`}</div>`;

  box.innerHTML = '<div class="results">' + rows.map(c=>
    `<div onclick='addMember(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
      <b>${esc(c.name)}</b> · ${esc(c.birth_date||'')} · ${esc(c.gender||'')}
      · ID ${esc(c.internal_id||'')}

}
function addMember(c){
  if(S.members.some(m=>m.id===c.id)) return;
  S.members.push(c);
  renderMemberArea();
  toast(`${c.name} 님을 참여자에 더했습니다`);
}

function clearMembers(){

async function searchClient(){
  const q = $('cSearch').value.trim();
  const box = $('cResults');
  if(!q){ box.innerHTML=''; return; }
  const region = $('f_region').value;
  // 전출·퇴직자는 새 기록 작성 대상에서 빼 준다 (과거 이력 조회는 상세페이지에서 가능)
  const { data, error } = await sb.from('clients').select('*')
    .eq('region_id', region).ilike('name', `%${q}%`)
    .in('status', ['재직','휴직']).limit(30);
  if(error){ box.innerHTML=`<div class="msg bad">${esc(error.message)}</div>`; return; }
  if(!data.length){
    box.innerHTML = `<div class="hint" style="margin-top:10px">
      '${esc(q)}' 이름의 내담자가 이 지역에 없습니다.
      ${canManage() ? '새로 등록하거나 지역을 확인해 보세요.'
                    : '명부에 없는 사람입니다. 관리자에게 등록을 요청하세요.'}</div>`;
    return;
  }
  box.innerHTML = '<div class="results">' + data.map(c=>
    `<div onclick='pickClient(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
      <b>${esc(c.name)}</b> · ${esc(c.birth_date)} · ${esc(c.gender)} · ID ${esc(c.internal_id)}
    </div>`).join('') + '</div>';
}
function unpickClient(){
  S.client = null;
  renderClientArea();
  applyAutoFill();
}
function pickClient(c){
  S.client = c;
  renderClientArea();
  applyAutoFill();          // 생년월일 → 연령대 자동 채움
  prefillFromClient(c);     // 명부의 소속·직급을 폼에도 옮겨 적는다
}
/* 명부에 있는 값을 폼의 같은 뜻 항목에 미리 채워 준다.
   상담사가 매번 같은 걸 다시 고르지 않도록 하되, 언제든 고칠 수 있게 입력칸에 값만 넣는다.
   폼마다 항목 이름이 달라도 아래 대응표로 찾아간다. */
const CLIENT_FILL = {
  // 폼 항목 키   ← 명부(clients.extra)의 어떤 값을 가져올지
  station:    ['department', 'station'],          // 소속 소방서
  dept:       ['team', 'dept', 'department'],     // 상세 부서·팀
  department: ['team', 'department'],             // (구 항목 이름 대비)
  rank:       ['rank'],                           // 계급
  client_rank:['rank'],
  job:        ['duty', 'job'],                    // 직무
  duty:       ['duty', 'job'],
};
function prefillFromClient(c){
  if(!c) return;
  let filled = 0;
  for(const f of (S.fields||[])){
    const sources = CLIENT_FILL[f.field_key];
    if(!sources) continue;
    let v = null;
    for(const key of sources){
      const got = c.extra?.[key];
      if(got){ v = got; break; }
    }
    if(!v) continue;

    const el = $('fld_'+f.field_key);
    if(!el) continue;

    if(el.tagName === 'SELECT'){
      const opts = [...el.options].map(o=>o.value);
      // 표기가 조금 달라도 찾아 준다 ('진주소방서' → 목록의 '진주')
      const loose = opts.find(o => o && o!==OTHER &&
        (o===v || v.includes(o) || o.includes(v)));
      if(!setSelectValue('fld_'+f.field_key, loose || v)) continue;
    }else{
      el.value = v;
    }
    el.classList.add('prefilled');
    filled++;
  }
  if(filled) showPrefillNote(filled);
}
// 자동으로 채웠다는 것을 알려 준다. 모르고 넘어가면 틀린 값이 그대로 저장된다.
function showPrefillNote(n){
  const area = $('clientArea') || $('memberArea');
  if(!area) return;
  let note = document.getElementById('prefillNote');
  if(!note){
    note = document.createElement('div');
    note.id = 'prefillNote';
    note.className = 'msg info';
    note.style.marginTop = '10px';
    area.appendChild(note);
  }
  note.innerHTML = `명부에 있던 정보 ${n}가지를 아래 칸에 자동으로 채웠습니다.
    <b>다르면 그 자리에서 고치시면 됩니다.</b>`;
}

    <div class="grid">
      <div class="field"><label>이름<span class="req">*</span></label>
        <input type="text" id="nc_name"></div>
      <div class="field"><label>생년월일<span class="req">*</span></label>

      <div class="field"><label>성별<span class="req">*</span></label>
        <select id="nc_gender"><option value="">— 선택 —</option>
          <option>남</option><option>여</option></select></div>

async function createClient(){
  if(!canManage()){ toast('내담자 등록은 관리자만 할 수 있습니다','bad'); return; }
  const region = $('f_region').value;
  document.querySelectorAll('#cNew .err').forEach(e=>e.classList.remove('err'));

  const name = $('nc_name').value.trim();
  const birth = normalizeBirth($('nc_birth').value);
  const gender = $('nc_gender').value;
  const iid = $('nc_iid').value.trim();

  const missing = [];
  let firstEl = null;
  const need = (cond, label, el)=>{
    if(cond) return;
    missing.push(label);
    if(el){ el.classList.add('err'); if(!firstEl) firstEl = el; }
  };
  need(!!name, '이름', $('nc_name'));
  need(!!birth, '생년월일', $('nc_birth'));
  need(!!gender, '성별', $('nc_gender'));
  const did = $('nc_did').value.trim();
  const emp = $('nc_empno').value.trim();
  need(!!(iid || did || emp), '식별번호(개인식별아이디·디지털·사번 중 하나)', $('nc_iid'));

  // 지역별 필수 항목 (상세소속·직급 등)
  const extra = {};
  for(const d of S.clientDefs){
    const el=$('nc_'+d.field_key);
    if(!el) continue;
    const v = d.lookup_source ? selectValue('nc_'+d.field_key) : (el.value.trim?.() || el.value || null);
    if(v) extra[d.field_key]=v;
    need(!d.required || !!v, d.label, el);
  }

  if(missing.length){
    toast('필수 항목을 채우세요: '+missing.slice(0,3).join(', ')+(missing.length>3?' 외':''),'bad');
    focusMissing(firstEl);
    return;
  }
  if(!$('nc_birth').value.replace(/[^0-9]/g,'').length){
    toast('생년월일을 숫자 8자리로 입력하세요','bad'); return;
  }

  const row = {
    region_id: region, name, birth_date: birth, gender,
    internal_id: iid || did || emp,
    personal_id: iid || null,
    digital_id: did || null,
    employee_no: emp || null,
    status: '재직', extra,
  };
  const { data, error } = await sb.from('clients').insert(row).select().single();
  if(error){
    toast(error.code==='23505' ? '이미 등록된 개인식별아이디입니다'
                               : '등록하지 못했습니다: '+error.message, 'bad');
    return;
  }
  toast('내담자를 등록했습니다');
  if(isGroupForm()){ $('cNew').classList.add('hidden'); addMember(data); }
  else pickClient(data);
}

/* 시각을 잘못 골라 소요시간이 터무니없이 길어지는 일을 막습니다.
   오전 2시를 오후 2시로 고르는 실수가 현장에서 흔합니다. */
const DURATION_WARN = 480;    // 8시간
function checkDuration(data){
  const mins = Number(data.duration ?? data.duration_min);
  if(!Number.isFinite(mins)) return null;
  if(mins <= 0){
    return '소요시간이 0분 이하입니다. 시작과 종료 시각을 다시 확인해 주세요.\n'
         + '이대로 저장할까요?';
  }
  if(mins > DURATION_WARN){
    const h = Math.floor(mins/60), m = mins%60;
    return `소요시간이 ${h}시간 ${m}분으로 계산되었습니다.\n`
         + '오전과 오후를 잘못 고르지 않았는지 확인해 주세요.\n\n'
         + '확인했고 이대로 저장할까요?';
  }
  return null;
}
// 누락된 첫 항목으로 화면을 옮겨 준다. 어디가 비었는지 찾아 헤매지 않도록.
function focusMissing(firstEl){
  if(!firstEl) return;
  const box = firstEl.closest('.field') || firstEl;
  box.scrollIntoView?.({ behavior:'smooth', block:'center' });
  const focusable = box.querySelector('input,select,textarea');
  setTimeout(()=>focusable?.focus({ preventScroll:true }), 260);
}

async function saveRecord(){
  const btn=$('saveBtn');
  document.querySelectorAll('.err').forEach(e=>e.classList.remove('err'));

  const data = {};
  const missing = [];
  let firstMissingEl = null;

  // 내담자(또는 참여자)를 안 골랐으면 그 영역부터
  if(S.form.links_client){
    if(isGroupForm()){
      if(!S.members.length){ missing.push('참여자'); firstMissingEl = $('memberArea'); }
    }else if(!S.client){
      missing.push('내담자'); firstMissingEl = $('clientArea');
    }
  }

  for(const f of S.fields){
    const el = $('fld_'+f.field_key);
    let v = null;
    if(f.field_type==='multiselect'){
      v = [...document.querySelectorAll(`input[name="fld_${f.field_key}"]:checked`)].map(x=>x.value);
      if(!v.length) v = null;
    }else if(f.field_type==='checkbox'){
      v = el ? el.checked : null;
    }else if(f.field_type==='number'){
      v = (!el || el.value==='') ? null : Number(el.value);
    }else if(f.field_type==='select'){
      v = selectValue('fld_'+f.field_key);
    }else if(f.field_type==='timerange'){
      const st=$('fld_'+f.field_key+'_start')?.value;
      const en=$('fld_'+f.field_key+'_end')?.value;
      // 구버전과 같은 형태(1400-1500)로 저장해 통계·인쇄에서 그대로 씁니다
      v = (st && en) ? st.replace(':','') + '-' + en.replace(':','') : null;
    }else{
      v = el ? (el.value.trim() || null) : null;
    }

    if(f.required && (v===null || v==='' )){
      missing.push(f.label);
      const target = el || $('fld_'+f.field_key+'_start') || $('fld_'+f.field_key);
      if(target){
        target.classList.add('err');
        if(!firstMissingEl) firstMissingEl = target;
      }
    }
    if(v!==null) data[f.field_key]=v;
  }

  if(missing.length){
    toast('채우지 않은 필수 항목이 '+missing.length+'개 있습니다: '
      + missing.slice(0,2).join(', ') + (missing.length>2?' 외':''), 'bad');
    focusMissing(firstMissingEl);
    return;
  }

  // 소요시간이 지나치게 길면 오전·오후를 잘못 고른 경우가 많습니다.
  const durCheck = checkDuration(data);
  if(durCheck && !confirm(durCheck)) return;

  const base = {
    form_id: S.form.id,
    region_id: $('f_region').value,
    data,
    author_id: S.me.id,
    author_name: S.me.name,
  };

  let rows;
  if(isGroupForm()){
    // 같은 group_id로 묶어 참여자마다 한 줄씩 남깁니다
    const groupId = 'GRP_' + Date.now();
    rows = S.members.map(m => Object.assign({}, base, {
      group_id: groupId,
      client_id: m.id,
      client_name: m.name,
      birth_date: m.birth_date,
      gender: m.gender,
      client_internal_id: m.internal_id,
    }));
  }else{
    const one = Object.assign({}, base);
    if(S.form.links_client && S.client){
      one.client_id = S.client.id;
      one.client_name = S.client.name;
      one.birth_date = S.client.birth_date;
      one.gender = S.client.gender;
      one.client_internal_id = S.client.internal_id;
    }
    rows = [one];
  }

  btn.disabled=true; btn.textContent='저장 중…';
  const { error } = await sb.from('form_records').insert(rows);
  btn.disabled=false; btn.textContent='저장';
  if(error){ toast('저장하지 못했습니다: '+error.message,'bad'); return; }
  toast(rows.length>1
    ? `${S.form.title}을(를) 저장했습니다 (참여자 ${rows.length}명)`
    : `${S.form.title}을(를) 저장했습니다`);
  renderForm();
}

          ${f.id===S.form.id?'selected':''}>${esc(f.title)}</option>`).join('')}
      </select></div></div>`;

  if(!recs.length){
    html += `<div class="empty">아직 저장된 기록이 없습니다.<br>
      위쪽 '${esc(S.form.title)}' 탭에서 첫 기록을 남겨보세요.</div></div>`;
    c.innerHTML = html; return;
  }

  // 카드로 그립니다. 좁은 화면에서도 찌그러지지 않습니다.
  html += `<div class="rec-list">`;
  recs.forEach((r,i)=>{
    const cells = cols.map(f=>{

                  style="color:var(--accent)">${esc(r.client_name||'이름 없음')}</a>`
              : esc(r.client_name||'이름 없음')}</span>`
          : `<span class="rec-name">${esc(r.data?.title || r.data?.place || S.form.title)}</span>`}
        <span class="rec-sub">${fmtDate(r.created_at)} · ${esc(rname[r.region_id]||'')}
          · ${esc(r.author_name||'')}</span>
        ${r.group_id ? `<span class="chip">집단</span>` : ''}
      </div>
      ${cells ? `<div class="rec-grid">${cells}</div>` : ''}
    </div>`;
  });
  html += `</div></div>`;
  c.innerHTML = html;
  S._recs = recs;
  console.log('[시모니] 기록 목록', S.form.title, '→', recs.length, '건');
}
function cellText(v){
  if(v===null||v===undefined) return '';
  if(Array.isArray(v)) return v.join(', ');
  if(typeof v==='boolean') return v?'예':'아니오';
  const s=String(v);
  return s.length>28 ? s.slice(0,28)+'…' : s;
}
/* ═══════════════════════════════════════════════════
   관리 화면 — 폼 / 지역 / 사용자
   여기서 바꾼 내용이 곧바로 입력 화면에 반영됩니다.
   ═══════════════════════════════════════════════════ */
const FIELD_TYPES = [
  ['text','한 줄 글'],['textarea','여러 줄 글'],['number','숫자'],
  ['date','날짜'],['time','시각'],['select','하나 선택'],
  ['multiselect','여러 개 선택'],['checkbox','예/아니오'],['file','파일'],
];
const typeLabel = t => (FIELD_TYPES.find(x=>x[0]===t)||[t,t])[1];

function renderAdmin(sub){
  // 중간관리자는 자기 지역 운영에 필요한 것만 봅니다.
  // 지역·사용자·폼은 전 지역에 영향을 주므로 최종관리자만 다룹니다.

               'sync','내담자 DB','upload','검사 업로드'];

    nav.unshift('forms','폼과 항목');
    nav.splice(4, 0, 'regions','지역');
    nav.push('audit','수정 로그');

  let html = '<div class="panel" style="padding:0;overflow:hidden">'
    + '<div style="display:flex;gap:2px;background:var(--line2);padding:4px">';
  for(let i=0;i<nav.length;i+=2){

      style="flex:1;padding:9px;border:0;border-radius:var(--radius);font-weight:600;

  }
  html += '</div></div><div id="adminBody"></div>';
  $('content').innerHTML = html;
  // 권한이 없는 화면은 열지 않습니다
  if(['forms','regions','audit'].includes(sub) && !isSuper()){
    $('adminBody').innerHTML = `<div class="panel"><div class="msg bad">
      이 화면은 최종관리자만 볼 수 있습니다.
      <div class="hint" style="margin-top:6px;color:inherit">
        지역·사용자·폼은 모든 지역이 함께 쓰기 때문입니다.
        필요하신 것이 있으면 최종관리자에게 말씀해 주세요.</div></div></div>`;
    return;
  }
  if(sub==='grid') adminGrid();
  else if(sub==='audit') adminAudit();
  else if(sub==='forms') adminForms();
  else if(sub==='regions') adminRegions();
  else if(sub==='master') adminMaster();
  else if(sub==='sync') adminSync();
  else if(sub==='upload') adminUpload();
  else adminUsers();
}

async function adminRegions(){

  let html = `<div class="panel">

    <div class="desc">상위지역 아래 하위지역을 둡니다. 상위지역 권한을 받은 사람은 그 아래 전부를 봅니다.</div>
    <table><thead><tr><th>지역</th><th>소속</th><th></th></tr></thead><tbody>`;
  if(!regions.length) html += `<tr><td colspan="3"><div class="empty">지역이 없습니다.</div></td></tr>`;
  for(const t of tops){
    html += regionRow(t, false);

  }
  html += `</tbody></table>
    <div class="actions"><button class="btn" onclick="editRegion(null,null)">상위지역 추가</button></div></div>`;
  $('adminBody').innerHTML = html;

function regionRow(r, child, parentName){

    <td>${child?'<span style="color:var(--sub)">└ </span>':'<b>'}${esc(r.name)}${child?'':'</b>'}</td>
    <td>${child?esc(parentName):'—'}</td>
    <td style="text-align:right;white-space:nowrap">

function editRegion(id, parentId){
  if(!isSuper()){ toast('지역은(는) 최종관리자만 다룰 수 있습니다','bad'); return; }
  const r = id ? S._aregions.find(x=>x.id===id) : null;
  const isNew = !r;
  /* 설정 복사는 '상위지역을 새로 만들 때'만 뜻이 있습니다.
     하위지역(소방서)은 그 아래 부서 목록을 따로 갖지 않으므로 가져올 것이 없습니다. */
  const sources = (isNew && !parentId)
    ? S._aregions.filter(x=>!x.parent_id)
    : [];
  const copyBox = sources.length ? `
    <div class="field" style="margin-top:14px">
      <label>다른 지역의 설정 가져오기 (선택)</label>
      <select id="m_rcopy" onchange="toggleCopyDetail()">
        <option value="">가져오지 않고 새로 시작</option>
        ${sources.map(x=>`<option value="${x.id}">${esc(x.name)}에서 가져오기</option>`).join('')}
      </select>
      <div class="hint">이미 만들어 둔 지역이 있으면 그 설정을 그대로 옮겨 올 수 있습니다.
        새 시도를 추가할 때 처음부터 만들지 않아도 됩니다. 안 써도 괜찮습니다.</div>
      <div id="copyDetail" class="hidden" style="margin-top:10px">
        <label style="display:flex;align-items:center;gap:7px;font-weight:400">
          <input type="checkbox" id="cp_dept" checked> 상세소속(부서) 목록</label>
        <label style="display:flex;align-items:center;gap:7px;font-weight:400;margin-top:5px">
          <input type="checkbox" id="cp_fields" checked> 내담자 명부 항목 정의</label>
        <label style="display:flex;align-items:center;gap:7px;font-weight:400;margin-top:5px">
          <input type="checkbox" id="cp_subs"> 하위지역 이름까지 복사</label>
        <div class="hint" id="copySummary"></div>
      </div>
    </div>` : '';

  modal(r?'지역 이름 변경':(parentId?'하위지역 추가':'상위지역 추가'), `
    <div class="field"><label>지역 이름<span class="req">*</span></label>
      <input type="text" id="m_rname" value="${esc(r?.name||'')}"
        placeholder="${parentId ? '예: 마산소방서' : '예: 경남소방'}">
      ${parentId ? `<div class="hint">명부의 '소속' 칸에 적히는 이름과 같게 적어 주세요.
        예를 들어 명부에 '창원소방본부 소방정책과'라고 적힌다면 여기에는
        <b>창원소방본부</b>라고 적습니다.</div>` : ''}</div>
    <div class="field" style="margin-top:12px"><label>순서</label>
      <input type="number" id="m_rsort" value="${r?.sort_order??10}"></div>
    ${copyBox}`,
    async ()=>{
      const name=$('m_rname').value.trim();
      if(!name){ toast('지역 이름을 입력하세요','bad'); return false; }
      const row={ name, sort_order:Number($('m_rsort').value)||10 };

      if(r){
        const { error } = await sb.from('regions').update(row).eq('id', r.id);
        if(error){
          toast(error.code==='23505'?'같은 이름의 지역이 이미 있습니다':'저장하지 못했습니다: '+error.message,'bad');
          return false;
        }
        toast('지역 이름을 바꿨습니다');
        await refreshRegions(); await loadLookups(); adminRegions(); return true;
      }

      row.parent_id = parentId;
      const { data: made, error } = await sb.from('regions').insert(row).select('id').single();
      if(error){
        toast(error.code==='23505'?'같은 이름의 지역이 이미 있습니다':'저장하지 못했습니다: '+error.message,'bad');
        return false;
      }

      const src = $('m_rcopy')?.value;
      let copied = [];
      if(src){
        copied = await copyRegionSetup(src, made.id, {
          dept:   $('cp_dept')?.checked,
          fields: $('cp_fields')?.checked,
          subs:   $('cp_subs')?.checked,
        });
      }
      toast(copied.length ? `지역을 만들고 ${copied.join(', ')}을(를) 복사했습니다`
                          : '지역을 만들었습니다');
      await refreshRegions(); await loadLookups(); adminRegions(); return true;
    },
    ()=>{ toggleCopyDetail(); });
}
function toggleCopyDetail(){
  const sel=$('m_rcopy'), box=$('copyDetail');
  if(!sel||!box) return;
  const on = !!sel.value;
  box.classList.toggle('hidden', !on);
  if(!on) return;
  const srcId = sel.value;
  const nDept = S.depts.filter(d=>d.region_id===srcId).length;
  const nSub  = S._aregions.filter(r=>r.parent_id===srcId).length;
  const sum=$('copySummary');
  if(sum) sum.textContent = `부서 ${nDept}개 · 하위지역 ${nSub}개를 가져올 수 있습니다.`;
}

// 기존 지역의 설정을 새 지역으로 옮겨 심습니다
async function copyRegionSetup(srcId, dstId, opts){
  const done = [];
  try{
    if(opts.dept){
      const { data } = await sb.from('departments').select('*').eq('region_id', srcId);
      const rows = (data||[]).map(d=>({
        region_id: dstId, name: d.name, sort_order: d.sort_order, is_active: d.is_active,
      }));
      if(rows.length){
        const { error } = await sb.from('departments').insert(rows);
        if(!error) done.push(`부서 ${rows.length}개`);
      }
    }
    if(opts.fields){
      const { data } = await sb.from('client_field_defs').select('*').eq('region_id', srcId);
      const rows = (data||[]).map(f=>({
        region_id: dstId, field_key: f.field_key, label: f.label,
        field_type: f.field_type, options: f.options, required: f.required,
        sort_order: f.sort_order, lookup_source: f.lookup_source, allow_other: f.allow_other,
      }));
      if(rows.length){
        const { error } = await sb.from('client_field_defs').insert(rows);
        if(!error) done.push(`명부 항목 ${rows.length}개`);
      }
    }
    if(opts.subs){
      const kids = S._aregions.filter(r=>r.parent_id===srcId);
      const rows = kids.map(k=>({ name:k.name, parent_id:dstId, sort_order:k.sort_order }));
      if(rows.length){
        const { error } = await sb.from('regions').insert(rows);
        if(!error) done.push(`하위지역 ${rows.length}개`);
      }
    }
  }catch(e){
    toast('일부 설정을 복사하지 못했습니다: '+e.message,'bad');
  }
  return done;
}

async function delRegion(id){
  if(!isSuper()){ toast('지역은(는) 최종관리자만 다룰 수 있습니다','bad'); return; }
  const r = S._aregions.find(x=>x.id===id);
  const kids = S._aregions.filter(x=>x.parent_id===id).length;
  if(kids){ toast(`하위지역 ${kids}개를 먼저 옮기거나 지우세요`,'bad'); return; }
  const { count } = await sb.from('clients').select('id',{count:'exact',head:true}).eq('region_id',id);
  if(count){ toast(`이 지역에 내담자 ${count}명이 있어 지울 수 없습니다`,'bad'); return; }
  if(!confirm(`'${r.name}' 지역을 지웁니다. 계속할까요?`)) return;
  const { error } = await sb.from('regions').delete().eq('id',id);
  if(error){ toast('지우지 못했습니다: '+error.message,'bad'); return; }
  toast('지역을 지웠습니다');
  await refreshRegions(); adminRegions();
}
async function refreshRegions(){
  const { data: all } = await sb.from('regions').select('*').order('sort_order');
  S.allRegions = all || [];
  if(S.me.role==='super_admin'){ S.regions = all||[]; return; }
  const { data: mine } = await sb.from('user_regions').select('region_id').eq('user_id', S.me.id);
  const seed=new Set((mine||[]).map(x=>x.region_id));
  let grew=true;
  while(grew){ grew=false;
    for(const r of (all||[])) if(r.parent_id&&seed.has(r.parent_id)&&!seed.has(r.id)){ seed.add(r.id); grew=true; } }
  S.regions=(all||[]).filter(r=>seed.has(r.id));
}

/* ── 사용자 ── */
async function adminUsers(){
  const { data: users } = await sb.from('users').select('*').order('name');
  const { data: maps } = await sb.from('user_regions').select('*');
  const { data: regions } = await sb.from('regions').select('*').order('sort_order');
  S._ausers=users||[]; S._amaps=maps||[]; S._aregions=regions||[];
  const rname={}; regions.forEach(r=>rname[r.id]=r.name);
  const roleLabel={ super_admin:'최종관리자', manager:'중간관리자', counselor:'상담사' };

  // 중간관리자는 자기 지역 상담사만 다룹니다
  const mine = new Set();
  if(!isSuper()){
    S.regions.forEach(r=>mine.add(r.id));
  }
  const canTouch = u => {
    if(isSuper()) return true;
    if(u.role!=='counselor') return false;
    const rs = maps.filter(m=>m.user_id===u.id).map(m=>m.region_id);
    return rs.length>0 && rs.every(r=>mine.has(r));
  };
  const visible = isSuper() ? users
    : users.filter(u=>canTouch(u) || u.id===S.me.id);

  let html = `<div class="panel">
    <h2>사용자</h2>
    <div class="desc">${isSuper()
      ? '계정을 만들고 비밀번호를 정해 줍니다. 아이디와 비밀번호만 알려 주면 바로 쓸 수 있습니다.'
      : '담당 지역의 상담사 계정을 만들고 관리합니다. 관리자 계정은 최종관리자가 다룹니다.'}</div>
    ${apiBase() ? '' : `<div class="msg bad">백엔드 주소가 없어 계정을 만들 수 없습니다.
      simony.html 맨 위의 API_URL을 확인해 주세요.</div>`}
    <div class="rec-list">`;

  if(!visible.length){
    html += `</div><div class="empty">아직 등록된 사람이 없습니다.</div>`;
  }else{
    visible.forEach(u=>{
      const rs = maps.filter(m=>m.user_id===u.id).map(m=>rname[m.region_id]).filter(Boolean);
      const editable = canTouch(u);
      html += `<div class="rec" style="cursor:default">
        <div class="rec-head">
          <span class="rec-name">${esc(u.name)}</span>
          <span class="rec-sub">${esc(u.username)}</span>
          <span class="chip">${esc(roleLabel[u.role]||u.role)}</span>
          ${u.is_active===false?'<span class="chip risk">사용 중지</span>':''}
          <span style="flex:1"></span>
          ${editable?`
            <button class="btn ghost" onclick="editUser('${u.id}')">수정</button>
            <button class="btn ghost" onclick="resetPassword('${u.id}')">비밀번호</button>
            ${u.id!==S.me.id?`<button class="btn ghost" onclick="toggleUser('${u.id}',${u.is_active===false})">
              ${u.is_active===false?'다시 쓰기':'사용 중지'}</button>`:''}
          `:'<span class="hint">최종관리자가 관리합니다</span>'}
        </div>
        <div class="rec-grid">
          <div><span>담당 지역</span>${u.role==='super_admin' ? '전체'
            : (rs.join(', ') || '<span style="color:var(--warn)">없음</span>')}</div>
          <div><span>알림 메일</span>${esc(u.email||'—')}</div>
          <div><span>알림 받기</span>${u.notify_email===false?'끔':'켬'}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="actions">
    <button class="btn" onclick="editUser(null)">계정 만들기</button></div></div>`;
  $('adminBody').innerHTML = html;
}

// 계정 만들기·고치기
function editUser(id){
  const u = id ? S._ausers.find(x=>x.id===id) : null;
  const isNew = !u;
  const mineIds = new Set(S.regions.map(r=>r.id));
  const picked = new Set(S._amaps.filter(m=>m.user_id===id).map(m=>m.region_id));

  // 중간관리자는 상담사만, 그리고 자기 지역만 고를 수 있습니다
  const roles = isSuper()
    ? [['counselor','상담사'],['manager','중간관리자'],['super_admin','최종관리자']]
    : [['counselor','상담사']];

  const tops = S._aregions.filter(r=>!r.parent_id);
  let regHtml='';
  for(const t of tops){
    const okTop = isSuper() || mineIds.has(t.id);
    regHtml += `<label style="display:block;font-weight:600;margin-top:6px;${okTop?'':'opacity:.4'}">
      <input type="checkbox" name="ur" value="${t.id}"
        ${picked.has(t.id)?'checked':''} ${okTop?'':'disabled'}> ${esc(t.name)}</label>`;
    for(const c of S._aregions.filter(r=>r.parent_id===t.id)){
      const okKid = isSuper() || mineIds.has(c.id);
      regHtml += `<label style="display:block;margin-left:18px;font-weight:400;${okKid?'':'opacity:.4'}">
        <input type="checkbox" name="ur" value="${c.id}"
          ${picked.has(c.id)?'checked':''} ${okKid?'':'disabled'}> ${esc(c.name)}</label>`;
    }
  }

  modal(isNew?'계정 만들기':'계정 수정', `
    <div class="grid">
      <div class="field"><label>이름<span class="req">*</span></label>
        <input type="text" id="m_uname" value="${esc(u?.name||'')}" placeholder="예: 김상담"></div>
      <div class="field"><label>아이디<span class="req">*</span></label>
        <input type="text" id="m_ulogin" value="${esc(u?.username||'')}"
          ${isNew?'':'disabled'} autocapitalize="off" spellcheck="false"
          placeholder="예: gnkim">
        <div class="hint">${isNew
          ? '영문 소문자로 시작하고, 소문자와 숫자만 3~30자. 로그인할 때 씁니다.'
          : '아이디는 나중에 바꿀 수 없습니다.'}</div></div>
      ${isNew?`<div class="field"><label>비밀번호<span class="req">*</span></label>
        <input type="text" id="m_upw" placeholder="6자 이상">
        <div class="hint">본인에게 알려 준 뒤 바꾸도록 안내해 주세요.</div></div>`:''}
      <div class="field"><label>권한</label>
        <select id="m_urole" onchange="document.getElementById('regPick').style.display=this.value==='super_admin'?'none':''">
          ${roles.map(([v,l])=>`<option value="${v}" ${u?.role===v?'selected':''}>${l}</option>`).join('')}
        </select>
        ${isSuper()?'':'<div class="hint">중간관리자는 상담사 계정만 만들 수 있습니다.</div>'}</div>
      <div class="field"><label>알림 받을 메일</label>
        <input type="email" id="m_uemail" value="${esc(u?.email||'')}"
          placeholder="실제로 받는 주소 (선택)">
        <div class="hint">고위험군이 나오면 이 주소로 알려 줍니다. 비워 두셔도 됩니다.</div></div>
      <div class="field"><label>알림 받기</label>
        <select id="m_unotify">
          <option value="true" ${!u||u.notify_email!==false?'selected':''}>받기</option>
          <option value="false" ${u&&u.notify_email===false?'selected':''}>받지 않기</option></select></div>
      <div class="field wide" id="regPick" style="${u?.role==='super_admin'?'display:none':''}">
        <label>담당 지역<span class="req">*</span></label>
        <div class="checks" style="display:block">${regHtml||'<span class="hint">지역을 먼저 만드세요</span>'}</div>
        <div class="hint">상위지역을 고르면 그 아래 소방서도 함께 볼 수 있습니다.
          ${isSuper()?'':'담당하지 않는 지역은 고를 수 없습니다.'}</div></div>
    </div>`,
    async ()=>{
      const name=$('m_uname').value.trim();
      if(!name){ toast('이름을 입력하세요','bad'); focusMissing($('m_uname')); return false; }
      const role=$('m_urole').value;
      const picked=[...document.querySelectorAll('input[name="ur"]:checked')].map(x=>x.value);
      if(role!=='super_admin' && !picked.length){
        toast('담당 지역을 한 곳 이상 고르세요','bad'); return false;
      }
      const body = {
        name, role,
        region_ids: picked,
        email: $('m_uemail').value.trim() || null,
        notify_email: $('m_unotify').value==='true',
      };

      try{
        if(isNew){
          const username=$('m_ulogin').value.trim().toLowerCase();
          if(!/^[a-z][a-z0-9]{2,29}$/.test(username)){
            toast('아이디는 영문 소문자로 시작하고 소문자·숫자만 3~30자로 지어 주세요','bad');
            focusMissing($('m_ulogin')); return false;
          }
          const pw=$('m_upw').value;
          if(pw.length<6){ toast('비밀번호는 6자 이상으로 정해 주세요','bad');
            focusMissing($('m_upw')); return false; }
          body.username=username; body.password=pw;

          await apiCall('/api/users', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify(body),
          });
          toast(`${name} 님의 계정을 만들었습니다`);
          showNewAccount(name, username, $('m_upw').value);
        }else{
          await apiCall('/api/users/'+u.id, {
            method:'PATCH',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify(body),
          });
          toast('고쳤습니다');
        }
        adminUsers();
        return true;
      }catch(e){
        toast(e.message,'bad');
        return false;
      }
    });
}

// 만든 계정을 한 번 더 보여 줍니다. 그대로 옮겨 적어 전달하시면 됩니다.
function showNewAccount(name, username, password){
  setTimeout(()=>{
    modal('계정을 만들었습니다', `
      <div class="msg info">아래 내용을 본인에게 알려 주세요.
        비밀번호는 지금만 보이고 다시 볼 수 없습니다.</div>
      <div class="dl" style="margin-top:14px">
        <dt>이름</dt><dd>${esc(name)}</dd>
        <dt>주소</dt><dd>${esc(location.origin + location.pathname)}</dd>
        <dt>아이디</dt><dd><b style="font-size:18.5px">${esc(username)}</b></dd>
        <dt>비밀번호</dt><dd><b style="font-size:18.5px">${esc(password)}</b></dd>
      </div>
      <div class="hint" style="margin-top:10px">
        처음 로그인한 뒤 비밀번호를 바꾸도록 안내해 주시면 좋습니다.</div>`,

// 비밀번호 다시 정하기
function resetPassword(id){
  const u = S._ausers.find(x=>x.id===id);
  modal(`${u.name} 님 비밀번호 다시 정하기`, `
    <div class="field"><label>새 비밀번호<span class="req">*</span></label>
      <input type="text" id="m_newpw" placeholder="6자 이상">
      <div class="hint">본인에게 알려 준 뒤 바꾸도록 안내해 주세요.</div></div>`,
    async ()=>{
      const pw=$('m_newpw').value;
      if(pw.length<6){ toast('6자 이상으로 정해 주세요','bad'); return false; }
      try{
        await apiCall(`/api/users/${id}/password`, {
          method:'POST',
          headers:{ 'Content-Type':'application/json' },
          body: JSON.stringify({ password: pw }),
        });
        toast('비밀번호를 바꿨습니다');
        showNewAccount(u.name, u.username, pw);
        return true;
      }catch(e){ toast(e.message,'bad'); return false; }
    });
}

// 계정 잠그기 / 다시 쓰기
async function toggleUser(id, activate){
  const u = S._ausers.find(x=>x.id===id);
  const msg = activate
    ? `${u.name} 님이 다시 로그인할 수 있게 합니다. 계속할까요?`
    : `${u.name} 님의 로그인을 막습니다.\n지금까지 남긴 기록은 그대로 보존됩니다. 계속할까요?`;
  if(!confirm(msg)) return;
  try{
    await apiCall(`/api/users/${id}/disable`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ active: !!activate }),
    });
    toast(activate?'다시 쓸 수 있습니다':'로그인을 막았습니다');
    adminUsers();
  }catch(e){ toast(e.message,'bad'); }
}

/* ── 공용 모달 ── */
function modal(title, bodyHtml, onSave, afterOpen){
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  ov.innerHTML=`<div class="modal"><h3>${esc(title)}</h3>${bodyHtml}
    <div class="actions">
      <button class="btn" id="mSave">저장</button>
      <button class="btn ghost" onclick="this.closest('.overlay').remove()">취소</button>
    </div></div>`;
  document.body.appendChild(ov);
  if(afterOpen) afterOpen();
  ov.querySelector('#mSave').onclick = async (e)=>{
    e.target.disabled=true; e.target.textContent='저장 중…';
    const ok = await onSave();
    if(ok) ov.remove();
    else { e.target.disabled=false; e.target.textContent='저장'; }
  };
}

/* ═══════════════════════════════════════════════════
   대시보드 — 지금 상태를 한 화면에
   ═══════════════════════════════════════════════════ */
function thisMonthStart(){
  const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
async function countOf(table, build){
  let q = sb.from(table).select('id',{count:'exact',head:true});
  if(build) q = build(q);
  const { count, error } = await q;
  return error ? 0 : (count||0);
}

async function renderHome(){
  const c=$('content');
  c.innerHTML='<div class="panel"><div class="empty">불러오는 중…</div></div>';

  const [total, month, clients, pendingComp, pendingSimple, highRisk] = await Promise.all([
    countOf('form_records'),
    countOf('form_records', q=>q.gte('created_at', thisMonthStart())),
    countOf('clients'),
    countOf('comp_tests', q=>q.neq('match_status','matched')),
    countOf('simple_tests', q=>q.neq('match_status','matched')),
    countOf('simple_tests', q=>q.or('suicide_risk.gte.1,ptsd_score.gte.6,dep_score.gte.3')),
  ]);
  const pending = pendingComp+pendingSimple;

  let html = `<div class="panel">
    <div class="searchbar">
      <input type="text" id="q" placeholder="이름·개인식별아이디·디지털 식별번호·사번으로 찾기"
        onkeydown="if(event.key==='Enter')searchPeople()">
      <button class="btn" onclick="searchPeople()">검색</button>
    </div>
    <div class="hint">이름 일부만 넣어도 됩니다. 검색 결과에서 이름을 누르면 그 사람의 전체 이력이 열립니다.
      화면이 좁으면 표를 옆으로 밀어서 볼 수 있습니다.</div>
    <div id="searchResult"></div>
  </div>`;

  html += `<div class="cards">
    ${card('전체 기록', total.toLocaleString()+'건')}
    ${card('이번 달', month.toLocaleString()+'건')}
    ${card('내담자', clients.toLocaleString()+'명')}
    ${card('고위험군', highRisk+'명', highRisk>0)}
  </div>`;

  // 상담사는 검색과 '내 내담자 보기'(상단 메뉴)만으로 충분하므로, 관리자에게만
  // 전체 현황을 보는 검사 관련 화면을 더 보여줍니다. 나머지 폼 작성은 상단 메뉴
  // (스크리닝·집단상담·업무보고)와 내담자 상세 화면에서 합니다.
  if(canManage()){
    html += `<div class="eyebrow">검사</div><div class="quick">`;
    html += qbtn('간이검사 실시','7문항 마음건강 검사','openSimpleTest()');
    html += qbtn('간이검사 결과','점수와 판정 보기','showSimpleTests()');
    html += qbtn('고위험군 관리', highRisk>0?`확인 필요 ${highRisk}명`:'해당 없음',
                 'showHighRisk()', highRisk>0?'alert':'');
    html += qbtn('종합심리검사 결과','해석지 열람','showCompTests()');
    if(pending>0) html += qbtn('검사 연결 대기',`${pending}건 확인 필요`,'showPending()','alert');
    html += `</div>`;
  }

  // 최근 기록
  const { data: recent } = await sb.from('form_records')
    .select('*').order('created_at',{ascending:false}).limit(8);
  const rname={}; S.regions.forEach(r=>rname[r.id]=r.name);
  const fname={}; S.forms.forEach(f=>fname[f.id]=f.title);
  html += `<div class="eyebrow">최근 기록</div><div class="panel">`;
  if(!recent?.length){
    html += `<div class="empty">첫 기록을 남기면 여기에 표시됩니다.</div>`;
  }else{
    html += `<table><thead><tr><th>작성일</th><th>폼</th><th>지역</th>
      <th>내담자</th><th>작성자</th></tr></thead><tbody>`;
    recent.forEach(r=>{
      const go = r.client_id ? `openClient('${r.client_id}')` : `openTab('list:${r.form_id}')`;
      html += `<tr onclick="${go}">
        <td>${fmtDate(r.created_at)}</td><td>${esc(fname[r.form_id]||'')}</td>
        <td>${esc(rname[r.region_id]||'')}</td>
        <td><b>${esc(r.client_name||'—')}</b></td>
        <td>${esc(r.author_name||'')}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;
  c.innerHTML = html;
}
// 아직 만들지 않은 화면
function soon(name){
  toast(name+' 화면은 아직 준비 중입니다');
}
function qbtn(title, sub, onclick, kind){
  return `<button class="qbtn ${kind||''}" onclick="${onclick}">
    <b>${esc(title)}</b><span>${esc(sub)}</span></button>`;
}
function card(label, value, warn){
  return `<div class="card${warn?' warn':''}">
    <div class="card-label">${esc(label)}</div>
    <div class="card-value">${esc(value)}</div></div>`;
}
function barList(rows, max){
  if(!rows.length) return '<div class="empty">표시할 항목이 없습니다.</div>';
  const top = max || Math.max(1, ...rows.map(r=>r[1]));
  const total = rows.reduce((s,r)=>s+r[1],0) || 1;
  return '<div class="bars">' + rows.map(([label,n])=>`
    <div class="bar-row">
      <div class="bar-label" title="${esc(label)}">${esc(label||'(빈 값)')}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/top*100)}%"></div></div>
      <div class="bar-num">${n.toLocaleString()}<span class="bar-pct">${Math.round(n/total*100)}%</span></div>
    </div>`).join('') + '</div>';
}

/* ── 내담자 검색 ── */
// 표에 최근 상담·최근 검사를 함께 보여주기 위해 한 번에 모아 온다 (사람 수만큼 조회하지 않음)
async function enrichClients(rows){
  const ids = rows.map(r=>r.id);
  if(!ids.length) return { last:{}, test:{} };
  let recs=[], tests=[];
  try{
    const [a, b] = await Promise.all([
      sb.from('form_records').select('client_id,form_id,created_at')
        .in('client_id', ids).order('created_at',{ascending:false}).limit(2000),
      sb.from('simple_tests').select('client_id,tested_at,ptsd_score,dep_score,suicide_risk')
        .in('client_id', ids).order('tested_at',{ascending:false}).limit(2000),
    ]);
    recs = a.data || []; tests = b.data || [];
  }catch(e){
    // 부가 정보를 못 가져와도 명단 자체는 보여 줍니다
    console.warn('최근 상담·검사 정보를 불러오지 못했습니다:', e);
  }
  const last={}, test={};
  recs.forEach(r=>{ if(!last[r.client_id]) last[r.client_id]=r; });   // 정렬됐으니 첫 건이 최신
  tests.forEach(t=>{ if(!test[t.client_id]) test[t.client_id]=t; });
  return { last, test };
}
function testCellHTML(t){

async function peopleTable(rows, emptyMsg){
  if(!rows || !rows.length) return `<div class="empty">${esc(emptyMsg)}</div>`;
  const rname={}; S.regions.forEach(r=>rname[r.id]=r.name);
  const fname={}; S.forms.forEach(f=>fname[f.id]=f.title);
  const { last, test } = await enrichClients(rows);

  // 표 대신 카드로 그립니다. 좁은 화면에서도 찌그러지지 않고,
  // 사람마다 한 덩어리로 보여 눈으로 좇기 쉽습니다.
  return `<div class="person-list">` + rows.map(c=>{
    const age = ageFromBirth(c.birth_date);
    const belong = [c.extra?.department, c.extra?.rank].filter(Boolean).join(' · ');
    const lastRec = last[c.id];
    const t = test[c.id];
    const hi = t && ((t.ptsd_score||0)>=CUT.ptsd || (t.dep_score||0)>=CUT.dep
                     || (t.suicide_risk||0)>=CUT.suicide);
    return `<div class="person" onclick="openClient('${c.id}')">
      <div class="p-head">
        <span class="p-name">${esc(c.name)}</span>
        <span class="p-sub">${esc(c.birth_date||'생년월일 없음')}${age!==null?` (만 ${age}세)`:''}
          · ${esc(c.gender||'')}</span>
        ${c.status && c.status!=='재직'
          ? `<span class="chip ${['전출','퇴직'].includes(c.status)?'risk':''}">${esc(c.status)}</span>`
          : ''}
        ${hi ? `<span class="chip risk">고위험</span>` : ''}
      </div>
      <div class="p-grid">
        <div><span>지역</span>${esc(rname[c.region_id]||'—')}</div>
        <div><span>소속 / 계급</span>${esc(belong||'—')}</div>
        <div><span>개인식별아이디</span>${esc(c.personal_id||c.internal_id||'—')}</div>
        <div><span>디지털 식별번호</span>${esc(c.digital_id||'—')}</div>
        <div><span>사번</span>${esc(c.employee_no||'—')}</div>
        <div><span>최근 상담</span>${lastRec
          ? esc(fname[lastRec.form_id]||'기록') + ' · ' + fmtDate(lastRec.created_at)
          : '없음'}</div>
        <div><span>최근 검사</span>${t
          ? `<b style="${hi?'color:var(--warn)':''}">P${t.ptsd_score??'-'} / 우${t.dep_score??'-'} / 자${t.suicide_risk??'-'}</b>
             <span style="color:var(--sub)">· ${fmtDate(t.tested_at)}</span>`
          : '없음'}</div>
      </div>
    </div>`;
  }).join('') + `</div>`;
}

// 전출·퇴직자 표시 여부 전환
function setShowLeft(on){ S._showLeft = !!on; searchPeople(); }

async function searchPeople(){
  const q=$('q').value.trim();
  const box=$('searchResult');
  if(!q){ box.innerHTML=''; return; }
  box.innerHTML='<div class="empty">찾는 중…</div>';
  // or() 안에서는 %가 아니라 *를 와일드카드로 씁니다.
  // %를 쓰면 주소에서 퍼센트 인코딩 시작 문자로 오해받아 한글 검색이 깨집니다.
  const pat = q.replace(/[*,()]/g, ' ').trim();
  let query = sb.from('clients').select('*')
    .or(`name.ilike.*${pat}*,internal_id.ilike.*${pat}*,personal_id.ilike.*${pat}*,`
        + `digital_id.ilike.*${pat}*,employee_no.ilike.*${pat}*`)
    .limit(50);
  if(!S._showLeft) query = query.in('status', ['재직','휴직']);   // 전출·퇴직자는 기본 숨김
  let { data, error } = await query;

  // 혹시라도 or 조건이 막히면 이름만으로 한 번 더 찾아 봅니다
  if(!error && (!data || !data.length)){
    let q2 = sb.from('clients').select('*').ilike('name', `%${q}%`).limit(50);
    if(!S._showLeft) q2 = q2.in('status', ['재직','휴직']);
    const r2 = await q2;
    if(!r2.error && r2.data?.length) data = r2.data;
  }
  if(error){ box.innerHTML=`<div class="msg bad">찾지 못했습니다: ${esc(error.message)}</div>`; return; }
  const found = data || [];
  console.log('[시모니] 내담자 검색', q, '→', found.length, '명', found);
  const table = await peopleTable(found,
    `'${q}'와 맞는 내담자가 없습니다. 이름을 줄여서 다시 찾아보거나,
     아래 '전출·퇴직자도 함께 보기'를 켜 보세요.`);
  box.innerHTML = `<div style="margin-top:14px">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px">
      <b>${found.length}명 찾음</b>
      <label class="hint" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin:0">
        <input type="checkbox" ${S._showLeft?'checked':''}
          onchange="setShowLeft(this.checked)"> 전출·퇴직자도 함께 보기</label>
    </div>
    ${table}</div>`;
}

    });
    html += `</tbody></table>`;
  }

  c.innerHTML = html;
  window.scrollTo(0,0);

// 상세페이지에서 바로 기록 작성 (내담자 미리 선택)
async function startRecordFor(clientId, formId){
  const target = formId ? S.forms.find(f=>f.id===formId) : S.forms.find(f=>f.links_client);
  if(!target){ toast('작성할 수 있는 폼이 없습니다','bad'); return; }
  if(target.links_client){
    const { data: p } = await sb.from('clients').select('*').eq('id',clientId).maybeSingle();
    S._preClient = p;
  }
  openTab('form:'+target.id);
}

     1~4번 PTSD (0~4점)  · 합계 6점 이상이면 고위험
