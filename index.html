];
// 상단 메뉴에 있는 폼 화면으로 바로 갑니다 (제목으로 찾습니다).
function card(label, value, warn){
  return `<div class="card${warn?' warn':''}">
    <div class="card-label">${esc(label)}</div>
    <div class="card-value">${esc(value)}</div></div>`;
}
function barList(rows, max){
  if(!rows.length) return '<div class="empty">표시할 항목이 없습니다.</div>';
  const top = max || Math.max(1, ...rows.map(r=>r[1]));
  const total = rows.reduce((s,r)=>s+r[1],0) || 1;
  return '<div class="bars">' + rows.map(([label,n])=>`
    <div class="bar-row">
      <div class="bar-label" title="${esc(label)}">${esc(label||'(빈 값)')}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.round(n/top*100)}%"></div></div>
      <div class="bar-num">${n.toLocaleString()}<span class="bar-pct">${Math.round(n/total*100)}%</span></div>
    </div>`).join('') + '</div>';
}

/* ── 내담자 검색 ── */
// 표에 최근 상담·최근 검사를 함께 보여주기 위해 한 번에 모아 온다 (사람 수만큼 조회하지 않음)
async function enrichClients(rows){
  const ids = rows.map(r=>r.id);
  if(!ids.length) return { last:{}, test:{} };
  let recs=[], tests=[];
  try{
    const [a, b] = await Promise.all([
      sb.from('form_records').select('client_id,form_id,created_at')
        .in('client_id', ids).order('created_at',{ascending:false}).limit(2000),
      sb.from('simple_tests').select('client_id,tested_at,ptsd_score,dep_score,suicide_risk')
        .in('client_id', ids).order('tested_at',{ascending:false}).limit(2000),
    ]);
    recs = a.data || []; tests = b.data || [];
  }catch(e){
    // 부가 정보를 못 가져와도 명단 자체는 보여 줍니다
    console.warn('최근 상담·검사 정보를 불러오지 못했습니다:', e);
  }
  const last={}, test={};
  recs.forEach(r=>{ if(!last[r.client_id]) last[r.client_id]=r; });   // 정렬됐으니 첫 건이 최신
  tests.forEach(t=>{ if(!test[t.client_id]) test[t.client_id]=t; });
  return { last, test };
}
function testCellHTML(t){
  if(!t) return '<span style="color:var(--sub)">검사 없음</span>';
  const hi = (t.ptsd_score||0)>=CUT.ptsd || (t.dep_score||0)>=CUT.dep || (t.suicide_risk||0)>=CUT.suicide;
  return `<div>${fmtDate(t.tested_at)}</div>
    <div style="font-size:15px;${hi?'color:var(--warn);font-weight:700':'color:var(--sub)'}">
      P${t.ptsd_score??'-'} / 우${t.dep_score??'-'} / 자${t.suicide_risk??'-'}
      ${hi?' · 고위험':''}</div>`;
}
function lastCellHTML(r, fname){
  if(!r) return '<span style="color:var(--sub)">기록 없음</span>';
  return `<div>${esc(fname[r.form_id]||'기록')}</div>
    <div style="font-size:15px;color:var(--sub)">${fmtDate(r.created_at)}</div>`;
}
function statusChip(st){
  if(!st || st==='재직') return '';
  const warn = ['전출','퇴직'].includes(st);
  return ` <span class="chip ${warn?'risk':''}" style="padding:2px 9px;font-size:14px">${esc(st)}</span>`;
}

async function peopleTable(rows, emptyMsg){
  if(!rows || !rows.length) return `<div class="empty">${esc(emptyMsg)}</div>`;
  const rname={}; S.regions.forEach(r=>rname[r.id]=r.name);
  const fname={}; S.forms.forEach(f=>fname[f.id]=f.title);
  const { last, test } = await enrichClients(rows);

  // 표 대신 카드로 그립니다. 좁은 화면에서도 찌그러지지 않고,
  // 사람마다 한 덩어리로 보여 눈으로 좇기 쉽습니다.
  return `<div class="person-list">` + rows.map(c=>{
    const age = ageFromBirth(c.birth_date);
    const belong = [c.extra?.department, c.extra?.rank].filter(Boolean).join(' · ');
    const lastRec = last[c.id];
    const t = test[c.id];
    const hi = t && ((t.ptsd_score||0)>=CUT.ptsd || (t.dep_score||0)>=CUT.dep
                     || (t.suicide_risk||0)>=CUT.suicide);
    return `<div class="person" onclick="openClient('${c.id}')">
      <div class="p-head">
        <span class="p-name">${esc(c.name)}</span>
        <span class="p-sub">${esc(c.birth_date||'생년월일 없음')}${age!==null?` (만 ${age}세)`:''}
          · ${esc(c.gender||'')}</span>
        ${c.status && c.status!=='재직'
          ? `<span class="chip ${['전출','퇴직'].includes(c.status)?'risk':''}">${esc(c.status)}</span>`
          : ''}
        ${hi ? `<span class="chip risk">고위험</span>` : ''}
      </div>
      <div class="p-grid">
        <div><span>지역</span>${esc(rname[c.region_id]||'—')}</div>
        <div><span>소속 / 계급</span>${esc(belong||'—')}</div>
        <div><span>개인식별아이디</span>${esc(c.personal_id||c.internal_id||'—')}</div>
        <div><span>디지털 식별번호</span>${esc(c.digital_id||'—')}</div>
        <div><span>사번</span>${esc(c.employee_no||'—')}</div>
        <div><span>최근 상담</span>${lastRec
          ? esc(fname[lastRec.form_id]||'기록') + ' · ' + fmtDate(lastRec.created_at)
          : '없음'}</div>
        <div><span>최근 검사</span>${t
          ? `<b style="${hi?'color:var(--warn)':''}">P${t.ptsd_score??'-'} / 우${t.dep_score??'-'} / 자${t.suicide_risk??'-'}</b>
             <span style="color:var(--sub)">· ${fmtDate(t.tested_at)}</span>`
          : '없음'}</div>
      </div>
    </div>`;
  }).join('') + `</div>`;
}

// 전출·퇴직자 표시 여부 전환
function setShowLeft(on){ S._showLeft = !!on; searchPeople(); }

async function searchPeople(){
  const q=$('q').value.trim();
  const box=$('searchResult');
  if(!q){ box.innerHTML=''; return; }
  box.innerHTML='<div class="empty">찾는 중…</div>';
  // or() 안에서는 %가 아니라 *를 와일드카드로 씁니다.
  // %를 쓰면 주소에서 퍼센트 인코딩 시작 문자로 오해받아 한글 검색이 깨집니다.
  const pat = q.replace(/[*,()]/g, ' ').trim();
  let query = sb.from('clients').select('*')
    .or(`name.ilike.*${pat}*,internal_id.ilike.*${pat}*,personal_id.ilike.*${pat}*,`
        + `digital_id.ilike.*${pat}*,employee_no.ilike.*${pat}*`)
    .limit(50);
  if(!S._showLeft) query = query.in('status', ['재직','휴직']);   // 전출·퇴직자는 기본 숨김
  let { data, error } = await query;

  // 혹시라도 or 조건이 막히면 이름만으로 한 번 더 찾아 봅니다
  if(!error && (!data || !data.length)){
    let q2 = sb.from('clients').select('*').ilike('name', `%${q}%`).limit(50);
    if(!S._showLeft) q2 = q2.in('status', ['재직','휴직']);
    const r2 = await q2;
    if(!r2.error && r2.data?.length) data = r2.data;
  }
  if(error){ box.innerHTML=`<div class="msg bad">찾지 못했습니다: ${esc(error.message)}</div>`; return; }
  const found = data || [];
  console.log('[시모니] 내담자 검색', q, '→', found.length, '명', found);
  const table = await peopleTable(found,
    `'${q}'와 맞는 내담자가 없습니다. 이름을 줄여서 다시 찾아보거나,
     아래 '전출·퇴직자도 함께 보기'를 켜 보세요.`);
  box.innerHTML = `<div style="margin-top:14px">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px">
      <b>${found.length}명 찾음</b>
      <label class="hint" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer;margin:0">
        <input type="checkbox" ${S._showLeft?'checked':''}
          onchange="setShowLeft(this.checked)"> 전출·퇴직자도 함께 보기</label>
    </div>
    ${table}</div>`;
}

async function showMyClients(){
  const c=$('content');
  c.innerHTML='<div class="panel"><div class="empty">불러오는 중…</div></div>';
  const { data: recs } = await sb.from('form_records').select('client_id,created_at')
    .eq('author_id', S.me.id).not('client_id','is',null)
    .order('created_at',{ascending:false}).limit(500);
  const ids=[...new Set((recs||[]).map(r=>r.client_id))];
  let rows=[];
  if(ids.length){
    const { data } = await sb.from('clients').select('*').in('id', ids.slice(0,100));
    const order={}; ids.forEach((id,i)=>order[id]=i);
    rows=(data||[]).sort((a,b)=>order[a.id]-order[b.id]);
  }
  const table = await peopleTable(rows,'아직 기록을 남긴 내담자가 없습니다.');
  c.innerHTML = `<div class="panel">
    <h2>내 내담자</h2><div class="desc">내가 기록을 남긴 사람 ${rows.length}명 · 최근 순</div>
    ${table}
    <div class="actions"><button class="btn ghost" onclick="openTab('home')">대시보드로</button></div></div>`;
}

   내담자 상세 — 한 사람의 모든 이력을 한 화면에

async function showClient(id){
  const c=$('content');
  c.innerHTML='<div class="panel"><div class="empty">불러오는 중…</div></div>';

  const { data: p, error } = await sb.from('clients').select('*').eq('id',id).maybeSingle();
  if(error||!p){ c.innerHTML='<div class="panel"><div class="msg bad">내담자를 찾지 못했습니다.</div></div>'; return; }

  const [{ data: recs }, { data: simples }, { data: comps }, { data: defs }] = await Promise.all([
    sb.from('form_records').select('*').eq('client_id',id).order('created_at',{ascending:false}),
    sb.from('simple_tests').select('*').eq('client_id',id).order('tested_at',{ascending:false}),
    sb.from('comp_tests').select('*').eq('client_id',id).order('created_at',{ascending:false}),
    sb.from('client_field_defs').select('*').eq('region_id',p.region_id).order('sort_order'),
  ]);
  S._cRecs = recs||[];

  const rname={}; S.regions.forEach(r=>rname[r.id]=r.name);
  const fname={}; S.forms.forEach(f=>fname[f.id]=f.title);
  const last = recs?.[0]?.created_at;
  const risky = (simples||[]).filter(t=>
    (t.suicide_risk||0)>=1 || (t.ptsd_score||0)>=6 || (t.dep_score||0)>=3);

  let html = `<div class="panel">
    <div class="who-head">
      <span class="nm">${esc(p.name)}</span>
      <span class="meta">${esc(p.birth_date||'')}${ageFromBirth(p.birth_date)!==null
          ? ` (만 ${ageFromBirth(p.birth_date)}세)` : ''} · ${esc(p.gender||'')}
        · 개인식별아이디 ${esc(p.personal_id||p.internal_id||'없음')}${
          p.digital_id?` · 디지털 ${esc(p.digital_id)}`:''}${
          p.employee_no?` · 사번 ${esc(p.employee_no)}`:''}</span>
    </div>
    <div class="chips">
      <span class="chip">${esc(rname[p.region_id]||'지역 없음')}</span>
      ${p.extra?.team ? `<span class="chip">${esc(p.extra.team)}</span>` : ''}
      <span class="chip${['전출','퇴직'].includes(p.status)?' risk':''}">${esc(p.status||'재직')}</span>
      ${(defs||[]).map(d=>p.extra?.[d.field_key]
        ? `<span class="chip">${esc(d.label)} ${esc(p.extra[d.field_key])}</span>`:'').join('')}
      ${risky.length?`<span class="chip risk">고위험 판정 ${risky.length}회</span>`:''}
    </div>
    <div class="cards" style="margin-top:16px">
      ${card('상담 기록', (recs?.length||0)+'건')}
      ${card('최근 기록', last?fmtDate(last):'없음')}
      ${card('간이검사', (simples?.length||0)+'회')}
      ${card('종합심리검사', (comps?.length||0)+'건')}
    </div>
    <div class="actions" style="flex-wrap:wrap">
      ${CLIENT_FORM_ORDER.map(title=>S.forms.find(f=>f.title===title)).filter(Boolean)
        .map(f=>`<button class="btn${f.links_client?'':' ghost'}"
          onclick="startRecordFor('${p.id}','${f.id}')">${esc(f.title)} 작성</button>`).join('')}
      <button class="btn ghost" onclick="openSimpleTestFor('${p.id}')">간이검사 실시</button>
    </div>
  </div>`;

  // 상담 이력
  html += `<div class="panel"><h2>상담 이력</h2>`;
  if(!recs?.length){
    html += `<div class="empty">아직 기록이 없습니다.</div>`;
  }else{
    html += `<div class="tl">`;
    recs.forEach((r,i)=>{
      const preview = Object.values(r.data||{})
        .filter(v=>typeof v==='string' && v.length>8).slice(0,2).join(' · ');
      html += `<div class="tl-item" onclick="openClientRecord(${i})">
        <div class="tl-date">${fmtDate(r.created_at)} · ${esc(r.author_name||'')}
          · ${esc(rname[r.region_id]||'')}</div>
        <div class="tl-title">${esc(fname[r.form_id]||'기록')}</div>
        <div class="tl-body">${esc(preview||'상세 보기')}</div></div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  // 간이검사
  html += `<div class="panel"><h2>간이검사 결과</h2>
    <div class="desc">기준: PTSD 6점 · 우울 3점 · 자살위험 1점 이상이면 고위험</div>`;
  if(!simples?.length){
    html += `<div class="empty">검사 기록이 없습니다.</div>`;
  }else{
    html += `<table><thead><tr><th>검사일</th><th>PTSD</th><th>우울</th>

    simples.forEach(t=>{
      const hi=(t.suicide_risk||0)>=1||(t.ptsd_score||0)>=6||(t.dep_score||0)>=3;

  if(!comps?.length){
    html += `<div class="empty">검사 기록이 없습니다.</div>`;
  }else{
    html += `<table><thead><tr><th>등록일</th><th>검사 종류</th><th>위험도</th>
      <th>결과지</th>${canManage()?'<th></th>':''}</tr></thead><tbody>`;
    comps.forEach(t=>{
      html += `<tr id="ctRow_${esc(t.id)}"><td>${fmtDate(t.created_at)}</td>
        <td>${esc(t.test_type||'—')}</td>
        <td>${esc(t.risk_level||'—')}</td>
        <td>${t.interpretation?`<a href="#" onclick="showInterpRow(${esc(JSON.stringify(
              JSON.stringify({id:t.id,client_name:t.client_name,test_type:t.test_type,
                birth_date:t.birth_date,created_at:t.created_at,
                interpretation:t.interpretation,pdf_url:t.pdf_url})))});return false"
            style="color:var(--accent);font-weight:600">해석지</a> · `:''}${
          t.pdf_url?`<a href="#" onclick="openCompPdf('${t.id}');return false"
          style="color:var(--accent);font-weight:600">원본</a>`:'—'}</td>
        ${canManage()?`<td><button class="btn ghost" style="padding:6px 12px"
          onclick="deleteCompTest('${t.id}','${jsq(t.client_name)}',this)">지우기</button></td>`:''}
        </tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;
  c.innerHTML = html;
  window.scrollTo(0,0);
}
function openClientRecord(i){
  const r=S._cRecs[i];
  S.form = S.forms.find(f=>f.id===r.form_id);
  sb.from('form_fields').select('*').eq('form_id', r.form_id).order('sort_order')
    .then(({data})=>{ S.fields=data||[]; S._recs=[r]; openDetail(0); });
}
// 상세페이지에서 바로 기록 작성 (내담자 미리 선택)
async function startRecordFor(clientId, formId){

async function showCompTests(){
  const c=$('content');
  c.innerHTML='<div class="panel"><div class="empty">불러오는 중…</div></div>';
  const { data } = await sb.from('comp_tests').select('*')
    .order('created_at',{ascending:false}).limit(1000);
  S._compTests = data || [];
  c.innerHTML = `<div class="panel"><h2>종합심리검사 결과</h2>
    <div class="field" style="max-width:420px;margin-top:10px">
      <label>이름·생년월일·검사 종류로 찾기</label>
      <input type="text" id="ctSearch" placeholder="예: 강기훈  또는  1993  또는  MMPI"
        oninput="renderCompTests()"></div>
    <div id="ctBody"></div>
    <div class="actions"><button class="btn ghost" onclick="openTab('home')">대시보드로</button></div>
  </div>`;
  renderCompTests();
}
function renderCompTests(){
  const box=$('ctBody'); if(!box) return;
  const all=S._compTests||[];
  const q=($('ctSearch')?.value||'').trim().toLowerCase();
  const rows = q ? all.filter(t=>[t.client_name,t.birth_date,t.test_type,t.risk_level,
      t.source_filename].some(v=>String(v||'').toLowerCase().includes(q))) : all;

  // 같은 사람의 같은 검사가 여러 번 올라온 건 (검색과 무관하게) 눈에 띄게 표시합니다
  const seen={};
  all.forEach(t=>{
    const k=(t.client_id||t.client_name||'')+'|'+(t.birth_date||'')+'|'+(t.test_type||'');
    seen[k]=(seen[k]||0)+1;
  });

  if(!all.length){
    box.innerHTML=`<div class="empty">등록된 결과가 없습니다.</div>`; return;
  }
  if(!rows.length){
    box.innerHTML=`<div class="empty">'${esc(q)}'와 맞는 검사가 없습니다.</div>`; return;
  }
  box.innerHTML = `<div class="desc" style="margin:10px 0">${rows.length}건${
      q?` (전체 ${all.length}건 중)`:''}</div>
    <div style="overflow:auto"><table><thead><tr><th>등록일</th><th>이름</th><th>생년월일</th>
      <th>검사 종류</th><th>위험도</th><th>연결</th><th>결과지</th>
      ${canManage()?'<th></th>':''}</tr></thead><tbody>`
    + rows.map(t=>{
      const k=(t.client_id||t.client_name||'')+'|'+(t.birth_date||'')+'|'+(t.test_type||'');
      return `<tr id="ctRow_${esc(t.id)}"><td>${fmtDate(t.created_at)}</td>
        <td><b>${esc(t.client_name||'')}</b>${seen[k]>1
          ? ` <span class="chip risk">중복 ${seen[k]}건</span>`:''}</td>
        <td>${esc(t.birth_date||'')}</td><td>${esc(t.test_type||'—')}</td>
        <td>${esc(t.risk_level||'—')}</td>
        <td>${t.match_status==='matched'?'연결됨'
             :t.match_status==='manual'?'직접 연결'
             :'<span style="color:var(--warn)">대기</span>'}</td>
        <td>${t.interpretation?`<a href="#" onclick="showInterp('${t.id}');return false"
            style="color:var(--accent);font-weight:600">해석지</a> · `:''}${
          t.pdf_url?`<a href="#" onclick="openCompPdf('${t.id}');return false"
          style="color:var(--accent);font-weight:600">원본</a>`:'—'}</td>
        ${canManage()?`<td><button class="btn ghost" style="padding:6px 12px"
          onclick="deleteCompTest('${t.id}','${jsq(t.client_name)}',this)">지우기</button></td>`:''}
        </tr>`;
    }).join('')
    + `</tbody></table></div>`;
}

/* 해석 요약지 보기.
   제미나이가 결과지를 읽고 만든 글입니다 — 상담사가 초기 상담 전략을 세울 때 씁니다.
   AI가 쓴 글이므로 T점수 같은 수치는 원본 결과지와 대조해 보시라고 알려 줍니다. */
function showInterp(id){
  const t = (S._compTests||[]).find(x=>x.id===id);
  if(!t || !t.interpretation){ toast('해석지가 없습니다','bad'); return; }
  const ov=document.createElement('div');
  ov.className='overlay';
  // 바깥을 눌러도 닫히지 않습니다. 글을 쓰다 실수로 옆을 눌러 날리는 일이
  // 잦았기 때문입니다. 닫으려면 '취소'를 누르거나 ESC를 누릅니다.
  ov.innerHTML=`<div class="modal" style="max-width:760px">
    <h3>해석 요약지 — ${esc(t.client_name||'')}</h3>
    <div class="desc">${esc(t.test_type||'검사종류 미상')} ·
      ${esc(t.birth_date||'')} · 등록 ${fmtDate(t.created_at)}</div>
    <div class="msg info" style="margin-top:10px">AI가 결과지를 읽고 쓴 글입니다.
      상담 준비용 참고 자료이며, 수치나 판단은 원본 결과지와 함께 확인해 주세요.</div>
    <div style="margin-top:12px;max-height:60vh;overflow:auto;white-space:pre-wrap;
      line-height:1.75;font-size:15px;padding:14px;border:1px solid var(--line);
      border-radius:var(--radius);background:var(--bg)">${esc(t.interpretation)}</div>
    <div class="actions">
      <button class="btn ghost" onclick="copyInterp('${t.id}')">글 복사</button>
      ${t.pdf_url?`<button class="btn ghost" onclick="openCompPdf('${t.id}')">원본 결과지</button>`:''}
      <button class="btn ghost" onclick="this.closest('.overlay').remove()">닫기</button>
    </div></div>`;
  document.body.appendChild(ov);
}
async function copyInterp(id){
  const t = (S._compTests||[]).find(x=>x.id===id) || S._interpOne;
  if(!t) return;
  try{ await navigator.clipboard.writeText(t.interpretation||''); toast('복사했습니다'); }
  catch(e){ toast('복사하지 못했습니다','bad'); }
}
// 목록을 들고 있지 않은 화면(내담자 상세 등)에서 검사 한 건을 바로 넘겨 받아 엽니다.
function showInterpRow(json){
  let t; try{ t = JSON.parse(json); }catch(e){ toast('해석지를 열지 못했습니다','bad'); return; }
  S._interpOne = t;
  S._compTests = [...(S._compTests||[]).filter(x=>x.id!==t.id), t];
  showInterp(t.id);
}

/* 결과지 PDF 열기.
   버킷을 비공개로 두었기 때문에 주소를 그대로 열면 안 되고,
   서버에서 잠깐만 쓸 수 있는 임시 주소를 받아 엽니다. */
async function openCompPdf(id){
  try{
    const res = await apiCall(`/api/comp-tests/${id}/file`);
    const r = await res.json();
    if(!r.url) throw new Error('결과지 주소를 받지 못했습니다');
    window.open(r.url, '_blank', 'noopener');
  }catch(e){ toast(e.message,'bad'); }
}

/* 잘못 올렸거나 중복으로 올라온 종합심리검사 결과 하나를 지웁니다.
   기록만 지우면 스토리지에 PDF가 남아 용량을 계속 차지하므로,
   서버가 파일과 기록을 함께 지웁니다. 되돌릴 수 없어 한 번 더 확인을 구하고,
   누가 무엇을 지웠는지는 수정 로그에 남습니다. */
async function deleteCompTest(id, name, btn){
  if(!canManage()){ toast('관리자만 지울 수 있습니다','bad'); return; }
  const who = name ? `'${name}' 님의 ` : '';
  if(!confirm(`${who}종합심리검사 결과를 지울까요?\n\n`
    + `PDF 파일도 함께 지워집니다. 되돌릴 수 없습니다.`)) return;
  const old = btn ? btn.textContent : '';
  if(btn){ btn.disabled=true; btn.textContent='지우는 중…'; }
  try{
    const res = await apiCall(`/api/comp-tests/${id}`, { method:'DELETE' });
    const r = await res.json().catch(()=>({}));
    toast(r.file_removed===false && r.file_note
      ? `기록은 지웠지만 ${r.file_note}`
      : '검사 결과를 지웠습니다');
    if(S._compTests) S._compTests = S._compTests.filter(x=>x.id!==id);
    const row = document.getElementById('ctRow_'+id) || document.getElementById('upRow_'+id);
    if(row) row.remove();
    else if(btn) btn.closest('tr')?.remove();
  }catch(e){
    toast(e.message,'bad');
    if(btn){ btn.disabled=false; btn.textContent=old; }
  }
}

async function showPending(){
  const c=$('content');
  c.innerHTML='<div class="panel"><div class="empty">불러오는 중…</div></div>';
  const [{ data: comps }, { data: simples }] = await Promise.all([
    sb.from('comp_tests').select('*').neq('match_status','matched')
      .order('created_at',{ascending:false}).limit(200),
    sb.from('simple_tests').select('*').neq('match_status','matched')
      .order('tested_at',{ascending:false}).limit(200),
  ]);
  const rows=[...(comps||[]).map(x=>({...x,kind:'종합심리검사'})),
              ...(simples||[]).map(x=>({...x,kind:'간이검사'}))];
  let html=`<div class="panel"><h2>검사 연결 대기</h2>
    <div class="desc">이름·생년월일이 명부와 맞지 않거나 같은 이름이 여러 명이라
      자동으로 내담자를 정하지 못한 검사입니다. '연결하기'를 눌러 맞는 내담자를 찾아 이어 주세요.</div>`;
  if(!rows.length){
    html += `<div class="empty">대기 중인 검사가 없습니다.</div>`;
  }else{
    html += `<table><thead><tr><th>종류</th><th>이름</th><th>생년월일</th>
      <th>원본 파일명</th><th>메모</th><th></th></tr></thead><tbody>`;
    rows.forEach(t=>{
      const canLink = t.kind==='종합심리검사';   // 간이검사 연결은 아직 준비 중입니다
      html += `<tr><td>${esc(t.kind)}</td><td><b>${esc(t.client_name||'')}</b></td>
        <td>${esc(t.birth_date||'')}</td><td style="font-size:13px">${esc(t.source_filename||'—')}</td>
        <td style="font-size:13px;color:var(--sub)">${esc(t.match_note||'—')}</td>
        <td>${canLink
          ? `<button class="btn ghost" style="padding:6px 12px"
               onclick='openPendingLink("${t.id}", ${JSON.stringify(t.client_name||'')}, ${JSON.stringify(t.birth_date||'')})'>연결하기</button>`

/* '연결하기' — 종합심리검사 결과 하나를 명부의 실제 내담자와 사람이 직접 이어 줍니다.

   파일 이름을 잘못 적어 올리는 일이 잦습니다(홍길동↔홍갈동, 08월01일↔08월04일,
   통영↔사천 등). 그래서 창을 열면 서버가 명부에서 '비슷한 사람'을 찾아 순위대로
   보여 줍니다. 다만 자동으로 잇지는 않습니다 — 검사 결과를 엉뚱한 사람에게 붙이면
   되돌리기 어려우므로, 반드시 눈으로 확인하고 누르게 합니다.

   연결하면 검사 기록의 이름·생년월일이 명부 값으로 바로잡힙니다(명부는 안 건드림).
   저장되는 파일 이름도 명부 값에서 만들어지므로, 파일을 다시 올릴 필요가 없습니다. */
function openPendingLink(testId, name, birth){
  S._linkPick = null;
  S._linkTest = { id: testId, name, birth };
  const body = `
    <div class="msg info" style="margin-top:0">
      파일에서 읽은 값: <b>${esc(name||'이름 없음')}</b> · <b>${esc(birth||'생년월일 없음')}</b>
      <br>명부에서 비슷한 사람을 찾아 아래에 보여 드립니다. 맞는 사람을 눌러 주세요.
    </div>
    <div id="linkCands" style="margin-top:12px"><div class="empty">비슷한 사람을 찾는 중…</div></div>
    <details id="linkManual" style="margin-top:14px">
      <summary style="cursor:pointer;color:var(--sub)">직접 이름으로 찾기</summary>
      <div class="field" style="margin-top:10px"><label>이름</label>
        <input type="text" id="linkSearch" placeholder="이름 일부만 적어도 됩니다"
          onkeydown="if(event.key==='Enter'){event.preventDefault();runLinkSearch()}"></div>
      <div class="actions" style="margin-top:0"><button class="btn ghost" type="button"
        onclick="runLinkSearch()">찾기</button></div>
      <div id="linkResults" style="margin-top:10px"></div>
    </details>
    <div id="linkPicked" style="margin-top:12px"></div>`;
  modal(`검사 연결 — ${esc(name||'이름 없음')}`, body,
    async ()=>{
      if(!S._linkPick){ toast('먼저 연결할 내담자를 골라 주세요','bad'); return false; }
      try{
        const res = await apiCall(`/api/comp-tests/${testId}/link`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ client_id: S._linkPick.id }),
        });
        const r = await res.json().catch(()=>({}));
        toast((r.fixed && r.fixed.length)
          ? `${S._linkPick.name} 님과 연결하고 ${r.fixed.length}곳을 바로잡았습니다`
          : `${S._linkPick.name} 님과 연결했습니다`);
        // 업로드 결과표에서 연결한 경우에는 그 줄만 고쳐 줍니다.
        // (화면을 통째로 바꾸면 방금 올린 결과 목록이 사라져 버립니다.)
        const upRow = document.getElementById('upRow_'+testId);
        if(upRow){
          const tds = upRow.querySelectorAll('td');
          if(tds[2]) tds[2].innerHTML = `<b>${esc(S._linkPick.name)}</b>`;
          if(tds[3]) tds[3].textContent = S._linkPick.birth_date || '';
          if(tds[6]) tds[6].innerHTML = '직접 연결';
          const btn = upRow.querySelector('button.btn:not(.ghost)');
          if(btn) btn.remove();
        }else{
          showPending();
        }
        return true;
      }catch(e){ toast(e.message,'bad'); return false; }
    },
    ()=>loadLinkCandidates(testId));
}

// 서버에서 오타 후보를 받아 순위대로 그립니다.
async function loadLinkCandidates(testId){
  const box = $('linkCands');
  if(!box) return;
  try{
    const res = await apiCall(`/api/comp-tests/${testId}/candidates`);
    const r = await res.json();
    const list = r.candidates || [];
    if(!list.length){
      box.innerHTML = `<div class="hint">명부에서 비슷한 사람을 찾지 못했습니다.
        아래 '직접 이름으로 찾기'를 열어 찾아 주세요.</div>`;
      const d=$('linkManual'); if(d) d.open = true;
      return;
    }
    box.innerHTML = `<div class="hint" style="margin-bottom:6px">비슷한 사람 ${list.length}명 —
      맞다고 확신할 때만 눌러 주세요.</div>`
      + '<div class="results">' + list.map(c=>{
        const strong = c.score >= 85;
        return `<div onclick='pickLinkCandidate(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
            <b style="font-size:16px">${esc(c.name)}</b>
            <span>${esc(c.birth_date||'생년월일 없음')}</span>
            <span style="color:var(--sub)">${esc(c.region_name||'—')}</span>
            ${c.status && c.status!=='재직'
              ? `<span class="chip risk">${esc(c.status)}</span>` : ''}
            <span class="chip${strong?'':' '}" style="margin-left:auto;${strong
              ? 'background:var(--accent-soft);font-weight:700' : 'color:var(--sub)'}">${c.score}점</span>
          </div>
          <div style="font-size:13px;color:var(--sub);margin-top:3px">
            ${esc((c.reasons||[]).join(' · '))}
            ${[c.department,c.rank].filter(Boolean).length
              ? ' · ' + esc([c.department,c.rank].filter(Boolean).join(' / ')) : ''}
          </div>
        </div>`;
      }).join('') + '</div>';
  }catch(e){
    box.innerHTML = `<div class="msg bad">후보를 불러오지 못했습니다: ${esc(e.message)}</div>`;
    const d=$('linkManual'); if(d) d.open = true;
  }
}

async function runLinkSearch(){
  const q = $('linkSearch').value.trim();
  const box = $('linkResults');
  if(!q){ box.innerHTML=''; return; }
  box.innerHTML = '<div class="hint">찾는 중…</div>';
  const rname={}; S.regions.forEach(r=>rname[r.id]=r.name);
  const { data, error } = await sb.from('clients').select('*').ilike('name', `%${q}%`).limit(30);
  if(error){ box.innerHTML = `<div class="msg bad">${esc(error.message)}</div>`; return; }
  if(!data.length){
    box.innerHTML = `<div class="hint">'${esc(q)}' 이름의 내담자가 없습니다.</div>`;
    return;
  }
  box.innerHTML = '<div class="results">' + data.map(c=>{
    const flat = { id:c.id, name:c.name, birth_date:c.birth_date,
      region_name: rname[c.region_id]||null, status:c.status,
      department:c.extra?.department||null, rank:c.extra?.rank||null };
    return `<div onclick='pickLinkCandidate(${JSON.stringify(flat).replace(/'/g,"&#39;")})'>
      <b>${esc(c.name)}</b> · ${esc(c.birth_date||'생년월일 없음')} · ${esc(rname[c.region_id]||'—')}
      ${[c.extra?.department,c.extra?.rank].filter(Boolean).length
        ? ' · '+esc([c.extra?.department,c.extra?.rank].filter(Boolean).join(' / ')) : ''}
    </div>`;
  }).join('') + '</div>';
}

// 고른 사람을 확인란에 보여 줍니다. 파일과 다른 점이 있으면 무엇이 바뀌는지 알려 줍니다.
function pickLinkCandidate(c){
  S._linkPick = c;
  const box = $('linkPicked');
  if(!box) return;
  const t = S._linkTest || {};
  const fixes = [];
  if((t.name||'').replace(/\s+/g,'') !== (c.name||'').replace(/\s+/g,'')){
    fixes.push(`이름 <b>${esc(t.name||'없음')}</b> → <b>${esc(c.name)}</b>`);
  }
  if((t.birth||'') !== (c.birth_date||'')){
    fixes.push(`생년월일 <b>${esc(t.birth||'없음')}</b> → <b>${esc(c.birth_date||'없음')}</b>`);
  }
  box.innerHTML = `<div class="msg ${fixes.length?'info':''}" style="margin:0">
    <b>${esc(c.name)}</b> (${esc(c.birth_date||'생년월일 없음')}) 선택됨
    ${fixes.length
      ? `<br>저장하면 검사 기록이 이렇게 바로잡힙니다: ${fixes.join(', ')}
         <br><span style="color:var(--sub);font-size:13px">명부는 바뀌지 않습니다.
         파일 이름도 명부 값으로 다시 만들어지므로 파일을 새로 올릴 필요가 없습니다.</span>`
      : '<br>파일에서 읽은 값과 명부가 같습니다.'}
  </div>`;
}

/* ═══════════════════════════════════════════════════
   게시판

   글은 관리자가 쓰고, 상담사는 답글을 답니다. 지역별로 나뉘어서
   자기가 볼 수 있는 지역의 글만 보입니다.

   첨부파일은 '읽는 권한'과 '여는 권한'이 다릅니다.
   답글 글자는 상담사끼리 서로 읽지만, 다른 상담사가 답글에 붙인 파일은
   열 수 없습니다. 그 판단은 서버가 합니다(/api/board/file).
   ═══════════════════════════════════════════════════ */
const BOARD_MAX_MB = 3;

/* 이 글이 어디까지 보이는지 한 줄로 알려 줍니다.
   아래 지역이 있는 상위지역이면 '경남소방 (아래 지역 모두)'처럼 적어,
   글을 쓴 사람이 범위를 눈으로 확인할 수 있게 합니다. */
function regionScopeLabel(regionId){
  const r = (S.regions||[]).find(x=>x.id===regionId);
  if(!r) return '';
  const kids = (S.regions||[]).filter(x=>x.parent_id===regionId).length;
  return kids ? `${r.name} (아래 지역 모두)` : r.name;
}

async function renderBoard(postId){
  if(postId) return showPost(postId);
  const c=$('content');
  c.innerHTML='<div class="panel"><div class="empty">불러오는 중…</div></div>';

  const { data, error } = await sb.from('board_posts').select('*')
    .order('is_pinned',{ascending:false}).order('created_at',{ascending:false}).limit(300);
  if(error){ c.innerHTML=`<div class="panel"><div class="msg bad">${esc(error.message)}</div></div>`; return; }
  S._posts = data||[];

  // 답글 수를 한 번에 세어 옵니다 (글마다 따로 묻지 않기 위해)
  const counts={};
  if(S._posts.length){
    const { data: reps } = await sb.from('board_replies')
      .select('post_id').in('post_id', S._posts.map(p=>p.id));
    (reps||[]).forEach(r=>{ counts[r.post_id]=(counts[r.post_id]||0)+1; });
  }
  const rname={}; S.regions.forEach(r=>rname[r.id]=r.name);

  let html = `<div class="panel">
    <h2>게시판</h2>
    <div class="desc">${canManage()
      ? '공지와 자료를 올립니다. 상담사는 읽고 답글을 답니다.'
      : '관리자가 올린 공지입니다. 궁금한 점은 답글로 남겨 주세요.'}</div>
    ${canManage()?`<div class="actions"><button class="btn" onclick="editPost(null)">새 글 쓰기</button></div>`:''}`;

  if(!S._posts.length){
    html += `<div class="empty">아직 올라온 글이 없습니다.</div></div>`;
    c.innerHTML=html; return;
  }
  html += `<div style="overflow:auto"><table class="board-list"><thead><tr>
    <th style="width:74px"></th><th>제목</th><th>지역</th><th>올린 사람</th><th>날짜</th>
    </tr></thead><tbody>`;
  S._posts.forEach(p=>{
    const n = counts[p.id]||0;
    html += `<tr style="cursor:pointer" onclick="openTab('board:${p.id}')">
      <td style="white-space:nowrap">${p.is_pinned?'<span class="chip">고정</span>':''}</td>
      <td><b>${esc(p.title)}</b>
        ${n?` <span class="hint">답글 ${n}</span>`:''}
        ${(p.files||[]).length?` <span class="hint">첨부 ${p.files.length}</span>`:''}</td>
      <td>${esc(regionScopeLabel(p.region_id)||'—')}</td>
      <td>${esc(p.author_name||'')}</td>
      <td>${fmtDate(p.created_at)}</td></tr>`;
  });
  html += `</tbody></table></div></div>`;
  c.innerHTML=html;
}

/* 글 한 편과 답글들 */

  if(error || !p){ c.innerHTML=`<div class="panel"><div class="msg bad">글을 찾지 못했습니다.</div>
    <div class="actions"><button class="btn ghost" onclick="openTab('board')">목록으로</button></div></div>`; return; }
  const { data: reps } = await sb.from('board_replies').select('*')
    .eq('post_id', id).order('created_at');

  c.innerHTML = `<div class="panel">

      ${fmtDate(p.created_at)}${p.updated_at?' (고침)':''}</div>
    <div class="post-body">${esc(p.body||'')}</div>
    ${fileListHTML(p.files, id, '첨부')}
    ${canManage()?`<div class="actions">
      <button class="btn ghost" onclick="editPost('${p.id}')">고치기</button>
      <button class="btn ghost" style="color:var(--warn);border-color:var(--warn)"
        onclick="deletePost('${p.id}','${jsq(p.title)}')">지우기</button>
      <button class="btn ghost" onclick="togglePin('${p.id}',${!p.is_pinned})">
        ${p.is_pinned?'고정 풀기':'맨 위에 고정'}</button></div>`:''}
  </div>

  <div class="panel">
    <h2>답글 ${ (reps||[]).length || '' }</h2>
    ${!(reps||[]).length?'<div class="empty">아직 답글이 없습니다.</div>':''}
    ${(reps||[]).map(r=>`
      <div class="reply">
        <div class="reply-head">
          <b>${esc(r.author_name||'')}</b>
          <span class="when">${fmtDate(r.created_at)}</span>
          ${(mine(r.author_id)||canManage())?`<button class="btn ghost"
            style="margin-left:auto;padding:4px 10px"
            onclick="deleteReply('${r.id}','${p.id}')">지우기</button>`:''}
        </div>
        <div class="reply-body">${esc(r.body)}</div>
        ${fileListHTML(r.files, p.id, '첨부', r.author_id)}
      </div>`).join('')}

    <div class="field" style="margin-top:16px"><label>답글 쓰기</label>
      <textarea id="rep_body" rows="3" placeholder="궁금한 점이나 알릴 내용을 적어 주세요"></textarea></div>
    ${boardFileBoxHTML('rep_files')}
    <div class="actions">
      <button class="btn" onclick="addReply('${p.id}')">답글 올리기</button>
      <button class="btn ghost" onclick="openTab('board')">목록으로</button></div>
  </div>`;
}

/* 첨부 목록. 파일을 여는 것은 서버가 권한을 따진 뒤에 됩니다. */
function fileListHTML(files, postId, label, ownerId){
  const list = Array.isArray(files) ? files : [];
  if(!list.length) return '';
  const blocked = ownerId!==undefined && !canManage() && ownerId !== S.me?.id;
  return `<div style="margin-top:14px">
    <div class="hint">${esc(label)} ${list.length}개${blocked
      ? ' — 다른 분이 올린 파일이라 열 수 없습니다' : ''}</div>
    <div class="files">${list.map(f=>`
      <span class="file-chip${blocked?' locked':''}">
        ${blocked
          ? `🔒 ${esc(f.name||'파일')}`
          : `<a href="#" onclick="openBoardFile('${jsq(f.path)}','${postId}');return false"
               >${esc(f.name||'파일')}</a>`}
        ${f.kb?`<span class="kb">${f.kb}KB</span>`:''}
      </span>`).join('')}</div></div>`;
}
async function openBoardFile(path, postId){
  try{
    const res = await apiCall('/api/board/file', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ path, post_id: postId }),
    });
    const r = await res.json();
    if(!r.url) throw new Error('주소를 받지 못했습니다');
    window.open(r.url, '_blank', 'noopener');
  }catch(e){ toast(e.message,'bad'); }
}

/* 첨부 고르는 칸 (글쓰기·답글 공용) */
function boardFileBoxHTML(id){
  return `<input type="hidden" id="${id}">
    <div class="filebox" id="${id}_box"
      ondragover="event.preventDefault();this.classList.add('over')"
      ondragleave="this.classList.remove('over')"
      ondrop="event.preventDefault();this.classList.remove('over');pickBoardFiles('${id}',event.dataTransfer.files)"
      onclick="document.getElementById('${id}_in').click()">
      <b>파일 붙이기</b>
      <span>한 개 ${BOARD_MAX_MB}MB까지 · 사진과 PDF는 올리면서 용량을 줄입니다</span>
    </div>
    <input type="file" id="${id}_in" class="hidden" multiple
      onchange="pickBoardFiles('${id}', this.files); this.value=''">
    <div class="thumbs" id="${id}_thumbs"></div>`;
}
async function pickBoardFiles(id, fileList){
  const files=[...(fileList||[])];
  if(!files.length) return;
  const box=$(id+'_box'); const before=box?box.innerHTML:'';
  if(box) box.innerHTML=`<b>올리는 중…</b><span>${files.length}개</span>`;
  try{
    const fd=new FormData();
    for(const f of files){
      // 사진은 여기서 줄여 보냅니다. PDF는 서버가 줄입니다.
      const small = f.type.startsWith('image/') ? await shrinkImage(f, 1600) : f;
      if(small.size > BOARD_MAX_MB*1024*1024 && !/pdf$/i.test(small.name)){
        toast(`'${small.name}'은(는) ${BOARD_MAX_MB}MB를 넘어 건너뜁니다`,'bad');
        continue;
      }
      fd.append('files', small, small.name);
    }
    const res = await apiCall('/api/board/upload', { method:'POST', body:fd });
    const r = await res.json();
    const ok = (r.files||[]).filter(f=>!f.error);
    (r.files||[]).filter(f=>f.error).forEach(f=>toast(`${f.name}: ${f.error}`,'bad'));
    setBoardFiles(id, [...boardFiles(id), ...ok]);
    if(ok.length){
      const pct = Math.max(...ok.map(f=>f.saved_pct||0));
      toast(pct>0 ? `${ok.length}개 붙였습니다 (최대 ${pct}% 줄임)` : `${ok.length}개 붙였습니다`);
    }
  }catch(e){ toast('올리지 못했습니다: '+e.message,'bad'); }
  finally{ if(box) box.innerHTML=before; }
}
function boardFiles(id){ try{ return JSON.parse($(id)?.value||'[]'); }catch(e){ return []; } }
function setBoardFiles(id, list){
  const el=$(id); if(el) el.value=JSON.stringify(list);
  const box=$(id+'_thumbs'); if(!box) return;
  box.innerHTML = list.map((f,i)=>`
    <div class="thumb" style="width:auto;min-width:150px;max-width:230px">
      <div class="cap" style="margin:0">${esc(f.name||'파일')}${f.kb?` · ${f.kb}KB`:''}
        <button type="button" class="btn ghost" style="padding:2px 8px;margin-left:6px"
          onclick="removeBoardFile('${id}',${i})">빼기</button></div>
    </div>`).join('');
}
function removeBoardFile(id,i){
  const l=boardFiles(id); l.splice(i,1); setBoardFiles(id,l);
}

/* 글 쓰기·고치기 (관리자만) */
function editPost(id){
  if(!canManage()){ toast('관리자만 글을 쓸 수 있습니다','bad'); return; }
  const p = id ? (S._posts||[]).find(x=>x.id===id) : null;
  const body = `
    <div class="field"><label>제목 <span class="req">*</span></label>
      <input type="text" id="p_title" value="${esc(p?.title||'')}"></div>
    <div class="field"><label>지역 <span class="req">*</span></label>
      <select id="p_region">${p?'':'<option value="">— 지역 선택 —</option>'}${
        regionOptionsHTML(p?.region_id||'', { plain:true })}</select>
      <div class="hint" id="p_region_hint">고른 지역과 <b>그 아래 지역</b>에 있는 사람이 봅니다.
        경남소방을 고르면 진주·통영 등 경남 전체가 보고, 진주소방서를 고르면 진주만 봅니다.</div></div>
    <div class="field"><label>내용</label>
      <textarea id="p_body" rows="8">${esc(p?.body||'')}</textarea></div>
    <label class="hint" style="display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" id="p_pin" ${p?.is_pinned?'checked':''}> 맨 위에 고정</label>
    ${boardFileBoxHTML('p_files')}`;
  modal(id?'글 고치기':'새 글 쓰기', body, async ()=>{
    const title=$('p_title').value.trim();
    if(!title){ toast('제목을 적어 주세요','bad'); return false; }
    const region=selectValue('p_region');
    if(!region){ toast('지역을 골라 주세요','bad'); return false; }
    const row = {
      title, region_id: region, body: $('p_body').value.trim()||null,
      is_pinned: $('p_pin').checked, files: boardFiles('p_files'),
    };
    let error;
    if(p){
      row.updated_at = new Date().toISOString();
      ({ error } = await sb.from('board_posts').update(row).eq('id', p.id));
    }else{
      row.author_id = S.me.id; row.author_name = S.me.name;
      ({ error } = await sb.from('board_posts').insert(row));
    }
    if(error){ toast('저장하지 못했습니다: '+error.message,'bad'); return false; }
    toast(p?'글을 고쳤습니다':'글을 올렸습니다');
    p ? showPost(p.id) : openTab('board');
    return true;
  }, ()=>{ setBoardFiles('p_files', (p?.files)||[]); });
}
async function deletePost(id, title){
  if(!confirm(`'${title}' 글을 지울까요?\n답글도 함께 지워집니다. 되돌릴 수 없습니다.`)) return;
  const { error } = await sb.from('board_posts').delete().eq('id', id);
  if(error){ toast('지우지 못했습니다: '+error.message,'bad'); return; }
  toast('글을 지웠습니다'); openTab('board');
}
async function togglePin(id, on){
  const { error } = await sb.from('board_posts').update({ is_pinned:on }).eq('id', id);
  if(error){ toast(error.message,'bad'); return; }
  toast(on?'맨 위에 고정했습니다':'고정을 풀었습니다'); showPost(id);
}

/* 답글 (상담사·관리자 모두) */
async function addReply(postId){
  const body=$('rep_body').value.trim();
  const files=boardFiles('rep_files');
  if(!body && !files.length){ toast('내용을 적어 주세요','bad'); return; }
  const { error } = await sb.from('board_replies').insert({
    post_id: postId, body: body||'(파일만 올림)', files,
    author_id: S.me.id, author_name: S.me.name,
  });
  if(error){ toast('올리지 못했습니다: '+error.message,'bad'); return; }
  toast('답글을 올렸습니다'); showPost(postId);
}
async function deleteReply(id, postId){
  if(!confirm('이 답글을 지울까요?')) return;
  const { error } = await sb.from('board_replies').delete().eq('id', id);
  if(error){ toast('지우지 못했습니다: '+error.message,'bad'); return; }
  toast('답글을 지웠습니다'); showPost(postId);
}

/* ═══════════════════════════════════════════════════
   간이검사 — 소방공무원 마음건강 간이검사 (7문항)
     1~4번 PTSD (0~4점)  · 합계 6점 이상이면 고위험
     5~6번 우울 (0~3점)  · 합계 3점 이상이면 고위험
     7번   자살위험(0~3점) · 1점 이상이면 고위험
   ═══════════════════════════════════════════════════ */
const PTSD_OPTS = ['그렇지 않았다','조금 그랬다','어느 정도 그랬다','거의 그랬다','항상 그랬다'];
const PHQ_OPTS  = ['전혀 방해 받지 않았다','며칠동안 방해 받았다','7일 이상 방해 받았다','거의 매일 방해 받았다'];
const TEST_Q = [
  { key:'q1', group:'ptsd', text:'별안간 그 사건을 실제로 다시 겪은 것처럼 느껴지거나 행동하게 됩니까?' },
  { key:'q2', group:'ptsd', text:'그 사건을 떠오르게 하는 외부 상황을 피하십니까? (사람, 장소, 대화, 활동, 물건 또는 상황)' },
  { key:'q3', group:'ptsd', text:'다른 사람들과 동떨어졌거나 단절되었다고 느끼십니까?' },
  { key:'q4', group:'ptsd', text:'과민 행동, 분노 폭발 또는 공격적인 행동을 하십니까?' },
  { key:'q5', group:'phq',  text:'일 또는 여가 활동을 하는 데에 흥미나 즐거움을 느끼지 못함' },
  { key:'q6', group:'phq',  text:'기분이 가라앉거나, 우울하거나, 희망이 없음' },
  { key:'q7', group:'phq',  text:'자신이 죽는 것이 더 낫다고 생각하거나 어떤 식으로든 당신 자신을 해칠 것이라고 생각함' },
];
const CUT = { ptsd:6, dep:3, suicide:1 };

// 내담자 상세 화면의 '간이검사 실시' 버튼에서 호출합니다.
// 이미 어느 내담자인지 알고 여는 것이므로, 지역·이름·생년월일을 명부 값으로
// 미리 채워 두고, 제출할 때도 이름/생년월일로 다시 찾을 필요 없이 이 내담자
// id로 바로 연결합니다(단, 화면에서 이름·생년월일을 다른 사람 것으로 고치면
// 그때는 평소처럼 명부에서 다시 찾습니다 — submitSimpleTest 참고).
async function openSimpleTestFor(clientId){
  const { data: p, error } = await sb.from('clients').select('*').eq('id',clientId).maybeSingle();
  if(error || !p){ toast('내담자를 찾지 못했습니다','bad'); return; }
  openSimpleTest(p);
}
function openSimpleTest(pre){
  S._answers = {};
  S._testPreClient = pre || null;
  const c=$('content');
  const regionOpts = regionOptionsHTML(pre?.region_id||null, { plain:true });

  let html = `<div class="panel">
    <h2>소방공무원 마음건강 간이검사</h2>
    <div class="desc">7문항으로 이루어진 짧은 검사입니다.
      정답이 없으니 최근 상태에 가장 가까운 것을 고르시면 됩니다.</div>
    ${pre ? `<div class="hint"><b>${esc(pre.name)}</b> 님의 내담자 정보로 지역·이름·생년월일이
      자동으로 채워졌습니다. 다른 사람을 검사하려면 아래 값을 직접 고쳐 입력하세요.</div>` : ''}
    <div class="section-title">응답자</div>
    <div class="grid">
      <div class="field"><label>지역<span class="req">*</span></label>

      <div class="field"><label>이름<span class="req">*</span></label>
        <input type="text" id="t_name" value="${esc(pre?.name||'')}"></div>
      <div class="field"><label>생년월일<span class="req">*</span></label>
        ${birthInputHTML('t_birth', pre?.birth_date)}</div>
    </div>
    <div class="hint">이름과 생년월일로 명부의 본인을 찾습니다. 주민등록번호는 받지 않습니다.</div>`;

  html += `<div class="section-title">최근 한 달간 겪은 사건에 대하여</div>`;
  TEST_Q.filter(q=>q.group==='ptsd').forEach((q,i)=> html += questionCard(q, i+1, PTSD_OPTS));

  html += `<div class="section-title">지난 2주간, 얼마나 자주 다음과 같은 문제로 곤란을 겪으셨습니까?</div>`;
  TEST_Q.filter(q=>q.group==='phq').forEach((q,i)=> html += questionCard(q, i+5, PHQ_OPTS));

  html += `<div class="actions">
      <button class="btn" id="testSave" onclick="submitSimpleTest()">검사 제출</button>
      <button class="btn ghost" onclick="openTab('home')">그만두기</button>
    </div></div>`;
  c.innerHTML = html;
  window.scrollTo(0,0);
}
function questionCard(q, no, opts){
  return `<div class="qcard" id="card_${q.key}">
    <div class="qtext"><span class="qno">${no}</span>${esc(q.text)}</div>
    <div class="qopts">
      ${opts.map((o,v)=>`<button type="button" class="qopt"
        onclick="pickAnswer('${q.key}',${v},this)">${esc(o)}</button>`).join('')}
    </div></div>`;
}
function pickAnswer(key, val, el){
  S._answers[key] = val;
  el.parentElement.querySelectorAll('.qopt').forEach(b=>b.classList.remove('on'));
  el.classList.add('on');
  $('card_'+key).classList.remove('miss');
}

async function submitSimpleTest(){
  const btn=$('testSave');
  const region=$('t_region').value, name=$('t_name').value.trim();
  const birth = normalizeBirth($('t_birth').value);
  if(!name || !birth){
    const el = !name ? $('t_name') : $('t_birth');
    el.classList.add('err');
    toast(!name ? '이름을 입력하세요' : '생년월일을 숫자 8자리로 정확히 입력하세요','bad');
    focusMissing(el);
    return;
  }

  const missing = TEST_Q.filter(q=>S._answers[q.key]===undefined);
  document.querySelectorAll('.qcard').forEach(c=>c.classList.remove('miss'));
  if(missing.length){
    missing.forEach(q=>$('card_'+q.key).classList.add('miss'));
    toast(`응답하지 않은 문항이 ${missing.length}개 있습니다`,'bad');
    $('card_'+missing[0].key).scrollIntoView?.({block:'center'});
    return;
  }

  const a=S._answers;
  const ptsd = a.q1+a.q2+a.q3+a.q4;
  const dep  = a.q5+a.q6;
  const suicide = a.q7;

  // 내담자 상세 화면에서 '간이검사 실시'로 열었고, 이름·생년월일을 그대로 뒀다면
  // 이미 어느 내담자인지 알고 있으므로 다시 찾을 필요 없이 그 id로 바로 연결합니다.
  // 화면에서 이름이나 생년월일을 고쳤다면(=다른 사람 검사) 평소처럼 명부에서 다시 찾습니다.
  let matched;
  if(S._testPreClient && name===S._testPreClient.name && birth===S._testPreClient.birth_date){
    matched = S._testPreClient.id;
  }else{
    const { data: found } = await sb.from('clients').select('id')
      .eq('region_id',region).eq('name',name).eq('birth_date',birth).limit(2);
    matched = (found||[]).length===1 ? found[0].id : null;
  }

  btn.disabled=true; btn.textContent='저장 중…';
  const { error } = await sb.from('simple_tests').insert({
    region_id: region, client_name: name, birth_date: birth,
    client_id: matched, match_status: matched ? 'matched' : 'pending',
    tested_at: new Date().toISOString(),
    ptsd_score: ptsd, dep_score: dep, suicide_risk: suicide,
    answers: { q1:a.q1,q2:a.q2,q3:a.q3,q4:a.q4,q5:a.q5,q6:a.q6,q7:a.q7 },
  });
  btn.disabled=false; btn.textContent='검사 제출';
  if(error){ toast('저장하지 못했습니다: '+error.message,'bad'); return; }
  showTestResult({ name, ptsd, dep, suicide, matched });
}

function showTestResult(r){
  const hi = r.ptsd>=CUT.ptsd || r.dep>=CUT.dep || r.suicide>=CUT.suicide;
  const row = (label, score, cut, max) => {
    const over = score>=cut;
    return `<div class="score-row">
      <div class="score-label">${esc(label)}</div>
      <div class="bar-track"><div class="bar-fill${over?' over':''}"
        style="width:${Math.round(score/max*100)}%"></div></div>
      <div class="score-num${over?' over':''}">${score}점</div>
      <div class="score-cut">기준 ${cut}점</div></div>`;
  };
  $('content').innerHTML = `<div class="panel">
    <h2>검사가 끝났습니다</h2>
    <div class="desc">${esc(r.name)} 님, 응답해 주셔서 고맙습니다.
      아래 점수는 진단이 아니라 지금 상태를 살펴보기 위한 참고 자료입니다.</div>
    <div class="scores">
      ${row('PTSD', r.ptsd, CUT.ptsd, 16)}
      ${row('우울', r.dep, CUT.dep, 6)}
      ${row('자살위험', r.suicide, CUT.suicide, 3)}
    </div>
    ${hi ? `<div class="msg bad" style="margin-top:18px;font-size:17px">
        <b>상담사와 이야기를 나눠보시길 권합니다.</b><br>
        기준을 넘은 항목이 있습니다. 힘든 시기를 혼자 견디지 않으셔도 됩니다.
        찾아가는 상담실 상담사가 곧 연락드릴 예정이며, 그전에라도 도움이 필요하시면
        자살예방 상담전화 <b>109</b>번으로 24시간 연락하실 수 있습니다.</div>`
      : `<div class="msg info" style="margin-top:18px;font-size:17px">
        기준을 넘은 항목은 없습니다. 다만 점수와 무관하게 마음이 힘드실 때는
        언제든 상담을 신청하실 수 있습니다.</div>`}
    ${r.matched ? '' : `<div class="hint" style="margin-top:12px">
      명부에서 본인을 찾지 못해 담당자가 직접 확인할 예정입니다. 결과는 정상 저장되었습니다.</div>`}
    <div class="actions">
      ${r.matched ? `<button class="btn" onclick="openClient('${r.matched}')">내담자 화면으로</button>` : ''}
      <button class="btn${r.matched?' ghost':''}" onclick="openTab('home')">대시보드로</button>
      <button class="btn ghost" onclick="openSimpleTest()">다른 사람 검사하기</button>
    </div></div>`;
  window.scrollTo(0,0);
}

/* ═══════════════════════════════════════════════════
   공개 간이검사 (#publictest) — 로그인 없이 소방관 본인이 직접 응답
   문항·점수기준(TEST_Q/PTSD_OPTS/PHQ_OPTS/CUT)과 questionCard()/pickAnswer()는
   위 '간이검사' 부분과 같은 것을 그대로 씁니다. 다른 점은:
   · 지역은 전체 지역 트리 대신 상위지역(regions 표에서 parent_id가 없는 행)만
     고릅니다. 코드에 목록을 적어두지 않고 매번 DB에서 직접 읽어오므로, 나중에
     관리 화면에서 새 상위지역(예: 다른 소방본부)을 추가하면 이 화면에도 코드를
     따로 고치지 않고 자동으로 나타납니다.
   · 명부 대조는 clients 표를 직접 조회하지 않고, match_client_for_simple_test
     RPC(정확히 한 명일 때만 id를 돌려줌)로만 합니다 — 로그인 없는 사람에게
     명부 자체를 열어주지 않기 위해서입니다. (patch17_public_simple_test.sql 필요)
   ═══════════════════════════════════════════════════ */
let PT_REGION_MAP = {};   // 상위지역 이름 → id

async function submitPublicTest(){
  const btn = $('ptSave');
  document.querySelectorAll('#ptContent .field').forEach(f=>f.classList.remove('err'));

  const regionName = $('pt_region').value;
  const name = $('pt_name').value.trim();
  const birth = normalizeBirth($('pt_birth').value);
  const dept = $('pt_dept').value.trim();

  if(!regionName || !PT_REGION_MAP[regionName]){
    $('pt_region').closest('.field').classList.add('err');
    toast('소속 상위지역을 골라 주세요','bad'); return;
  }
  if(!name){
    $('pt_name').closest('.field').classList.add('err');
    toast('이름을 입력하세요','bad'); return;
  }
  if(!birth){
    $('pt_birth').closest('.field').classList.add('err');
    toast('생년월일을 숫자 8자리로 정확히 입력하세요','bad'); return;
  }
  const missing = TEST_Q.filter(q=>S._answers[q.key]===undefined);
  document.querySelectorAll('#ptContent .qcard').forEach(c=>c.classList.remove('miss'));
  if(missing.length){
    missing.forEach(q=>$('card_'+q.key).classList.add('miss'));
    toast(`응답하지 않은 문항이 ${missing.length}개 있습니다`,'bad');
    $('card_'+missing[0].key).scrollIntoView({block:'center'});
    return;
  }

  const a = S._answers;
  const ptsd = a.q1+a.q2+a.q3+a.q4;
  const dep  = a.q5+a.q6;
  const suicide = a.q7;
  const regionId = PT_REGION_MAP[regionName];

  btn.disabled = true; btn.textContent = '저장 중…';

  let matched = null;
  try{
    const { data: mid, error: mErr } = await sb.rpc('match_client_for_simple_test', {
      p_region_id: regionId, p_name: name, p_birth: birth,
    });
    if(!mErr) matched = mid || null;
  }catch(e){ /* 매칭에 실패해도 검사 결과 저장은 계속 진행합니다 */ }

  const payload = {
    region_id: regionId, client_name: name, birth_date: birth,
    client_id: matched, match_status: matched ? 'matched' : 'pending',
    tested_at: new Date().toISOString(),
    ptsd_score: ptsd, dep_score: dep, suicide_risk: suicide,
    answers: Object.assign({ q1:a.q1,q2:a.q2,q3:a.q3,q4:a.q4,q5:a.q5,q6:a.q6,q7:a.q7 },
      dept ? { department: dept } : {}),
  };
  const { error } = await sb.from('simple_tests').insert(payload);
  btn.disabled = false; btn.textContent = '검사 제출';
  if(error){ toast('저장하지 못했습니다: '+error.message, 'bad'); return; }
  showPublicTestResult({ name, ptsd, dep, suicide, matched: !!matched });
}

  const rname={}; S.regions.forEach(r=>rname[r.id]=r.name);
  const hiCount=(data||[]).filter(t=>
    (t.ptsd_score||0)>=CUT.ptsd||(t.dep_score||0)>=CUT.dep||(t.suicide_risk||0)>=CUT.suicide).length;

  let html=`<div class="panel"><h2>간이검사 결과</h2>
    <div class="desc">전체 ${data?.length||0}건 · 고위험 ${hiCount}건
      · 기준 PTSD ${CUT.ptsd}점 / 우울 ${CUT.dep}점 / 자살위험 ${CUT.suicide}점</div>`;
  if(!data?.length){
    html += `<div class="empty">아직 검사 결과가 없습니다.
      <br>'간이검사 실시'에서 첫 검사를 진행해 보세요.</div>`;
  }else{
    html += `<table><thead><tr><th>검사일</th><th>이름</th><th>생년월일</th><th>지역</th>
      <th>PTSD</th><th>우울</th><th>자살위험</th><th>판정</th></tr></thead><tbody>`;
    data.forEach(t=>{
      const hi=(t.ptsd_score||0)>=CUT.ptsd||(t.dep_score||0)>=CUT.dep||(t.suicide_risk||0)>=CUT.suicide;
      const em=v=>v?' style="color:var(--warn);font-weight:700"':'';
      html += `<tr ${t.client_id?`onclick="openClient('${t.client_id}')"`:''}>
        <td>${fmtDate(t.tested_at)}</td><td><b>${esc(t.client_name||'')}</b></td>
        <td>${esc(t.birth_date||'')}</td><td>${esc(rname[t.region_id]||'')}</td>
        <td${em((t.ptsd_score||0)>=CUT.ptsd)}>${t.ptsd_score??'—'}</td>
        <td${em((t.dep_score||0)>=CUT.dep)}>${t.dep_score??'—'}</td>
        <td${em((t.suicide_risk||0)>=CUT.suicide)}>${t.suicide_risk??'—'}</td>
        <td>${hi?'<b style="color:var(--warn)">고위험</b>':'정상'}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `<div class="actions">
    <button class="btn" onclick="openSimpleTest()">간이검사 실시</button>
    <button class="btn ghost" onclick="openTab('home')">대시보드로</button></div></div>`;
  c.innerHTML=html;
}

/* ═══════════════════════════════════════════════════
   통계 — 항목 유형이 집계 방식을 결정
     하나 선택 / 여러 개 선택 → 항목별 건수와 비율
     숫자                    → 건수·합계·평균·최소·최대
     날짜                    → 월별 추이
     예/아니오               → 예·아니오 비율
     글·파일                 → 집계하지 않음
   ═══════════════════════════════════════════════════ */
async function renderStats(){
  const c=$('content');
  const fid = S._statForm && S.forms.find(f=>f.id===S._statForm) ? S._statForm : S.forms[0]?.id;
  S._statForm = fid;
  if(!fid){ c.innerHTML='<div class="panel"><div class="empty">폼이 없습니다.</div></div>'; return; }

  const from = S._statFrom || '';
  const to = S._statTo || '';
  const reg = S._statRegion || '';

  c.innerHTML = `<div class="panel">
    <h2>통계</h2>
    <div class="desc">항목 유형에 맞춰 자동으로 집계합니다. 항목을 추가하면 통계도 따라 늘어납니다.</div>
    <div class="grid">
      <div class="field"><label>폼</label><select id="st_form" onchange="applyStat()">
        ${S.forms.map(f=>`<option value="${f.id}" ${f.id===fid?'selected':''}>${esc(f.title)}</option>`).join('')}
      </select></div>
      <div class="field"><label>지역</label><select id="st_region" onchange="applyStat()">
        <option value="">전체</option>
        ${regionOptionsHTML(reg, { plain:true })}
      </select></div>
      <div class="field"><label>시작일</label>
        <input type="date" id="st_from" value="${from}" onchange="applyStat()"></div>
      <div class="field"><label>종료일</label>
        <input type="date" id="st_to" value="${to}" onchange="applyStat()"></div>
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="clearStat()">조건 초기화</button>
      <button class="btn ghost" onclick="window.open(location.pathname+'#stats','_blank')">새 창으로 열기</button>
    </div>
  </div><div id="statBody"><div class="panel"><div class="empty">집계 중…</div></div></div>`;

  const form = S.forms.find(f=>f.id===fid);
  const { data: fields } = await sb.from('form_fields').select('*')
    .eq('form_id', fid).order('sort_order');

  let q = sb.from('form_records').select('*').eq('form_id', fid).limit(5000);
  if(reg) q = q.eq('region_id', reg);
  if(from) q = q.gte('created_at', from);
  if(to) q = q.lte('created_at', to+'T23:59:59');
  const { data: recs, error } = await q;
  if(error){ $('statBody').innerHTML=`<div class="panel"><div class="msg bad">${esc(error.message)}</div></div>`; return; }

  if(!recs.length){
    $('statBody').innerHTML = `<div class="panel"><div class="empty">
      조건에 맞는 기록이 없습니다.<br>기간이나 지역을 넓혀 보세요.</div></div>`;
    return;
  }

  const rname={}; S.regions.forEach(r=>rname[r.id]=r.name);
  let html = `<div class="cards">
    ${card('기록 수', recs.length.toLocaleString()+'건')}
    ${card('작성자', new Set(recs.map(r=>r.author_name).filter(Boolean)).size+'명')}
    ${form.links_client?card('내담자', new Set(recs.map(r=>r.client_id||r.client_name).filter(Boolean)).size+'명'):''}
  </div>`;

  // 공통 집계: 월별 추이 / 지역별 / 작성자별
  html += statPanel('월별 기록 수', barList(monthly(recs.map(r=>r.created_at)), null, true));
  html += statPanel('지역별', barList(tally(recs.map(r=>rname[r.region_id])), null, true));
  html += statPanel('작성자별', barList(tally(recs.map(r=>r.author_name)), null, true));

  // 항목별 집계
  for(const f of (fields||[])){
    if(!f.stats_enabled) continue;
    if(['text','textarea','file'].includes(f.field_type)) continue;
    const vals = recs.map(r=>r.data?.[f.field_key]).filter(v=>v!==null&&v!==undefined&&v!=='');
    if(!vals.length){
      html += statPanel(f.label, `<div class="empty">아직 입력된 값이 없습니다.</div>`, vals.length);
      continue;
    }
    if(f.field_type==='number'){
      const nums = vals.map(Number).filter(n=>!isNaN(n));
      const sum = nums.reduce((a,b)=>a+b,0);
      html += statPanel(f.label, `<div class="cards">
        ${card('건수', nums.length+'건')}${card('합계', sum.toLocaleString())}
        ${card('평균', (sum/nums.length).toFixed(1))}
        ${card('최소~최대', Math.min(...nums)+' ~ '+Math.max(...nums))}</div>`, nums.length);
    }else if(f.field_type==='date'){
      html += statPanel(f.label, barList(monthly(vals), null, true), vals.length);
    }else if(f.field_type==='multiselect'){
      const flat=[]; vals.forEach(v=>Array.isArray(v)?flat.push(...v):flat.push(v));
      html += statPanel(f.label, barList(tally(flat), null, true), vals.length,
        `응답 ${vals.length}건에서 ${flat.length}개 선택 (중복 선택 가능)`);
    }else if(f.field_type==='checkbox'){
      html += statPanel(f.label, barList(tally(vals.map(v=>v?'예':'아니오')), null, true), vals.length);
    }else{
      html += statPanel(f.label, barList(tally(vals), null, true), vals.length);
    }
  }
  $('statBody').innerHTML = html;
}
function statPanel(title, body, n, note){
  return `<div class="panel"><h2>${esc(title)}
    ${n!==undefined?`<span class="hint" style="font-weight:400"> · 응답 ${n}건</span>`:''}</h2>
    ${note?`<div class="desc">${esc(note)}</div>`:''}${body}</div>`;
}
// 값 목록 → [[값, 건수]] 많은 순
function tally(values){
  const m={};
  values.filter(v=>v!==null&&v!==undefined&&v!=='').forEach(v=>{ m[v]=(m[v]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]);
}
// 날짜 목록 → 월별 [[YYYY-MM, 건수]] 시간순
function monthly(dates){
  const m={};
  dates.filter(Boolean).forEach(d=>{
    const k=String(d).slice(0,7);
    if(/^\d{4}-\d{2}$/.test(k)) m[k]=(m[k]||0)+1;
  });
  return Object.entries(m).sort((a,b)=>a[0]<b[0]?-1:1);
}
function applyStat(){
  S._statForm=$('st_form').value; S._statRegion=$('st_region').value;
  S._statFrom=$('st_from').value; S._statTo=$('st_to').value;
  renderStats();
}
function clearStat(){
  S._statRegion=''; S._statFrom=''; S._statTo=''; renderStats();
}

function openDetail(i){
  const r = S._recs[i];
  const rname = {}; S.regions.forEach(x=>rname[x.id]=x.name);
  let rows = `<dt>작성일</dt><dd>${fmtDate(r.created_at)}</dd>
    <dt>지역</dt><dd>${esc(rname[r.region_id]||'')}</dd>
    <dt>작성자</dt><dd>${esc(r.author_name||'')}</dd>`;
  if(S.form.links_client){
    rows += `<dt>내담자</dt><dd>${esc(r.client_name||'')} · ${esc(r.birth_date||'')} · ${esc(r.gender||'')} · ID ${esc(r.client_internal_id||'')}</dd>`;
  }
  for(const f of S.fields){
    const v = r.data?.[f.field_key];
    if(v===null||v===undefined||v==='') continue;
    rows += `<dt>${esc(f.label)}</dt><dd>${esc(Array.isArray(v)?v.join(', '):typeof v==='boolean'?(v?'예':'아니오'):v)}</dd>`;
  }
  const ov=document.createElement('div');
  ov.className='overlay';
  // 바깥을 눌러도 닫히지 않습니다. 글을 쓰다 실수로 옆을 눌러 날리는 일이
  // 잦았기 때문입니다. 닫으려면 '취소'를 누르거나 ESC를 누릅니다.
  ov.innerHTML=`<div class="modal"><h3>${esc(S.form.title)} 상세</h3>
    <dl class="dl">${rows}</dl>
    <div class="actions">
      ${canEditRecord(r)?`<button class="btn" onclick="this.closest('.overlay').remove();editRecordModal(S._recs[${i}])">수정</button>
      <button class="btn ghost" style="color:var(--warn);border-color:var(--warn)"
        onclick="deleteRecord(S._recs[${i}])">삭제</button>`:''}
      <button class="btn ghost" onclick="this.closest('.overlay').remove()">닫기</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
}
</script>
