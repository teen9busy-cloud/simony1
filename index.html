<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시모니 1.0</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- 본문 글꼴. 내려받지 못하는 망에서는 아래 font-family의 맑은 고딕으로 내려앉습니다. -->
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  /* 바탕과 면 — 회색에 초록기를 살짝 섞어 '고른 색'으로 보이게 합니다 */
  --bg:#f1f5f2; --panel:#fff; --line:#dbe3de; --line2:#edf1ee;
  /* 글자 — 세 단계면 충분합니다 */
  --ink:#16221c; --sub:#5c6e64;
  /* 강조 — 기존 짙은 초록을 그대로 씁니다 (소방·안정감) */
  --accent:#1b5e20; --accent-soft:#e9f0eb; --accent-dark:#124017;
  --warn:#b3261e; --warn-soft:#fdecea;
  --radius:8px; --radius-sm:6px;
  /* 그림자 — 아주 옅게. 면이 떠 있다는 느낌만 줍니다 */
  --shadow:0 1px 2px rgba(22,34,28,.05), 0 1px 1px rgba(22,34,28,.04);
  --shadow-lg:0 10px 30px rgba(22,34,28,.13), 0 2px 8px rgba(22,34,28,.07);
  --ring:0 0 0 3px rgba(27,94,32,.16);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Pretendard Variable",Pretendard,"Malgun Gothic","맑은 고딕",
    -apple-system,system-ui,sans-serif;
  font-size:17px;line-height:1.65;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility}
button{font-family:inherit;font-size:17px;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:17px;color:var(--ink)}
h1,h2,h3{letter-spacing:-.02em}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hidden{display:none !important}

/* 헤더 */
header{background:var(--accent);color:#fff;padding:0 22px;display:flex;
  align-items:center;gap:16px;height:62px;position:sticky;top:0;z-index:50;
  box-shadow:0 1px 0 rgba(0,0,0,.12), 0 2px 12px rgba(22,34,28,.10)}
header h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-.03em}
header .spacer{flex:1}
header .who{font-size:15px;opacity:.9}
header .ver{font-size:13px;opacity:.65;background:rgba(255,255,255,.15);
  padding:3px 8px;border-radius:12px;letter-spacing:.02em}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;
  padding:6px 12px;border-radius:var(--radius)}
header button:hover{background:rgba(255,255,255,.28)}

.wrap{max-width:1440px;margin:0 auto;padding:20px}

/* 탭 */
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);
  margin-bottom:20px;flex-wrap:wrap}
nav.tabs button{background:none;border:0;padding:14px 18px;color:var(--sub);font-size:16.5px;
  border-bottom:2.5px solid transparent;margin-bottom:-1px;font-weight:600;
  border-radius:var(--radius-sm) var(--radius-sm) 0 0;transition:color .12s,background .12s}
nav.tabs button:hover{color:var(--ink);background:var(--accent-soft)}
nav.tabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:700}

.panel{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:22px 24px;margin-bottom:16px;
  box-shadow:var(--shadow)}
.panel h2{margin:0 0 5px;font-size:21px;font-weight:700}
.panel .desc{color:var(--sub);font-size:16px;margin-bottom:18px;line-height:1.6}

/* 폼 */
.section-title{font-size:15px;font-weight:700;color:var(--accent-dark);
  background:var(--accent-soft);padding:9px 14px;border-radius:var(--radius-sm);
  margin:24px 0 14px;letter-spacing:.01em;border-left:3px solid var(--accent)}
.section-title:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.field.wide{grid-column:1/-1}
.field label{display:block;font-size:15.5px;font-weight:700;margin-bottom:7px;color:var(--ink)}
.field label .req{color:var(--warn);margin-left:3px}
.field input[type=text],.field input[type=number],.field input[type=date],
.field input[type=time],.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line);
  border-radius:var(--radius-sm);background:#fff;
  transition:border-color .12s, box-shadow .12s}
.field input:hover,.field select:hover,.field textarea:hover{border-color:#c3cfc8}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:var(--ring)}
.field textarea{min-height:96px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{
  outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.checks{display:flex;flex-wrap:wrap;gap:8px 16px;padding:10px 12px;
  border:1px solid var(--line);border-radius:var(--radius);background:#fff;
  max-height:190px;overflow:auto}
.checks label{display:flex;align-items:center;gap:5px;font-weight:400;
  font-size:15px;margin:0;cursor:pointer}
.hint{font-size:15px;color:var(--sub);margin-top:4px;line-height:1.55}
.err{border-color:var(--warn) !important}

/* 선택지가 적은 항목은 드롭다운 대신 버튼으로 펼쳐 보여 줍니다.
   (드롭다운은 그대로 두고 숨깁니다. 값을 읽고 쓰는 코드는 그대로 씁니다.) */
select.as-chips{display:none}
.chips-pick{display:flex;flex-wrap:wrap;gap:8px}
.chip-opt{padding:11px 15px;font-size:16.5px;font-weight:500;line-height:1.3;
  border:1.5px solid var(--line);border-radius:var(--radius-sm);background:#fff;
  color:var(--ink);text-align:left;transition:border-color .1s,background .1s}
.chip-opt:hover{border-color:var(--accent);background:var(--accent-soft)}
.chip-opt.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
select.as-chips.err ~ .chips-pick .chip-opt{border-color:var(--warn)}
.prefill-note{display:inline-flex;align-items:center;gap:5px;margin-top:6px;
  font-size:14.5px;color:var(--accent-dark);background:var(--accent-soft);
  border-radius:20px;padding:3px 11px;font-weight:600}

/* 버튼 */
.btn{background:var(--accent);color:#fff;border:1px solid var(--accent);
  padding:12px 22px;border-radius:var(--radius-sm);font-weight:700;font-size:16.5px;
  transition:background .12s,box-shadow .12s,transform .06s}
.btn:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:600}
.btn.ghost:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.actions{display:flex;gap:8px;margin-top:22px;padding-top:16px;
  border-top:1px solid var(--line2)}

/* 표 */
table{width:100%;border-collapse:collapse;font-size:17px}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.scroll-x table{min-width:860px}
td.nowrap,th.nowrap{white-space:nowrap}
th,td{padding:14px 15px;text-align:left;border-bottom:1px solid var(--line2)}
th{background:var(--line2);font-weight:700;font-size:14px;color:var(--sub);
  position:sticky;top:0;letter-spacing:.03em;
  border-bottom:1px solid var(--line)}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--accent-soft);cursor:pointer}
.empty{padding:40px 20px;text-align:center;color:var(--sub)}

/* 로그인 */
#loginView{max-width:380px;margin:70px auto}
#loginView .panel{padding:28px}
#loginView h2{font-size:23px;text-align:center;margin-bottom:20px}
#loginView .field{margin-bottom:14px}
#loginView .btn{width:100%}

/* 알림 */
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:var(--radius);
  z-index:200;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast.bad{background:var(--warn)}
.msg{padding:12px 14px;border-radius:var(--radius-sm);font-size:15.5px;
  margin-bottom:14px;line-height:1.6;border-left:3px solid transparent}
.msg.bad{background:var(--warn-soft);color:var(--warn);border:1px solid #f3c9c5;
  border-left:3px solid var(--warn)}
.msg.info{background:var(--accent-soft);color:var(--accent-dark);
  border-left:3px solid var(--accent)}

/* 내담자 선택 */
.client-box{border:1px solid var(--line);border-radius:var(--radius);
  padding:14px;background:#fafcfb;margin-bottom:6px}
.client-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
.client-row .field{flex:1;min-width:130px}
.picked{display:flex;align-items:center;gap:12px;background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:var(--radius);padding:10px 14px}
.picked b{font-size:17px}
.results{margin-top:10px;border:1px solid var(--line);border-radius:var(--radius);
  background:#fff;max-height:210px;overflow:auto}
.results div{padding:9px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.results div:hover{background:var(--accent-soft)}
.results div:last-child{border-bottom:0}

/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(16,26,21,.5);z-index:100;
  display:flex;align-items:flex-start;justify-content:center;padding:44px 16px;overflow:auto;
  backdrop-filter:blur(2px);animation:ovIn .12s ease-out}
@keyframes ovIn{from{opacity:0}to{opacity:1}}
.modal{background:#fff;border-radius:var(--radius);max-width:720px;width:100%;
  padding:26px 28px;box-shadow:var(--shadow-lg);animation:mdIn .14s ease-out}
@keyframes mdIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .overlay,.modal{animation:none}
}
.modal h3{margin:0 0 18px;font-size:20px;font-weight:700;
  padding-bottom:14px;border-bottom:1px solid var(--line2)}
.dl{display:grid;grid-template-columns:170px 1fr;gap:1px;background:var(--line2);
  border:1px solid var(--line2);border-radius:var(--radius);overflow:hidden}
.dl dt{background:#f7faf8;padding:10px 13px;font-weight:700;font-size:15px;color:var(--sub)}
.dl dd{background:#fff;padding:10px 13px;margin:0;font-size:16px;white-space:pre-wrap;line-height:1.6}

/* 검색 바 */
.searchbar{display:flex;gap:10px;align-items:stretch;margin-bottom:6px}
.searchbar input{flex:1;padding:14px 16px;font-size:19.5px;border:2px solid var(--line);
  border-radius:var(--radius);background:#fff}
.searchbar input:focus{outline:0;border-color:var(--accent)}
.searchbar .btn{padding:0 28px;font-size:18.5px}

/* 퀵 버튼 */
.eyebrow{font-size:13.5px;font-weight:700;letter-spacing:.09em;color:var(--sub);
  margin:26px 0 11px;text-transform:none}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.qbtn{display:flex;flex-direction:column;justify-content:center;gap:3px;
  min-height:74px;padding:14px 16px;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius);transition:background .12s,border-color .12s}
.qbtn:hover{background:var(--accent-soft);border-left-color:var(--accent-dark)}
.qbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qbtn b{font-size:19px;font-weight:700;color:var(--ink)}
.qbtn span{font-size:15px;color:var(--sub)}
.qbtn.alert{border-left-color:var(--warn)}
.qbtn.alert b{color:var(--warn)}
/* 아직 만들지 않은 화면 — 자리는 두되 흐리게 보여 줍니다 */
.qbtn.soon{border-left-color:var(--line);background:transparent}
.qbtn.soon b{color:var(--sub);font-weight:600}
.qbtn.soon span{color:var(--sub)}
.qbtn.soon:hover{background:var(--accent-soft);border-left-color:var(--line)}
.qbtn .soon-tag{display:inline-block;margin-right:6px;font-size:12px;font-weight:600;
  color:var(--sub);border:1px solid var(--line);border-radius:3px;padding:0 6px}

/* 이메일 도메인 빠른 입력 */
.domains{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.domain-chip{background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);
  border-radius:20px;padding:6px 13px;font-size:15.5px;font-weight:600}
.domain-chip:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* 집단상담 참여자 */
.member-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:8px;margin-top:12px}
.member{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:#fff;
  border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:10px 12px}
.member b{font-size:18px}
.member span{flex:1;font-size:14.5px;color:var(--sub)}
.member .btn{padding:4px 10px;font-size:15px}

/* 엑셀형 표 */
.grid-table{font-size:15.5px}
.grid-table th{position:sticky;top:0;z-index:2;background:var(--line2);
  box-shadow:inset 0 -1px 0 var(--line)}
/* 머리글은 스크롤 상자 맨 위에 붙습니다.
   페이지 헤더 높이만큼 내리면 상자 안에서는 첫 줄이 가려집니다. */
.grid-table td{padding:9px 11px;white-space:nowrap;max-width:220px;
  overflow:hidden;text-overflow:ellipsis}
.grid-table td.g-first{font-weight:700}
.grid-table tbody tr{cursor:pointer}
.grid-table tbody tr:nth-child(even){background:#fbfcfb}
.grid-table tbody tr:hover{background:var(--accent-soft)}
.cnt{font-size:16px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);padding:3px 10px;border-radius:12px;margin-left:6px}

/* 표시 항목 고르기(표 위의 '표시 항목 ▾') */
.col-picker{position:relative}
.col-picker summary{list-style:none;cursor:pointer}
.col-picker summary::-webkit-details-marker{display:none}
.col-picker-box{position:absolute;right:0;top:calc(100% + 4px);z-index:5;
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 4px 14px rgba(0,0,0,.12);padding:10px 14px;min-width:170px}

/* 변경 이력 */
.audit-day{font-size:15px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);padding:7px 12px;border-radius:var(--radius);
  margin:20px 0 12px}
.chg{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-size:15.5px;margin-top:5px;padding:5px 9px;background:var(--bg);
  border-radius:var(--radius)}
.chg-f{font-weight:700;min-width:90px}
.chg-b{color:var(--warn);text-decoration:line-through;opacity:.75}
.chg-arrow{color:var(--sub)}
.chg-a{color:var(--accent);font-weight:600}

/* 기록 카드 목록 */
.rec-list{display:flex;flex-direction:column;gap:10px}
.rec{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:13px 16px;cursor:pointer;transition:background .12s}
.rec:hover{background:var(--accent-soft)}
.rec-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rec-name{font-size:19px;font-weight:700}
.rec-sub{font-size:15.5px;color:var(--sub)}
.rec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  gap:7px;margin-top:9px;padding-top:9px;border-top:1px solid var(--line2)}
.rec-grid > div{font-size:16px}
.rec-grid span{display:block;font-size:13px;color:var(--sub);margin-bottom:1px}

/* 시간 범위 입력 */
.timerange{display:flex;align-items:center;gap:9px}
.timerange input{flex:1;min-width:110px}
.tr-sep{color:var(--sub);font-weight:700}

/* 다중 선택 배타 항목 */
.checks label.excl{font-weight:700;color:var(--accent)}
.checks label.locked{opacity:.4;cursor:not-allowed}

/* 자동으로 채워진 칸 */
.prefilled{background:#f3f9f4}

/* 내담자 카드 목록 */
.person-list{display:flex;flex-direction:column;gap:10px}
.person{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:background .12s}
.person:hover{background:var(--accent-soft)}
.p-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.p-name{font-size:20.5px;font-weight:700}
.p-sub{font-size:16px;color:var(--sub)}
.p-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}
.p-grid > div{font-size:16px}
.p-grid span{display:block;font-size:13px;color:var(--sub);margin-bottom:1px}

/* 선택된 내담자 정보 */
.picked-box{border:2px solid var(--accent);border-radius:var(--radius);
  padding:14px 16px;background:var(--accent-soft)}
.picked-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.picked-top b{font-size:22px}
.picked-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.picked-grid > div{background:#fff;border-radius:var(--radius);padding:9px 12px}
.picked-grid span{display:block;font-size:14px;color:var(--sub);margin-bottom:2px}
.picked-grid b{font-size:16.5px}

/* 내담자 상세 */
.who-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:14px;
  padding-bottom:14px;border-bottom:2px solid var(--accent);margin-bottom:16px}
.who-head .nm{font-size:30px;font-weight:700;letter-spacing:-.5px}
.who-head .meta{color:var(--sub);font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:4px}
.chip{background:var(--accent-soft);color:var(--accent-dark);border-radius:20px;
  padding:4px 11px;font-size:14px;font-weight:700;letter-spacing:.01em;
  white-space:nowrap;display:inline-block}
.chip.risk{background:var(--warn-soft);color:var(--warn)}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:18px}
.tl-item{position:relative;padding:12px 0;border-bottom:1px solid var(--line2);cursor:pointer}
.tl-item:last-child{border-bottom:0}
.tl-item:hover{background:var(--accent-soft)}
.tl-item::before{content:'';position:absolute;left:-25px;top:19px;width:11px;height:11px;
  border-radius:50%;background:var(--accent);border:2px solid var(--panel)}
.tl-date{font-size:15px;color:var(--sub)}
.tl-title{font-weight:700;font-size:18px;margin:2px 0}
.tl-body{font-size:16px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 간이검사 문항 */
.qcard{border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-bottom:12px;background:#fff}
.qcard.miss{border-color:var(--warn);background:#fdf5f4}
.qtext{font-size:19px;font-weight:600;line-height:1.5;margin-bottom:14px}
.qno{display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;
  font-size:16px;font-weight:700;margin-right:10px;flex-shrink:0}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qopt{flex:1;min-width:130px;padding:14px 12px;font-size:17px;
  background:var(--bg);border:2px solid var(--line);border-radius:var(--radius);
  color:var(--ink);text-align:center;transition:all .12s}
.qopt:hover{border-color:var(--accent);background:var(--accent-soft)}
.qopt.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}

/* 검사 결과 점수 */
.scores{display:flex;flex-direction:column;gap:14px;margin-top:8px}
.score-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.score-label{width:80px;font-weight:700;font-size:18.5px;flex-shrink:0}
.score-num{width:60px;text-align:right;font-weight:700;font-size:18.5px;flex-shrink:0}
.score-num.over{color:var(--warn)}
.score-cut{width:80px;font-size:15px;color:var(--sub);flex-shrink:0}
.bar-fill.over{background:var(--warn)}

/* 드래그 앤 드롭 영역 */

  border-style:solid;transform:scale(1.01)}

.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.thumb{position:relative;width:116px}
.thumb img{width:116px;height:116px;object-fit:cover;display:block;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.thumb .cap{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.35;
  word-break:break-all}
.thumb .del{position:absolute;top:5px;right:5px;width:26px;height:26px;padding:0;
  border-radius:50%;border:none;background:rgba(0,0,0,.62);color:#fff;
  font-size:15px;line-height:26px;cursor:pointer}
.thumb .del:hover{background:var(--warn)}
.thumb.busy{opacity:.55}
.other-input{margin-top:7px}

/* 카드 */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.card.warn{border-color:#e8b6b1;background:var(--warn-soft)}

.card-value{font-size:27px;font-weight:700;letter-spacing:-.03em;

<script>
/* ═══════════════════════════════════════════════════

const SUPABASE_URL = 'https://jrpbdhhnyyjsuohnvapu.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpycGJkaGhueXlqc3VvaG52YXB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ1NDU4NzcsImV4cCI6MjEwMDEyMTg3N30.A3AzUOpriCJ2P4BBMR2tev13HCRJvoFr7_wt3_OBa2Q';
const API_URL      = 'https://simony-api2-400964231306.asia-northeast3.run.app';

/* ═══════════════════════════════════════════════════
   시모니 1.0 폼 렌더러
   forms / form_fields 정의를 읽어 화면을 자동 생성합니다.
   화면을 바꾸려면 이 파일이 아니라 DB의 폼 정의를 수정하세요.
   ═══════════════════════════════════════════════════ */

let sb = null;
const S = {                    // 앱 상태
  me: null,                    // users 테이블의 내 정보
  regions: [],                 // 내가 접근 가능한 지역

/* 화면에 지금 어떤 파일이 떠 있는지 표시합니다.
   파일을 덮어써도 열려 있던 탭은 갱신되지 않으므로, 이 값이 다르면
   Ctrl+Shift+R 로 강력 새로고침하면 됩니다. */
// 화면 왼쪽 위에 찍히는 버전 표시입니다. 배포가 실제로 반영됐는지
// 눈으로 바로 확인할 수 있게, 내용이 바뀔 때마다 이 값을 함께 올립니다.
const APP_VERSION = '2026-09-01 선택버튼';

/* 상단 메뉴에 둘 폼(이 순서대로). 나머지 폼은 내담자 상세 화면에서만 작성합니다.

   제목을 글자 그대로 맞추지 않고 '들어 있는 낱말'로 찾습니다. 그래야 관리자가

const TOP_NAV_FORMS = [

// 낱말 목록으로 폼 하나를 찾습니다. 앞에 적은 낱말일수록 먼저 맞춰 봅니다.

/* 내담자 상세 화면에 보여줄 폼과 순서 (마찬가지로 제목으로 매칭) */
const CLIENT_FORM_ORDER = ['스크리닝','심층상담','생애주기 상담','긴급심리지원','긴급콜','대형재난 출동'];


/* ── 연결 설정 ── */
function getConfig(){
  // 파일에 심어 둔 값이 있으면 그것을 씁니다.
  // 없을 때만 이 브라우저에 저장된 값을 찾습니다.
  return {
    url: SUPABASE_URL || localStorage.getItem('sb_url'),
    key: SUPABASE_KEY || localStorage.getItem('sb_key'),
  };
}
function saveConfig(){
  const url = document.getElementById('cfgUrl').value.trim().replace(/\/$/,'');
  const key = document.getElementById('cfgKey').value.trim();
  if(!url.startsWith('https://') || !key){ toast('URL과 키를 모두 입력하세요','bad'); return; }
  localStorage.setItem('sb_url',url); localStorage.setItem('sb_key',key);
  location.reload();
}
function resetConfig(){
  localStorage.removeItem('sb_url'); localStorage.removeItem('sb_key'); location.reload();
}
/* 로그인 화면 아래에 '연결 설정 변경'을 띄웁니다.
   파일에 주소·키를 심어 둔 경우(지금 배포본)에는 바꿀 것이 없으므로 띄우지 않습니다.
   ※ 이 함수는 원래 호출만 있고 정의가 빠져 있었습니다. 그래서 로그인 화면이
     그려지다 멈춰, 바로 뒤의 '아이디 기억하기'가 동작하지 않았습니다. */
function showConfigLink(){
  const box = $('cfgLink'); if(!box) return;
  if(SUPABASE_URL && SUPABASE_KEY){ box.innerHTML=''; return; }
  box.innerHTML = `<a href="#" onclick="resetConfig();return false">연결 설정 변경</a>`;
}

/* ── 유틸 ── */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// onclick="..." 안에 넣을 문자열을 안전하게 만듭니다.
// 이름에 따옴표가 섞이면 속성이 중간에 끊겨 버튼이 아예 동작하지 않기 때문입니다.
const jsq = s => String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'")
  .replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/[\r\n]/g,' ');
function show(v){ ['setupView','loginView','appView','publicTestView'].forEach(x=>$(x).classList.toggle('hidden',x!==v)); }
function toast(msg,kind){
  const t=document.createElement('div');
  t.className='toast'+(kind==='bad'?' bad':''); t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),3200);
}
/* ESC를 누르면 맨 위에 떠 있는 팝업창을 닫습니다.
   팝업은 바깥을 눌러도 닫히지 않으므로, 닫는 길은 '취소' 버튼과 ESC 두 가지입니다. */
document.addEventListener('keydown', e=>{
  if(e.key !== 'Escape') return;
  const all = document.querySelectorAll('.overlay');
  if(all.length) all[all.length-1].remove();
});

function fmtDate(iso){
  if(!iso) return '';
  const d=new Date(iso);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

/* ── 생년월일: 8자리를 연속으로 치면 자동으로 하이픈이 들어갑니다 ──
   '19820801' → '1982-08-01'.  점·슬래시로 쳐도 받아줍니다. */
function normalizeBirth(v){
  const digits = String(v||'').replace(/[^0-9]/g,'');
  if(digits.length!==8) return null;
  const y=+digits.slice(0,4), m=+digits.slice(4,6), d=+digits.slice(6,8);
  if(y<1900 || y>new Date().getFullYear()) return null;
  if(m<1||m>12||d<1||d>31) return null;
  const dt=new Date(y, m-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return null;
  return `${digits.slice(0,4)}-${digits.slice(4,6)}-${digits.slice(6,8)}`;
}
// 입력하는 동안 하이픈을 넣어 보여줍니다 (값 자체는 저장 시 normalizeBirth로 확정)
function maskBirth(el){
  const digits = el.value.replace(/[^0-9]/g,'').slice(0,8);
  let out = digits;
  if(digits.length>6) out = digits.slice(0,4)+'-'+digits.slice(4,6)+'-'+digits.slice(6);
  else if(digits.length>4) out = digits.slice(0,4)+'-'+digits.slice(4);
  el.value = out;
  const ok = digits.length===8 && normalizeBirth(digits);
  el.classList.toggle('err', digits.length===8 && !ok);
  return ok ? normalizeBirth(digits) : null;
}
// 생년월일 입력칸 HTML (공통)
function birthInputHTML(id, value, onDone){
  return `<input type="text" id="${id}" inputmode="numeric" maxlength="10"
    placeholder="19820801" value="${esc(value||'')}"
    oninput="maskBirth(this)${onDone?';'+onDone:''}">
    <div class="hint">숫자 8자리를 이어서 입력하면 자동으로 형식이 맞춰집니다</div>`;
}

/* ── 생년월일 → 연령대 (만 나이 기준) ── */
function ageFromBirth(birth){
  const b = normalizeBirth(birth) || birth;
  if(!b || !/^\d{4}-\d{2}-\d{2}$/.test(b)) return null;
  const [y,m,d] = b.split('-').map(Number);
  const t = new Date();
  let age = t.getFullYear()-y;
  if(t.getMonth()+1 < m || (t.getMonth()+1===m && t.getDate()<d)) age--;
  return age>=0 && age<120 ? age : null;
}
function ageGroupFromBirth(birth){
  const age = ageFromBirth(birth);
  if(age===null) return null;
  if(age<20) return '20대';
  if(age>=60) return '60대 이상';
  return Math.floor(age/10)*10 + '대';
}

/* ── 백엔드(Cloud Run) 주소 ── */
function apiBase(){
  return (API_URL || localStorage.getItem('sb_api') || '').replace(/\/$/,'');
}
async function apiCall(path, opts){
  const base = apiBase();
  if(!base) throw new Error('백엔드 주소가 설정되지 않았습니다. 관리 → 내담자 DB 화면에서 등록하세요.');
  const { data:{ session } } = await sb.auth.getSession();
  const headers = Object.assign({}, opts?.headers||{});
  if(session?.access_token) headers['Authorization'] = 'Bearer '+session.access_token;
  const res = await fetch(base+path, Object.assign({}, opts, { headers }));
  if(!res.ok){
    let msg = res.status+' 오류';
    try{ const j = await res.json(); msg = j.error || msg; }catch(e){}
    throw new Error(msg);
  }
  return res;
}

/* ── 시작 ──

   바로 로그인 없이 여는 간이검사 화면을 띄웁니다. 큐알·링크는 이 주소로 만듭니다:
   https://teen9busy-cloud.github.io/simony1/#publictest */
(async function init(){
  if(location.hash.slice(1).startsWith('publictest')){
    sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    show('publicTestView');
    return renderPublicTest();

  const cfg = getConfig();
  if(!cfg.url || !cfg.key){ show('setupView'); return; }
  sb = supabase.createClient(cfg.url, cfg.key);
  const { data:{ session } } = await sb.auth.getSession();
  if(session) await enterApp();
  else { show('loginView'); showConfigLink(); loadRememberedEmail(); }
})();

// 로그인 주소를 만들 때 붙이는 도메인. 서버의 LOGIN_DOMAIN과 같아야 합니다.
const LOGIN_DOMAIN = 'simony.local';

function loadRememberedEmail(){
  const saved = localStorage.getItem('sb_email');
  if(saved && $('email')){
    $('email').value = saved;
    if($('remember')) $('remember').checked = true;
    setTimeout(()=>$('password')?.focus(), 100);
  }
}
async function doLogin(){
  const btn=$('loginBtn'), box=$('loginMsg');
  box.innerHTML='';
  const raw = $('email').value.trim(), password = $('password').value;
  if(!raw||!password){
    box.innerHTML='<div class="msg bad">아이디와 비밀번호를 입력하세요.</div>'; return;
  }
  // 아이디만 치면 시스템이 로그인 주소를 만들어 씁니다.
  // 예전처럼 이메일을 그대로 치는 것도 받아 줍니다.
  const email = raw.includes('@') ? raw : (raw.toLowerCase() + '@' + LOGIN_DOMAIN);
  btn.disabled=true; btn.textContent='확인 중…';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled=false; btn.textContent='로그인';
  if(!error){
    if($('remember')?.checked) localStorage.setItem('sb_email', raw);
    else localStorage.removeItem('sb_email');
  }
  if(error){
    const m = String(error.message||'');
    let guide;
    if(/Invalid login credentials/i.test(m))
      guide = '아이디 또는 비밀번호가 맞지 않습니다. 관리자에게 다시 물어보세요.';
    else if(/Email not confirmed/i.test(m))
      guide = '아직 쓸 수 없는 계정입니다. 관리자에게 말씀해 주세요.';
    else if(/banned|disabled/i.test(m))
      guide = '사용이 중지된 계정입니다. 관리자에게 문의해 주세요.';
    else if(/Invalid API key|No API key|JWT/i.test(m))
      guide = 'anon 키가 더 이상 유효하지 않습니다. 아래 \'연결 설정 변경\'에서 현재 키를 다시 넣으세요.';
    else if(/rate|too many/i.test(m))
      guide = '시도가 잦아 잠시 막혔습니다. 1~2분 뒤 다시 시도하세요.';
    else if(/fetch|network/i.test(m))
      guide = 'Supabase에 연결하지 못했습니다. 인터넷 연결과 Project URL을 확인하세요.';
    else guide = '로그인하지 못했습니다.';
    box.innerHTML = `<div class="msg bad">${esc(guide)}<div class="hint"
      style="margin-top:6px;color:inherit;opacity:.75">원본 오류: ${esc(m)}</div></div>`;
    return;
  }
  await enterApp();
}
async function doLogout(){ await sb.auth.signOut(); location.reload(); }

/* ── 로그인 이후: 내 정보·지역·폼 불러오기 ── */
async function enterApp(){
  const { data:{ user } } = await sb.auth.getUser();

  const { data: me } = await sb.from('users').select('*').eq('auth_user_id', user.id).maybeSingle();
  if(!me){
    show('loginView');
    $('loginMsg').innerHTML = '<div class="msg bad">이 계정은 아직 시모니 사용자로 등록되지 않았습니다.'
      + '<br>관리자에게 users 테이블 등록을 요청하세요.</div>';
    await sb.auth.signOut();
    loadRememberedEmail();
    return;
  }
  S.me = me;

  // 접근 가능한 지역: 최종관리자는 전체, 그 외는 부여받은 지역 + 그 하위지역
  const { data: allRegions } = await sb.from('regions').select('*').order('sort_order');
  S.allRegions = allRegions || [];
  if(me.role === 'super_admin'){
    S.regions = allRegions || [];
  }else{
    const { data: mine } = await sb.from('user_regions').select('region_id').eq('user_id', me.id);
    const seed = new Set((mine||[]).map(r=>r.region_id));
    let grew = true;
    while(grew){                       // 하위지역까지 펼치기
      grew = false;
      for(const r of (allRegions||[])){
        if(r.parent_id && seed.has(r.parent_id) && !seed.has(r.id)){ seed.add(r.id); grew = true; }
      }
    }
    S.regions = (allRegions||[]).filter(r=>seed.has(r.id));
  }

  const { data: forms } = await sb.from('forms').select('*').eq('is_active',true).order('sort_order');
  S.forms = forms || [];

  await loadLookups();

  const roleLabel = { super_admin:'최종관리자', manager:'중간관리자', counselor:'상담사' }[me.role] || me.role;
  $('whoami').textContent = `${me.name} · ${roleLabel}`;

  $('verTag').textContent = APP_VERSION;
  show('appView');
  renderTabs();
  // 주소에 화면이 적혀 있으면 그 화면으로 (새로고침·즐겨찾기 대비)
  if(location.hash.length > 1) routeFromHash();
  else openTab('home', { replace:true });
}

/* ── 선택지 마스터 불러오기 (상세소속·직급·직무) ── */
async function loadLookups(){
  const [{ data: depts }, { data: codes }] = await Promise.all([
    sb.from('departments').select('*').eq('is_active',true).order('sort_order'),
    sb.from('code_options').select('*').eq('is_active',true).order('sort_order'),
  ]);
  S.depts = depts || [];
  S.codes = { rank:[], duty:[] };
  (codes||[]).forEach(c=>{ if(S.codes[c.code_type]) S.codes[c.code_type].push(c); });
}
// lookup_source와 지역에 맞는 선택지 목록
function lookupOptions(source, regionId){
  // 소방서/센터 = 그 지역의 하위지역 목록
  if(source==='subregion'){
    if(!regionId) return [];
    const kids = S.allRegions.filter(r=>r.parent_id===regionId);
    if(kids.length) return kids.map(r=>r.name);
    // 이미 하위지역을 고른 상태라면 형제들을 보여 준다
    const me = S.allRegions.find(r=>r.id===regionId);
    if(me?.parent_id){
      return S.allRegions.filter(r=>r.parent_id===me.parent_id).map(r=>r.name);
    }
    return [];
  }
  if(source==='department'){
    return S.depts.filter(d=>!regionId || d.region_id===regionId).map(d=>d.name);
  }
  if(source==='rank' || source==='duty'){
    return (S.codes[source]||[])
      .filter(c=>!c.region_id || !regionId || c.region_id===regionId)
      .map(c=>c.label);
  }
  return [];
}
const OTHER = '기타(직접 입력)';

/* ── 선택지를 버튼으로 펼치기 ───────────────────────────────────────
   드롭다운은 한 번 눌러 열고 다시 눌러 고르는 두 동작이 듭니다.
   선택지가 몇 개 안 되는 항목(상담 형태·경로 등)은 처음부터 다 보여 주고
   한 번만 누르게 합니다. 구 시모니(0.5)가 하던 방식입니다.

   '주요 스트레스원'처럼 목록이 긴 항목은 화면이 지저분해지므로 드롭다운을
   그대로 둡니다. 기준은 CHIP_MAX 하나뿐입니다.

   구현: <select>는 지우지 않고 숨겨 둡니다. 값을 읽고 쓰는 기존 코드
   (selectValue·setSelectValue·refreshLookupFields·저장·수정)를 하나도
   건드리지 않아도 되기 때문입니다. 버튼은 그 <select>의 값을 바꿀 뿐입니다. */
const CHIP_MAX = 8;
function chipListFor(f, regionId){
  if(f.field_type !== 'select') return [];
  const list = f.lookup_source ? lookupOptions(f.lookup_source, regionId) : (f.options||[]);
  return (list.length && list.length <= CHIP_MAX) ? list : [];
}
// 드롭다운 하나에 붙일 버튼줄을 만듭니다.
//   cls  : <select>에 붙일 class ('as-chips'면 드롭다운을 숨깁니다)
//   html : 그 아래에 넣을 버튼줄
// 버튼줄 자리는 늘 만들어 둡니다. 지역이 바뀌어 선택지 개수가 달라져도
// (부서 5개 → 15개) 그 자리에서 켜고 끌 수 있게 하기 위해서입니다.
function chipsFor(id, list, withOther){
  const on = list.length > 0 && list.length <= CHIP_MAX;
  const vals = on ? list.concat(withOther ? [OTHER] : []) : [];
  return {
    cls: on ? 'as-chips' : '',
    html: `<div class="chips-pick" id="${id}_chips">${vals.map(o=>
      `<button type="button" class="chip-opt"
        onclick="pickChip('${id}','${jsq(o)}')">${esc(o)}</button>`).join('')}</div>`,
  };
}
// 버튼을 누르면 숨은 드롭다운의 값을 바꿉니다. 같은 것을 다시 누르면 선택을 풉니다.
function pickChip(id, v){
  const sel = $(id); if(!sel) return;
  sel.value = (sel.value === v) ? '' : v;
  sel.classList.remove('err');
  clearPrefillNote(id);
  toggleOther(id);                 // 여기서 syncChips까지 함께 돌아갑니다
  if(sel.value === OTHER) $(id+'_other')?.focus();
}
// 드롭다운의 지금 목록·값에 맞춰 버튼줄을 다시 그립니다.
// (지역이 바뀌어 목록이 통째로 바뀌었을 때도 이 함수 하나로 맞춰집니다.)
function syncChips(id){
  const sel = $(id), row = $(id+'_chips');
  if(!sel || !row) return;
  // 선택지가 많아 드롭다운으로 돌아간 항목이면 버튼줄을 비워 둡니다
  if(!sel.classList.contains('as-chips')){ row.innerHTML=''; return; }
  row.innerHTML = [...sel.options].filter(o=>o.value!=='')
    .map(o=>`<button type="button" class="chip-opt${o.value===sel.value?' on':''}"
      onclick="pickChip('${id}','${jsq(o.value)}')">${esc(o.textContent)}</button>`).join('');
}

/* 지역 목록을 상위 → 그 하위 순서로 줄 세웁니다.
   그냥 나열하면 상위와 하위가 뒤섞여 어느 것이 상위인지 알 수 없습니다. */
/* 지역을 나무 모양(윗지역 → 아랫지역)으로 늘어놓습니다.

   단계 수를 정해 두지 않았습니다. 지금은 '경남소방 → 진주소방서' 두 단계지만,
   나중에 '진주소방서 → 진주중앙119센터'처럼 한 단계가 더 생겨도 제자리에 들어갑니다.
   (게시판이 글을 아래로 내려보내는 규칙도 단계 수를 따지지 않으므로 둘이 맞습니다.) */
function regionTree(list){
  const arr = list || S.regions;
  const byParent = new Map();
  arr.forEach(r=>{
    const k = r.parent_id || '';
    if(!byParent.has(k)) byParent.set(k, []);
    byParent.get(k).push(r);
  });
  const sortFn = (a,b)=>(a.sort_order||0)-(b.sort_order||0) || a.name.localeCompare(b.name);
  byParent.forEach(v=>v.sort(sortFn));

  const out = [], seen = new Set();
  const walk = (parentKey, depth)=>{
    for(const r of (byParent.get(parentKey) || [])){
      if(seen.has(r.id)) continue;      // 혹시 부모가 서로를 가리켜도 멈춥니다
      seen.add(r.id);
      out.push({ ...r, depth });
      walk(r.id, depth + 1);
    }
  };
  walk('', 0);

  // 윗지역이 목록에 없는 지역도 빠뜨리지 않습니다 (권한 때문에 윗지역만 안 보일 때)
  arr.filter(r=>!seen.has(r.id)).forEach(r=>out.push({ ...r, depth:1 }));
  return out;
}
// 드롭다운 항목 만들기
function regionOptionsHTML(selectedId, opt){
  const showKind = !(opt && opt.plain);
  return regionTree().map(r=>{
    const label = r.depth
      ? '　└ ' + r.name
      : r.name + (showKind ? ' (상위지역)' : '');
    return `<option value="${r.id}" ${r.id===selectedId?'selected':''}>${esc(label)}</option>`;
  }).join('');
}
// 목록에 이미 '기타'가 들어 있으면 별도의 직접 입력 항목을 만들지 않습니다
function hasOwnOther(list){
  return (list||[]).some(o => /^\s*(\d+\.\s*)?기타/.test(String(o)));
}
function needOther(f, list){
  if(hasOwnOther(list)) return false;
  return !!(f.allow_other || f.lookup_source);
}

/* ── 탭 ── */
function renderTabs(){
  const t=$('tabs'); t.innerHTML='';
  t.insertAdjacentHTML('beforeend',
    `<button data-tab="home" onclick="openTab('home')">대시보드</button>
     <button data-tab="myclients" onclick="openTab('myclients')">내 내담자 보기</button>`);
  // 상담사가 매일 쓰는 화면만 상단에 둡니다. 그 외 폼(심층상담·생애주기 상담·
  // 긴급심리지원·긴급콜·대형재난 출동)은 내담자 상세 화면에서 작성합니다.
  TOP_NAV_FORMS.forEach(({words})=>{
    const f = findForm(words);
    if(!f) return;
    t.insertAdjacentHTML('beforeend',
      `<button data-tab="form:${f.id}" onclick="openTab('form:${f.id}')">${esc(f.title)}</button>`);
  });
  // 게시판은 상담사도 씁니다 (읽고 답글 달기). 그래서 폼 옆에 둡니다.
  t.insertAdjacentHTML('beforeend',
    `<button data-tab="board" onclick="openTab('board')">게시판</button>`);
  if(canManage()){
    t.insertAdjacentHTML('beforeend',
      `<button data-tab="list" onclick="openTab('list')">기록 목록</button>
       <button data-tab="stats" onclick="openTab('stats')">통계</button>
       <button data-tab="admin:forms" onclick="openTab('admin:forms')"
        style="margin-left:auto;color:var(--accent)">관리</button>`);
  }
}
function canManage(){ return ['super_admin','manager'].includes(S.me.role); }
// 지역·사용자·폼처럼 전 지역에 영향을 주는 것은 최종관리자만 다룹니다
function isSuper(){ return S.me.role === 'super_admin'; }

/* 주소창에 지금 보는 화면을 남겨, 브라우저 뒤로가기가 동작하게 합니다.
   openTab은 기록을 남기고, 뒤로가기로 들어올 때는 showTab만 부릅니다. */
function openTab(tab, opts){
  const replace = opts && opts.replace;
  if(location.hash.slice(1) !== tab){
    if(replace) history.replaceState({ tab }, '', '#'+tab);
    else history.pushState({ tab }, '', '#'+tab);
  }
  showTab(tab);
}
// 내담자 상세는 주소에 사람 번호까지 남겨, 뒤로가기로 목록에 돌아갈 수 있게 합니다
function openClient(id){
  if(location.hash.slice(1) !== 'client:'+id){
    history.pushState({ tab:'client:'+id }, '', '#client:'+id);
  }
  return showClient(id);
}
function routeFromHash(){
  const raw = location.hash.slice(1);
  if(!raw){ showTab('home'); return; }
  if(raw.startsWith('client:')){ showClient(raw.slice(7)); return; }
  showTab(raw);
}
window.addEventListener('popstate', ()=>{
  if(!S.me) return;                 // 로그인 전에는 무시
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  routeFromHash();
});

function showTab(tab){
  S.tab = tab;
  document.querySelectorAll('#tabs button').forEach(b=>
    b.classList.toggle('on', b.dataset.tab===tab
      || (tab.startsWith('admin:') && b.dataset.tab==='admin:forms')
      || (tab.startsWith('list') && b.dataset.tab==='list')
      || (tab.startsWith('board') && b.dataset.tab==='board')));
  const [mode,id] = tab.split(':');
  if(mode==='home'){ renderHome(); return; }
  if(mode==='myclients'){ showMyClients(); return; }
  if(mode==='board'){ renderBoard(id); return; }   // id가 있으면 그 글을 폅니다
  if(mode==='stats'){ renderStats(); return; }
  if(mode==='admin'){ renderAdmin(id); return; }
  if(mode==='list'){
    // 폼을 지정하지 않으면 마지막으로 보던 폼(없으면 첫 폼)을 씁니다
    S.form = S.forms.find(f=>f.id===(id || S._listForm)) || S.forms[0];
    S._listForm = S.form?.id;
    renderList();
    return;
  }
  S.form = S.forms.find(f=>f.id===id);
  if(mode==='form') renderForm();
}

/* ═══════════════════════════════════════════════════
   폼 렌더러 — form_fields 정의대로 입력 화면을 그림
   ═══════════════════════════════════════════════════ */
async function renderForm(){
  const c=$('content');
  c.innerHTML='<div class="panel"><div class="empty">불러오는 중…</div></div>';

  const { data: fields, error } = await sb.from('form_fields').select('*')
    .eq('form_id', S.form.id).eq('is_active', true).order('sort_order');
  if(error){ c.innerHTML=`<div class="panel"><div class="msg bad">항목을 불러오지 못했습니다: ${esc(error.message)}</div></div>`; return; }
  S.fields = fields || [];
  S.client = S._preClient || null;
  S.members = [];
  const preRegion = S._preClient?.region_id;
  S._preClient = null;

  // 지역 선택
  const regionOpts = regionOptionsHTML(preRegion, { plain:true });

  let html = `<div class="panel">
    <h2>${esc(S.form.title)}</h2>
    <div class="desc">${esc(S.form.description||'')}</div>
    <div class="section-title">작성 정보</div>
    <div class="grid">
      <div class="field">
        <label>지역<span class="req">*</span></label>
        <select id="f_region" onchange="onRegionChange()">${regionOpts}</select>
      </div>
      <div class="field">
        <label>작성자</label>
        <input type="text" value="${esc(S.me.name)}" disabled>
      </div>
    </div>`;

  if(S.form.links_client) html += isGroupForm() ? memberPickerHTML() : clientPickerHTML();

  // 항목을 구획별로 묶어 렌더링
  // 여러 명 동시 입력 폼에서는 소속·상세부서·계급·연령대처럼 '그 사람마다 다른 값'은
  // 여기서 한 번만 입력받지 않습니다. 참여자마다 명부 값이 다를 수 있기 때문에,
  // 저장할 때 각자의 명부에서 따로 가져와 채웁니다 (personalOverridesFor 참고).
  const bySection = {};
  let personalSkipped = 0;
  for(const f of S.fields){
    if(isGroupForm() && isPersonalField(f)){ personalSkipped++; continue; }
    const k = f.section || '입력 항목';
    (bySection[k] = bySection[k] || []).push(f);
  }
  for(const [sec, list] of Object.entries(bySection)){
    if(!list.length) continue;
    html += `<div class="section-title">${esc(sec)}</div><div class="grid">`;
    html += list.map(f=>renderField(f, preRegion || S.regions[0]?.id)).join('');
    html += `</div>`;
  }
  if(personalSkipped){
    html += `<div class="msg info">소속·상세부서·계급·연령대는 참여자마다 다를 수 있어
      여기서 따로 받지 않습니다. 저장할 때 참여자 각자의 명부 값을 자동으로 씁니다.</div>`;
  }

  html += `<div class="actions">
      <button class="btn" id="saveBtn" onclick="saveRecord()">저장</button>
      <button class="btn ghost" onclick="renderForm()">초기화</button>
      <button class="btn ghost" onclick="togglePrefill()" style="margin-left:auto">
        미리 고르기 ${prefillOn()?'끄기':'켜기'}</button>
    </div>
    <div class="hint">${prefillOn()
      ? '자주 쓰시는 값과 기본값을 미리 골라 둡니다. 미리 고른 자리에는 딱지가 붙습니다. 위험도·문제유형처럼 판단이 들어가는 항목은 미리 고르지 않습니다.'
      : '미리 고르기가 꺼져 있습니다. 모든 항목을 직접 고릅니다.'}</div></div>`;
  c.innerHTML = html;
  watchPrefillEdits();
  applyPrefill();
  if(isGroupForm()){
    if(S.client){ S.members=[S.client]; S.client=null; }
    renderMemberArea();
    // 미리 들어와 있는 참여자(상세페이지에서 넘어온 경우)의 최근 기록도 찾아봅니다
    S.members.forEach(m=>loadRecentFillFor(m).then(renderMemberArea));
  }else if(S.client){
    renderClientArea();     // 상세페이지에서 넘어온 경우 미리 선택된 상태로
    applyAutoFill();
    prefillFromClient(S.client);
  }
}

// 항목 하나를 유형에 맞는 입력칸으로 변환
function renderField(f, regionId){
  const id = 'fld_'+f.field_key;
  const req = f.required ? '<span class="req">*</span>' : '';
  // 버튼으로 펼치는 항목은 옆으로 넓게 써야 한 줄에 여러 개가 들어갑니다.
  const chipsWide = f.field_type==='select'
    && chipListFor(f, regionId).length > 3;
  const wide = (['textarea','multiselect'].includes(f.field_type) || chipsWide) ? ' wide' : '';
  let input='';

  // 자동 계산 항목 (생년월일 → 연령대)
  if(f.auto_fill==='age_group'){
    return `<div class="field" data-key="${f.field_key}">
      <label for="${id}">${esc(f.label)}${req}</label>
      <input type="text" id="${id}" readonly placeholder="생년월일을 넣으면 자동으로 채워집니다"
        style="background:var(--line2)">
      <div class="hint">내담자를 고르면 만 나이로 계산해 자동으로 채웁니다</div></div>`;
  }

  switch(f.field_type){
    case 'textarea':
      input = `<textarea id="${id}"></textarea>`; break;
    case 'number':
      input = `<input type="number" id="${id}">`; break;
    case 'date':
      input = `<input type="date" id="${id}">`; break;
    case 'time':
      input = `<input type="time" id="${id}" onchange="recalcDuration()">`; break;
    case 'timerange':
      // 시작·종료를 골라 넣으면 소요시간이 자동으로 계산됩니다
      input = `<div class="timerange">
          <input type="time" id="${id}_start" onchange="recalcDuration()" step="300">
          <span class="tr-sep">→</span>
          <input type="time" id="${id}_end" onchange="recalcDuration()" step="300">
        </div>
        <div class="hint" id="${id}_out">시작과 종료를 고르면 소요시간이 자동으로 채워집니다</div>`;
      break;
    case 'checkbox':
      input = `<label style="font-weight:400"><input type="checkbox" id="${id}"> 예</label>`; break;
    case 'select': {
      // 마스터 표 연동이면 지역에 맞는 선택지를 실시간으로 만든다
      const dynamic = !!f.lookup_source;
      const list = dynamic ? lookupOptions(f.lookup_source, regionId) : (f.options||[]);
      const opts = list.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('');
      // 목록에 이미 '기타'류가 있으면 따로 붙이지 않습니다.
      // 그러지 않으면 '기타'와 '기타(직접 입력)'이 나란히 떠서 헷갈립니다.
      const other = needOther(f, list) ? `<option value="${OTHER}">${OTHER}</option>` : '';
      // 선택지가 적으면 드롭다운을 숨기고 버튼으로 펼칩니다 (CHIP_MAX 참고).
      const ch = chipsFor(id, list, !!other);
      input = `<select id="${id}" ${dynamic?`data-lookup="${f.lookup_source}"`:''}
          class="${ch.cls}" onchange="toggleOther('${id}')">
          <option value="">— 선택 —</option>${opts}${other}</select>
        ${ch.html}
        <input type="text" id="${id}_other" class="other-input hidden"
          placeholder="${esc(f.label)}을(를) 직접 입력">`;
      if(dynamic && !list.length){
        input += `<div class="hint" style="color:var(--warn)">
          이 지역의 ${esc(f.label)} 목록이 아직 없습니다. 관리 → 소속과 직급에서 추가하세요.</div>`;
      }
      break;
    }
    case 'multiselect': {
      // exclusive_options에 든 항목은 다른 것과 함께 고를 수 없습니다 (예: '1. 정상')
      const excl = new Set(f.exclusive_options||[]);
      const boxes = (f.options||[]).map(o=>
        `<label${excl.has(o)?' class="excl"':''}>
          <input type="checkbox" name="${id}" value="${esc(o)}"
            ${excl.has(o)?'data-exclusive="1"':''}
            onchange="onMultiPick('${id}', this)"> ${esc(o)}</label>`).join('');
      input = `<div class="checks" id="${id}">${boxes||'<span class="hint">선택지가 없습니다</span>'}</div>`
        + (excl.size ? `<div class="hint">'${esc([...excl][0])}'을(를) 고르면 나머지는 함께 고를 수 없습니다</div>` : '');
      break;
    }
    case 'file':
      // 사진·서명부를 여러 장 올립니다. 올린 것은 아래에 작은 그림으로 쌓입니다.
      {
        const cap = maxPxFor(f.label);
        const isSign = cap === SIGN_MAX_PX;
        input = `<input type="hidden" id="${id}">
        <div class="filebox" id="${id}_box"
          ondragover="event.preventDefault();this.classList.add('over')"
          ondragleave="this.classList.remove('over')"
          ondrop="event.preventDefault();this.classList.remove('over');pickFiles('${id}', event.dataTransfer.files, ${cap})"
          onclick="document.getElementById('${id}_in').click()">
          <b>${isSign?'서명부':'사진'}를 끌어다 놓거나 눌러서 고르세요</b>
          <span>여러 장을 한 번에 올릴 수 있습니다 · 올리면서 자동으로 용량을 줄입니다${
            isSign?' (서명부는 글씨가 뭉개지지 않게 더 크게 남깁니다)':''}</span>
        </div>
        <input type="file" id="${id}_in" class="hidden" accept="image/*" multiple
          onchange="pickFiles('${id}', this.files, ${cap}); this.value=''">
        <div class="thumbs" id="${id}_thumbs"></div>`;
      }
      break;
    default:
      input = `<input type="text" id="${id}">`;
  }
  return `<div class="field${wide}" data-key="${f.field_key}">
    <label for="${id}">${esc(f.label)}${req}</label>${input}</div>`;
}

/* 다중 선택에서 '정상' 같은 배타 항목 처리
   · 배타 항목을 고르면 나머지가 모두 풀리고 잠깁니다
   · 나머지를 고르면 배타 항목이 풀립니다 */
function onMultiPick(groupId, el){
  const boxes = [...document.querySelectorAll(`input[name="${groupId}"]`)];
  const isExcl = el.dataset.exclusive === '1';
  if(isExcl && el.checked){
    boxes.forEach(b=>{ if(b!==el) b.checked = false; });
  }else if(!isExcl && el.checked){
    boxes.forEach(b=>{ if(b.dataset.exclusive === '1') b.checked = false; });
  }
  syncExclusiveLock(groupId);
}
// 배타 항목이 켜져 있으면 나머지를 눌러도 반응하지 않게 흐리게 만듭니다
function syncExclusiveLock(groupId){
  const boxes = [...document.querySelectorAll(`input[name="${groupId}"]`)];
  const exclOn = boxes.some(b=>b.dataset.exclusive === '1' && b.checked);
  boxes.forEach(b=>{
    if(b.dataset.exclusive === '1') return;
    b.disabled = exclOn;
    b.closest('label')?.classList.toggle('locked', exclOn);
  });
}

/* 시작·종료 시각에서 소요시간(분)을 계산해 넣습니다.
   자정을 넘기면 다음 날로 봅니다(야간 상담 대비). */
function minutesOf(v){
  const m = String(v||'').match(/^(\d{1,2}):(\d{2})/);
  return m ? (+m[1])*60 + (+m[2]) : null;
}
function recalcDuration(){
  let a=null, b=null, outId=null;
  // 시작~종료가 한 항목으로 묶인 경우
  for(const f of (S.fields||[])){
    if(f.field_type!=='timerange') continue;
    const st=$('fld_'+f.field_key+'_start'), en=$('fld_'+f.field_key+'_end');
    if(!st||!en) continue;
    a=minutesOf(st.value); b=minutesOf(en.value); outId='fld_'+f.field_key+'_out';
    break;
  }
  // 시작·종료가 따로 있는 경우 (집단상담)
  if(a===null && b===null){
    const st=$('fld_time_start'), en=$('fld_time_end');
    if(st&&en){ a=minutesOf(st.value); b=minutesOf(en.value); }
  }
  if(a===null || b===null) return;
  let diff = b - a;
  if(diff < 0) diff += 24*60;          // 자정을 넘긴 경우
  const dur = $('fld_duration') || $('fld_duration_min');
  if(dur) dur.value = diff;
  const out = outId ? $(outId) : null;
  if(out) out.textContent = diff>0
    ? `소요시간 ${diff}분 (${Math.floor(diff/60)}시간 ${diff%60}분)`
    : '종료 시각이 시작보다 빠릅니다. 다시 확인해 주세요.';
}

// '기타(직접 입력)'을 고르면 옆에 텍스트칸이 열린다
function toggleOther(id){
  const sel=$(id); if(!sel) return;
  syncChips(id);   // 버튼으로 펼친 항목이면 눌린 자리를 먼저 맞춥니다
  const other=$(id+'_other');
  if(!other) return;              // '기타' 칸이 없는 항목도 있습니다
  const on = sel.value===OTHER;
  other.classList.toggle('hidden', !on);
  if(!on){ other.value=''; other.classList.remove('err'); }
}
// 값을 넣어 준 뒤 직접 입력칸까지 한 번에 맞춰 줍니다
function setSelectValue(id, v){
  const sel=$(id); if(!sel) return false;
  const opts=[...sel.options].map(o=>o.value);
  if(opts.includes(v)){ sel.value=v; toggleOther(id); return true; }
  if(opts.includes(OTHER)){
    sel.value=OTHER; toggleOther(id);
    const other=$(id+'_other'); if(other) other.value=v;
    return true;
  }
  return false;
}
// 셀렉트의 실제 값 (기타면 직접 입력값)
function selectValue(id){
  const sel=$(id); if(!sel) return null;
  if(sel.value===OTHER){
    const v=$(id+'_other')?.value.trim();
    return v || null;
  }
  return sel.value || null;
}

// 지역이 바뀌면 지역에 매인 드롭다운(상세소속 등)을 다시 만든다
function refreshLookupFields(){
  const regionId = $('f_region')?.value;
  document.querySelectorAll('select[data-lookup]').forEach(sel=>{
    const src = sel.dataset.lookup;
    const prev = sel.value;
    const list = lookupOptions(src, regionId);
    const withOther = !hasOwnOther(list);
    sel.innerHTML = '<option value="">— 선택 —</option>'
      + list.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')
      + (withOther ? `<option value="${OTHER}">${OTHER}</option>` : '');
    // 이전 값이 새 목록에도 있으면 유지
    if(prev && (list.includes(prev) || (withOther && prev===OTHER))) sel.value = prev;
    else { sel.value=''; }
    // 지역이 바뀌면 선택지 개수도 바뀝니다. 적으면 버튼, 많으면 드롭다운으로 돌아갑니다.
    const asChips = list.length > 0 && list.length <= CHIP_MAX;
    sel.classList.toggle('as-chips', asChips);
    const row = $(sel.id+'_chips');
    if(row && !asChips) row.innerHTML = '';
    toggleOther(sel.id);   // 직접 입력칸 상태를 선택값에 맞춰 정리 (+버튼줄 갱신)
  });
}

// 선택된 내담자에서 자동 계산 항목을 채운다
function applyAutoFill(){
  for(const f of S.fields){
    if(f.auto_fill!=='age_group') continue;
    const el = $('fld_'+f.field_key);
    if(!el) continue;
    const g = S.client?.birth_date ? ageGroupFromBirth(S.client.birth_date) : null;
    el.value = g || '';
  }
}

/* ═══════════════════════════════════════════════════
   미리 골라 두기

   같은 값을 매번 다시 고르는 수고를 덜기 위한 것입니다. 두 가지가 함께 돕니다.

     1) 기본값   — 관리자가 항목마다 '처음부터 골라 둘 값'을 정해 둡니다.
                  모두에게 똑같이 적용됩니다. (구 시모니의 checked 와 같습니다)
     2) 자주 쓰는 값 — 그 상담사가 최근에 쓴 자기 기록을 보고, 거의 늘 같은 값을
                  고르는 항목이면 그 값을 미리 골라 둡니다. 사람마다 다릅니다.

   반드시 지키는 선
     · 위험도·자살·문제유형처럼 임상 판단이 들어가는 항목은 절대 건드리지 않습니다.
       무심코 저장돼 기록이 틀어지면 되돌릴 수 없기 때문입니다.
     · 미리 고른 자리에는 '미리 고름' 딱지를 붙여, 눈에 띄게 해 둡니다.
     · 상담사가 원하면 통째로 끌 수 있습니다.
   ═══════════════════════════════════════════════════ */
const PREFILL_OFF_KEY = 'sb_prefill_off';
function prefillOn(){ return localStorage.getItem(PREFILL_OFF_KEY) !== '1'; }
function togglePrefill(){
  localStorage.setItem(PREFILL_OFF_KEY, prefillOn() ? '1' : '0');
  toast(prefillOn() ? '미리 고르기를 켰습니다' : '미리 고르기를 껐습니다');
  renderForm();
}
// 임상 판단이 들어가는 항목 — 여기 걸리면 어떤 경우에도 미리 고르지 않습니다.
const NO_PREFILL_WORDS = ['위험','자살','자해','문제유형','문제 유형','진단','소견',
  '판단','심각','응급','긴급','척도','점수','증상','호소','평가','조치','의뢰','종결'];
function isClinicalField(f){
  const t = `${f.label||''} ${f.field_key||''}`;
  return NO_PREFILL_WORDS.some(w=>t.includes(w))
      || /risk|suicid|problem|diagnos/i.test(f.field_key||'');
}
// 미리 골라도 되는 항목인가
function mayPrefill(f){
  if(isClinicalField(f)) return false;
  if(isGroupForm() && isPersonalField(f)) return false;   // 화면에 칸이 없습니다
  if(f.auto_fill) return false;                           // 자동 계산 항목
  return ['select','multiselect','checkbox'].includes(f.field_type);
}
// '미리 고름' 딱지
function markPrefill(f, why){
  const box = $('fld_'+f.field_key)?.closest('.field');
  if(!box || box.querySelector('.prefill-note')) return;
  const tag = document.createElement('div');
  tag.className = 'prefill-note';
  tag.textContent = why;
  box.appendChild(tag);
}
function clearPrefillNote(id){
  $(id)?.closest('.field')?.querySelector('.prefill-note')?.remove();
}
// 손으로 고른 순간 딱지를 떼기 위해, 항목 칸 전체에 한 번만 귀를 답니다.
let _prefillWatchOn = false;
function watchPrefillEdits(){
  if(_prefillWatchOn) return;          // 폼을 다시 그릴 때마다 겹쳐 달리지 않게 한 번만
  _prefillWatchOn = true;
  document.addEventListener('change', e=>{
    e.target?.closest?.('.field')?.querySelector('.prefill-note')?.remove();
  });
}

async function applyPrefill(){
  if(!prefillOn()) return;

  // ── 1) 관리자가 정해 둔 기본값
  for(const f of S.fields){
    if(!mayPrefill(f) || !f.default_value) continue;
    if(readFieldValue(f)) continue;             // 이미 채워져 있으면 두고 봅니다
    // 예/아니오 항목은 «예»일 때만 손댑니다. '아니오'는 원래 상태라 표시할 것이 없습니다.
    if(f.field_type==='checkbox'
       && !['예','y','true','1'].includes(String(f.default_value).trim().toLowerCase())) continue;
    const v = f.field_type==='multiselect'
      ? String(f.default_value).split(',').map(s=>s.trim()).filter(Boolean)
      : f.field_type==='checkbox' ? true
      : f.default_value;
    setFieldValue(f, v);
    markPrefill(f, '기본값');
  }

  // ── 2) 그 상담사가 자주 쓰는 값
  //     select 항목만 봅니다. 여러 개 고르는 항목은 조합이 매번 달라서
  //     '자주 쓴다'고 말하기 어렵습니다.
  const cand = S.fields.filter(f => mayPrefill(f) && f.field_type==='select'
                                 && !f.lookup_source);
  if(!cand.length || !S.me?.id) return;

  const formId = S.form.id;
  const { data: recs } = await sb.from('form_records')
    .select('data')
    .eq('form_id', formId).eq('author_id', S.me.id)
    .order('created_at', { ascending:false }).limit(30);
  // 기다리는 동안 다른 폼으로 옮겨 갔으면 손대지 않습니다
  if(S.form?.id !== formId) return;
  if(!recs || recs.length < 5) return;          // 표본이 적으면 아직 판단하지 않습니다

  for(const f of cand){
    if(readFieldValue(f)) continue;             // 그새 채워졌으면 그대로 둡니다
    const vals = recs.map(r => r.data?.[f.field_key])
                     .filter(v => typeof v === 'string' && v);
    if(vals.length < 5) continue;
    const cnt = {};
    vals.forEach(v => cnt[v] = (cnt[v]||0)+1);
    const [top, n] = Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    // 최근 기록의 3/4 이상에서 같은 값을 골랐을 때만 미리 고릅니다.
    if(n / vals.length < 0.75) continue;
    if(!setSelectValue('fld_'+f.field_key, top)) continue;
    markPrefill(f, `자주 쓰시는 값 (최근 ${vals.length}건 중 ${n}건)`);
  }
}

/* ── 집단상담: 참여자 여러 명 고르기 ──
   저장하면 참여자 수만큼 기록이 생기고 같은 group_id로 묶입니다.
   그래야 각자의 상세페이지에도 이 프로그램 참여 이력이 남습니다. */
function isGroupForm(){ return !!(S.form?.allow_group && S.form?.links_client); }

function memberPickerHTML(){
  return `<div class="section-title">참여자</div>
  <div id="memberArea"></div>`;
}
function renderMemberArea(){
  const area = $('memberArea');
  if(!area) return;
  // 참여자마다 다른 값(소속·계급·직무·연령대 등)은 항상 여기서 보여 주고 그 자리에서
  // 확인·수정할 수 있게 합니다. 명부에서 바로 가져온 값도 눈으로 확인할 수 있도록 보여 주되,
  // 명부값은 믿을 만하므로 옅은 색으로, 명부에 없거나 최근 기록에서 짐작한 값은 눈에 띄는 색으로 표시합니다.
  const noPersonalFields = (S.fields||[]).every(f=>!isPersonalField(f));
  const tierStyle = { missing:'var(--warn)', recent:'var(--accent)', roster:'var(--sub)', override:'var(--accent-dark)' };
  const tierLabel = s => s.tier==='missing' ? `명부에 ${esc(s.f.label)} 없음 →`
    : s.tier==='recent' ? `${esc(s.f.label)} '${esc(s.value)}' (최근 기록에서 가져옴, 다르면 바꾸세요) →`
    : s.tier==='override' ? `${esc(s.f.label)} '${esc(s.value)}' (직접 입력함) →`
    : `${esc(s.f.label)} '${esc(s.value)}' (명부값, 다르면 바꾸세요) →`;
  const list = S.members.length
    ? `<div class="member-list">${S.members.map((m,i)=>{
        const statuses = personalFieldStatus(m);
        return `<div class="member">
          <b>${esc(m.name)}</b>
          <span>${esc(m.birth_date||'생년월일 없음')} · ${esc(m.gender||'')}
            ${m.extra?.rank?' · '+esc(m.extra.rank):''}</span>
          <button class="btn ghost" onclick="removeMember(${i})">빼기</button>
          ${statuses.length?`<div style="flex-basis:100%;display:flex;gap:12px;flex-wrap:wrap;margin-top:2px">
            ${statuses.map(s=>`<label style="display:flex;align-items:center;gap:6px;
                font-size:13px;color:${tierStyle[s.tier]};font-weight:400">
              ${tierLabel(s)}
              ${memberOverrideInputHTML(i, s.f, m, s.value)}</label>`).join('')}
          </div>`:''}
        </div>`;}).join('')}</div>`
    : `<div class="empty" style="padding:20px">아직 참여자가 없습니다.
        이름으로 찾아 한 명씩 더해 주세요.</div>`;
  const noFieldHint = noPersonalFields
    ? `<div class="hint" style="margin:6px 0 0">이 폼에는 참여자마다 다르게 입력할 항목(소속·계급·직무 등)이
        설정돼 있지 않습니다. 필요하면 관리 → 폼과 항목에서 이 폼에 항목을 추가해 주세요.</div>` : '';

  area.innerHTML = `<div class="client-box">
    <div class="client-row">
      <div class="field"><label>이름으로 찾아 더하기</label>
        <input type="text" id="mSearch" placeholder="이름 입력 후 Enter"
          onkeydown="if(event.key==='Enter'){event.preventDefault();searchMember()}"></div>
      <button class="btn ghost" onclick="searchMember()">찾기</button>
      ${canManage()?`<button class="btn ghost" onclick="toggleNewClient()">새 내담자 등록</button>`:''}
    </div>
    <div id="mResults"></div>
    <div id="cNew" class="hidden"></div>
    <div style="margin-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <b>참여자 ${S.members.length}명</b>
      ${S.members.length?`<button class="btn ghost" onclick="clearMembers()">모두 지우기</button>`:''}
      <span class="hint" style="margin:0">저장하면 참여자마다 기록이 하나씩 만들어집니다</span>
    </div>
    ${noFieldHint}
    ${list}</div>`;

  // 참여 인원 칸이 있으면 자동으로 맞춰 줍니다
  const cnt = $('fld_attendee_count');
  if(cnt && S.members.length) cnt.value = S.members.length;
}
async function searchMember(){
  const q = $('mSearch').value.trim();
  const box = $('mResults');
  if(!q){ box.innerHTML=''; return; }
  const region = $('f_region').value;
  const { data, error } = await sb.from('clients').select('*')
    .eq('region_id', region).ilike('name', `%${q}%`)
    .in('status', ['재직','휴직']).limit(30);
  if(error){ box.innerHTML=`<div class="msg bad">${esc(error.message)}</div>`; return; }
  const already = new Set(S.members.map(m=>m.id));
  const rows = (data||[]).filter(c=>!already.has(c.id));
  if(!rows.length){
    box.innerHTML = `<div class="hint" style="margin-top:10px">
      ${(data||[]).length ? '찾은 사람은 이미 참여자에 있습니다.'
        : `'${esc(q)}' 이름의 내담자가 이 지역에 없습니다.`}</div>`;
    return;
  }
  box.innerHTML = '<div class="results">' + rows.map(c=>
    `<div onclick='addMember(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
      <b>${esc(c.name)}</b> · ${esc(c.birth_date||'')} · ${esc(c.gender||'')}
      · ID ${esc(c.internal_id||'')}
    </div>`).join('') + '</div>';
}
function addMember(c){
  if(S.members.some(m=>m.id===c.id)) return;
  S.members.push(c);
  renderMemberArea();
  toast(`${c.name} 님을 참여자에 더했습니다`);
  // 명부에 없는 항목을 이 사람의 최근 상담 기록에서 찾아봅니다. 찾아지면 다시 그립니다.
  loadRecentFillFor(c).then(renderMemberArea);
}
function removeMember(i){ S.members.splice(i,1); renderMemberArea(); }
// 참여자 명부에 소속·계급 등이 비어 있을 때, 그 자리에서 직접 채워 넣은 값.
// (명부 자체를 고치는 게 아니라 이번 기록에만 씁니다.)
function setMemberOverride(i, key, value){
  const m = S.members[i];
  if(!m) return;
  m._overrides = m._overrides || {};
  const v = String(value||'').trim();
  if(v) m._overrides[key] = v; else delete m._overrides[key];
  renderMemberArea();
}
// 참여자의 명부에 없는 항목을 채우는 입력칸. 그 항목이 원래 드롭다운(select)이면
// 여기서도 같은 선택지를 보여 줍니다(직무처럼 이미 정해진 목록이 있는 경우).
// 목록에 없는 값은 다른 폼과 마찬가지로 '기타(직접 입력)'로 고르면 옆에 글자 입력칸이 열립니다.
// 연령대는 폼마다 field_type을 'select'로 안 만들어 뒀을 수도 있지만, 값 자체는
// 생년월일에서 자동으로 계산되는 고정된 목록이므로 항상 이 목록으로 드롭다운을 보여줍니다.
const AGE_GROUPS = ['20대','30대','40대','50대','60대 이상'];
function memberOverrideInputHTML(i, f, m, defaultValue){
  const domId = `mov_${i}_${f.field_key}`;
  const current = m._overrides?.[f.field_key] || defaultValue || '';
  const isAgeGroup = f.auto_fill === 'age_group';
  if(f.field_type !== 'select' && !isAgeGroup){
    return `<input type="text" style="width:130px;padding:5px 7px;font-size:13px"
      placeholder="${esc(f.label)} 직접 입력" value="${esc(current)}"
      onchange="setMemberOverride(${i},'${f.field_key}',this.value)">`;
  }
  const regionId = m.region_id || $('f_region')?.value;
  const dynamic = !!f.lookup_source;
  const list = isAgeGroup ? AGE_GROUPS : (dynamic ? lookupOptions(f.lookup_source, regionId) : (f.options||[]));
  const isOther = current && !list.includes(current);
  const opts = list.map(o=>`<option value="${esc(o)}" ${o===current?'selected':''}>${esc(o)}</option>`).join('');
  const other = needOther(f, list) ? `<option value="${OTHER}" ${isOther?'selected':''}>${OTHER}</option>` : '';
  return `<select id="${domId}" style="width:150px;padding:5px 7px;font-size:13px"
      onchange="onMemberOverrideSelect(${i},'${f.field_key}',this)">
      <option value="">— 선택 —</option>${opts}${other}</select>
    <input type="text" id="${domId}_other" style="width:120px;padding:5px 7px;font-size:13px"
      class="${isOther?'':'hidden'}" placeholder="${esc(f.label)} 직접 입력"
      value="${isOther?esc(current):''}"
      onchange="setMemberOverride(${i},'${f.field_key}',this.value)">`;
}
// 드롭다운에서 '기타(직접 입력)'을 고르면 옆 글자칸만 열어 두고, 아직 저장(재렌더)하지
// 않습니다. 재렌더를 하면 방금 연 글자칸이 다시 닫혀 버리기 때문입니다.
function onMemberOverrideSelect(i, key, sel){
  const other = $(sel.id+'_other');
  if(sel.value === OTHER){
    other?.classList.remove('hidden');
    other?.focus();
  }else{
    if(other){ other.classList.add('hidden'); other.value=''; }
    setMemberOverride(i, key, sel.value);
  }
}
function clearMembers(){
  if(!confirm('참여자를 모두 지웁니다. 계속할까요?')) return;
  S.members=[]; renderMemberArea();
}

function onRegionChange(){
  S.client = null;
  S.members = [];
  const area = $('clientArea');
  if(area) renderClientArea();
  if($('memberArea')) renderMemberArea();
  refreshLookupFields();   // 상세소속처럼 지역에 매인 목록을 다시 만든다
  applyAutoFill();
}
function renderClientArea(){
  const area=$('clientArea'); if(!area) return;
  if(S.client){
    const c = S.client;
    const age = ageFromBirth(c.birth_date);
    area.innerHTML = `<div class="picked-box">
      <div class="picked-top">
        <b>${esc(c.name)}</b>
        <span class="chip">${esc(c.gender||'성별 미상')}</span>
        ${c.status && c.status!=='재직'
          ? `<span class="chip ${['전출','퇴직'].includes(c.status)?'risk':''}">${esc(c.status)}</span>`:''}
        <span style="flex:1"></span>
        <button class="btn ghost" onclick="unpickClient()">다시 선택</button>
      </div>
      <div class="picked-grid">
        <div><span>생년월일</span><b>${esc(c.birth_date||'없음')}${
          age!==null?` (만 ${age}세)`:''}</b></div>
        <div><span>개인식별아이디</span><b>${esc(c.personal_id||c.internal_id||'없음')}</b></div>
        <div><span>디지털 식별번호</span><b>${esc(c.digital_id||'없음')}</b></div>
        <div><span>사번</span><b>${esc(c.employee_no||'없음')}</b></div>
        <div><span>소속 / 직급</span><b>${esc([c.extra?.department,c.extra?.rank]
          .filter(Boolean).join(' / ')||'없음')}</b></div>
      </div>
      ${c.birth_date ? '' : `<div class="msg bad" style="margin-top:10px">
        이 내담자는 생년월일이 없습니다. 검사 결과 연결이 되지 않으니
        관리자에게 명부 보완을 요청하세요.</div>`}
    </div>`;
  }else{
    area.outerHTML = clientPickerHTML();
  }
}
async function searchClient(){
  const q = $('cSearch').value.trim();
  const box = $('cResults');
  if(!q){ box.innerHTML=''; return; }
  const region = $('f_region').value;
  // 전출·퇴직자는 새 기록 작성 대상에서 빼 준다 (과거 이력 조회는 상세페이지에서 가능)
  const { data, error } = await sb.from('clients').select('*')
    .eq('region_id', region).ilike('name', `%${q}%`)
    .in('status', ['재직','휴직']).limit(30);
  if(error){ box.innerHTML=`<div class="msg bad">${esc(error.message)}</div>`; return; }
  if(!data.length){
    box.innerHTML = `<div class="hint" style="margin-top:10px">
      '${esc(q)}' 이름의 내담자가 이 지역에 없습니다.
      ${canManage() ? '새로 등록하거나 지역을 확인해 보세요.'
                    : '명부에 없는 사람입니다. 관리자에게 등록을 요청하세요.'}</div>`;
    return;
  }
  box.innerHTML = '<div class="results">' + data.map(c=>
    `<div onclick='pickClient(${JSON.stringify(c).replace(/'/g,"&#39;")})'>
      <b>${esc(c.name)}</b> · ${esc(c.birth_date)} · ${esc(c.gender)} · ID ${esc(c.internal_id)}
    </div>`).join('') + '</div>';
}
function unpickClient(){
  S.client = null;
  renderClientArea();
  applyAutoFill();
}
function pickClient(c){
  S.client = c;
  renderClientArea();
  applyAutoFill();          // 생년월일 → 연령대 자동 채움
  prefillFromClient(c);     // 명부의 소속·직급을 폼에도 옮겨 적는다
}
/* 명부에 있는 값을 폼의 같은 뜻 항목에 미리 채워 준다.
   상담사가 매번 같은 걸 다시 고르지 않도록 하되, 언제든 고칠 수 있게 입력칸에 값만 넣는다.
   폼마다 항목 이름이 달라도 아래 대응표로 찾아간다. */
const CLIENT_FILL = {
  // 폼 항목 키   ← 명부(clients.extra)의 어떤 값을 가져올지
  station:    ['department', 'station'],          // 소속 소방서
  dept:       ['team', 'dept', 'department'],     // 상세 부서·팀
  department: ['team', 'department'],             // (구 항목 이름 대비)
  rank:       ['rank'],                           // 계급
  client_rank:['rank'],
  job:        ['duty', 'job'],                    // 직무
  duty:       ['duty', 'job'],
};
// 이 항목은 '그 사람마다 다른 값'인가? (명부에서 가져오는 소속·계급류이거나, 생년월일에서
// 계산하는 연령대) 여러 명 동시 입력 폼에서는 한 번에 하나로 받지 않고 참여자마다 따로 채웁니다.
function isPersonalField(f){
  return !!CLIENT_FILL[f.field_key] || f.auto_fill==='age_group';
}
// 다른 폼에서는 같은 뜻의 항목이 이름이 다를 수 있습니다 (예: 이 폼은 'job', 저 폼은 'duty').
// 과거 상담 기록에서 값을 찾을 때는 이 동의어들도 함께 찾아봅니다.
const FIELD_SYNONYMS = {
  station:['station','department'], dept:['dept','team','department'],
  department:['department','team'], rank:['rank','client_rank'],
  client_rank:['rank','client_rank'], job:['job','duty'], duty:['duty','job'],
};
// 참여자(m)의 최근 상담 기록 몇 건을 미리 찾아 캐시해 둡니다. 명부에 소속·계급·직무가
// 비어 있을 때, 이 사람의 가장 최근 기록에 적혀 있던 값을 그다음 순위로 참고하기 위해서입니다.
// (명부 값이 더 믿을 만하므로 명부보다 낮은 우선순위로만 씁니다.)
async function loadRecentFillFor(m){
  if(!m || m._recentFill) return;              // 이미 조회했으면 다시 조회하지 않습니다
  m._recentFill = {};
  const { data: past, error } = await sb.from('form_records')
    .select('data,created_at').eq('client_id', m.id)
    .order('created_at',{ascending:false}).limit(15);
  if(error || !past?.length) return;
  for(const f of (S.fields||[])){
    const syn = FIELD_SYNONYMS[f.field_key];
    if(!syn) continue;
    for(const rec of past){
      let v=null;
      for(const key of syn){ const got=rec.data?.[key]; if(got){ v=got; break; } }
      if(v){ m._recentFill[f.field_key]=v; break; }
    }
  }
}
// 참여자 한 명(m)의 개인별 항목마다 어떤 값을 쓸지, 그리고 어디서 온 값인지 함께 돌려준다.
// 우선순위: 이 자리에서 직접 고른 값 > 명부 값 > 최근 상담 기록에서 찾은 값 > 없음.
// tier가 'roster'가 아닌 것(즉 'recent'·'missing')은 명부만큼 믿을 수 없으므로
// 참여자 목록 화면에서 확인·수정할 수 있게 보여 줍니다.
function personalFieldStatus(m){
  const out = [];
  for(const f of (S.fields||[])){
    if(!isPersonalField(f)) continue;
    if(m._overrides && m._overrides[f.field_key]){
      out.push({ f, value:m._overrides[f.field_key], tier:'override' }); continue;
    }
    if(f.auto_fill==='age_group'){
      const ag = ageGroupFromBirth(m.birth_date);
      out.push(ag ? { f, value:ag, tier:'roster' } : { f, value:null, tier:'missing' });
      continue;
    }
    const sources = CLIENT_FILL[f.field_key];
    let v = null;
    if(sources) for(const key of sources){ const got=m.extra?.[key]; if(got){ v=got; break; } }
    if(v){ out.push({ f, value:v, tier:'roster' }); continue; }
    const rv = m._recentFill?.[f.field_key];
    out.push(rv ? { f, value:rv, tier:'recent' } : { f, value:null, tier:'missing' });
  }
  return out;
}
// 참여자 한 명(m)의 개인별 항목 값만 뽑아 저장용 데이터로 만든다.
function personalOverridesFor(m){
  const out = {};
  personalFieldStatus(m).forEach(s => { if(s.value) out[s.f.field_key] = s.value; });
  return out;
}
function prefillFromClient(c){
  if(!c) return;
  let filled = 0;
  for(const f of (S.fields||[])){
    const sources = CLIENT_FILL[f.field_key];
    if(!sources) continue;
    let v = null;
    for(const key of sources){
      const got = c.extra?.[key];
      if(got){ v = got; break; }
    }
    if(!v) continue;

    const el = $('fld_'+f.field_key);
    if(!el) continue;

    if(el.tagName === 'SELECT'){
      const opts = [...el.options].map(o=>o.value);
      // 표기가 조금 달라도 찾아 준다 ('진주소방서' → 목록의 '진주')
      const loose = opts.find(o => o && o!==OTHER &&
        (o===v || v.includes(o) || o.includes(v)));
      if(!setSelectValue('fld_'+f.field_key, loose || v)) continue;
    }else{
      el.value = v;
    }
    el.classList.add('prefilled');
    filled++;
  }
  if(filled) showPrefillNote(filled);
}
// 자동으로 채웠다는 것을 알려 준다. 모르고 넘어가면 틀린 값이 그대로 저장된다.
function showPrefillNote(n){
  const area = $('clientArea') || $('memberArea');
  if(!area) return;
  let note = document.getElementById('prefillNote');
  if(!note){
    note = document.createElement('div');
    note.id = 'prefillNote';
    note.className = 'msg info';
    note.style.marginTop = '10px';
    area.appendChild(note);
  }
  note.innerHTML = `명부에 있던 정보 ${n}가지를 아래 칸에 자동으로 채웠습니다.
    <b>다르면 그 자리에서 고치시면 됩니다.</b>`;
}

async function toggleNewClient(){
  if(!canManage()){ toast('내담자 등록은 관리자만 할 수 있습니다','bad'); return; }
  const box = $('cNew');

        <input type="text" id="nc_did"></div>

        <input type="text" id="nc_empno">
