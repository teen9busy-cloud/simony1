async function createClient(){
  if(!canManage()){ toast('내담자 등록은 관리자만 할 수 있습니다','bad'); return; }
  const region = $('f_region').value;
  document.querySelectorAll('#cNew .err').forEach(e=>e.classList.remove('err'));

  const name = $('nc_name').value.trim();
  const birth = normalizeBirth($('nc_birth').value);
  const gender = $('nc_gender').value;
  const iid = $('nc_iid').value.trim();

  const missing = [];
  let firstEl = null;
  const need = (cond, label, el)=>{
    if(cond) return;
    missing.push(label);
    if(el){ el.classList.add('err'); if(!firstEl) firstEl = el; }
  };
  need(!!name, '이름', $('nc_name'));
  need(!!birth, '생년월일', $('nc_birth'));
  need(!!gender, '성별', $('nc_gender'));
  const did = $('nc_did').value.trim();
  const emp = $('nc_empno').value.trim();
  need(!!(iid || did || emp), '식별번호(개인식별아이디·디지털·사번 중 하나)', $('nc_iid'));

  // 지역별 필수 항목 (상세소속·직급 등)
  const extra = {};
  for(const d of S.clientDefs){
    const el=$('nc_'+d.field_key);
    if(!el) continue;
    const v = d.lookup_source ? selectValue('nc_'+d.field_key) : (el.value.trim?.() || el.value || null);
    if(v) extra[d.field_key]=v;
    need(!d.required || !!v, d.label, el);
  }

  if(missing.length){
    toast('필수 항목을 채우세요: '+missing.slice(0,3).join(', ')+(missing.length>3?' 외':''),'bad');
    focusMissing(firstEl);
    return;
  }
  if(!$('nc_birth').value.replace(/[^0-9]/g,'').length){
    toast('생년월일을 숫자 8자리로 입력하세요','bad'); return;
  }

  const row = {
    region_id: region, name, birth_date: birth, gender,
    internal_id: iid || did || emp,
    personal_id: iid || null,
    digital_id: did || null,
    employee_no: emp || null,
    status: '재직', extra,
  };
  const { data, error } = await sb.from('clients').insert(row).select().single();
  if(error){
    toast(error.code==='23505' ? '이미 등록된 개인식별아이디입니다'
                               : '등록하지 못했습니다: '+error.message, 'bad');
    return;
  }
  toast('내담자를 등록했습니다');
  if(isGroupForm()){ $('cNew').classList.add('hidden'); addMember(data); }
  else pickClient(data);
}

/* ── 저장 ── */
/* 시각을 잘못 골라 소요시간이 터무니없이 길어지는 일을 막습니다.
   오전 2시를 오후 2시로 고르는 실수가 현장에서 흔합니다. */
const DURATION_WARN = 480;    // 8시간
function checkDuration(data){
  const mins = Number(data.duration ?? data.duration_min);
  if(!Number.isFinite(mins)) return null;
  if(mins <= 0){
    return '소요시간이 0분 이하입니다. 시작과 종료 시각을 다시 확인해 주세요.\n'
         + '이대로 저장할까요?';
  }
  if(mins > DURATION_WARN){
    const h = Math.floor(mins/60), m = mins%60;
    return `소요시간이 ${h}시간 ${m}분으로 계산되었습니다.\n`
         + '오전과 오후를 잘못 고르지 않았는지 확인해 주세요.\n\n'
         + '확인했고 이대로 저장할까요?';
  }
  return null;
}
// 누락된 첫 항목으로 화면을 옮겨 준다. 어디가 비었는지 찾아 헤매지 않도록.
function focusMissing(firstEl){
  if(!firstEl) return;
  const box = firstEl.closest('.field') || firstEl;
  box.scrollIntoView?.({ behavior:'smooth', block:'center' });
  const focusable = box.querySelector('input,select,textarea');
  setTimeout(()=>focusable?.focus({ preventScroll:true }), 260);
}

// 화면에 그려진 입력칸 하나에서 지금 값을 읽어 온다. (id="fld_"+field_key 기준)
// 새 기록 저장과 기존 기록 수정, 둘 다 여기서 값을 읽습니다.
/* ═══════════════════════════════════════════════════
   사진·서명부 올리기

   원본 사진은 한 장에 3~8MB씩 되는데 보고서에 넣을 때는 그만한 화질이 필요
   없습니다. 그래서 올리기 전에 브라우저에서 긴 변 1600px으로 줄이고 JPEG로
   다시 저장합니다. 눈으로는 차이를 못 느끼면서 용량은 보통 10분의 1 아래로
   떨어집니다. (구버전은 1200px·품질 70%였는데, 서명부 글씨가 뭉개진다는 점을
   감안해 조금 키웠습니다.)

   저장은 '어디에 넣었는지'(path)만 기록에 남기고, 볼 때마다 서버에서 잠깐
   쓸 수 있는 주소를 받아 옵니다. 사진에 얼굴과 서명이 들어 있기 때문입니다.
   ═══════════════════════════════════════════════════ */
const PHOTO_MAX_PX = 1600;      // 긴 변 기준 (현장 사진)
const SIGN_MAX_PX  = 2200;      // 서명부는 글씨와 서명이 뭉개지면 안 되므로 더 크게
const PHOTO_QUALITY = 0.82;
// 항목 이름에 '서명'이 들어가면 서명부로 보고 해상도를 더 줍니다.
function maxPxFor(label){ return /서명/.test(String(label||'')) ? SIGN_MAX_PX : PHOTO_MAX_PX; }

// 사진 한 장을 줄여서 다시 저장합니다. 사진이 아니면 원본 그대로 둡니다.
function shrinkImage(file, maxPx){
  const cap = maxPx || PHOTO_MAX_PX;
  return new Promise(resolve=>{
    if(!file.type.startsWith('image/')) return resolve(file);
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let { width:w, height:h } = img;
      const scale = Math.min(1, cap / Math.max(w, h));
      if(scale === 1 && file.size < 700*1024) return resolve(file);  // 이미 작으면 그대로
      w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      const ctx = cv.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, w, h);
      cv.toBlob(blob=>{
        if(!blob || blob.size >= file.size) return resolve(file);   // 더 커지면 원본
        const name = file.name.replace(/\.[^.]+$/, '') + '.jpg';
        resolve(new File([blob], name, { type:'image/jpeg' }));
      }, 'image/jpeg', PHOTO_QUALITY);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

// 지금까지 고른 사진 목록을 숨은 칸에 담아 둡니다 (기록을 저장할 때 함께 들어갑니다).
function filesOf(id){
  try{ return JSON.parse($(id)?.value || '[]'); }catch(e){ return []; }
}
function setFilesOf(id, list){
  const el = $(id); if(el) el.value = JSON.stringify(list);
  drawThumbs(id);
}
function drawThumbs(id){
  const box = $(id+'_thumbs'); if(!box) return;
  const list = filesOf(id);
  box.innerHTML = list.map((f,i)=>`
    <div class="thumb">
      ${f.url ? `<img src="${esc(f.url)}" alt="${esc(f.name||'')}"
                   onclick="window.open('${esc(f.url)}','_blank','noopener')">`
              : `<img alt="${esc(f.name||'')}">`}
      <button type="button" class="del" title="빼기"
        onclick="removeFile('${id}', ${i})">×</button>
      <div class="cap">${esc(f.name||'')}${f.kb?` · ${f.kb}KB`:''}</div>
    </div>`).join('');
}
async function pickFiles(id, fileList, maxPx){
  const files = [...(fileList||[])];
  if(!files.length) return;
  const box = $(id+'_box');
  const before = box ? box.innerHTML : '';
  if(box) box.innerHTML = `<b>올리는 중…</b><span>${files.length}장</span>`;
  try{
    const fd = new FormData();
    let saved = 0, orig = 0;
    for(const f of files){
      const small = await shrinkImage(f, maxPx);
      orig += f.size; saved += small.size;
      fd.append('files', small, small.name);
    }
    fd.append('kind', 'report');
    const res = await apiCall('/api/files/upload', { method:'POST', body:fd });
    const r = await res.json();
    const added = (r.files||[]).map(f=>({
      path:f.path, name:f.name, url:f.url, kb:Math.round(f.size/1024),
    }));
    setFilesOf(id, [...filesOf(id), ...added]);
    const pct = orig>0 ? Math.round((1-saved/orig)*100) : 0;
    toast(pct>0 ? `${added.length}장 올렸습니다 (용량 ${pct}% 줄임)`
                : `${added.length}장 올렸습니다`);
  }catch(e){
    toast('올리지 못했습니다: '+e.message, 'bad');
  }finally{
    if(box) box.innerHTML = before;
  }
}
async function removeFile(id, i){
  const list = filesOf(id);
  const f = list[i];
  if(!f) return;
  if(!confirm(`'${f.name||'이 사진'}'을 뺄까요?`)) return;
  list.splice(i,1);
  setFilesOf(id, list);
  // 스토리지에서도 지웁니다 (기록에 안 들어갈 파일을 남겨 두면 용량만 먹습니다)
  try{
    await apiCall('/api/files/delete', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ path:f.path }),
    });
  }catch(e){ /* 목록에서 뺐으면 충분합니다 */ }
}
// 저장된 사진들을 볼 수 있는 주소를 한 번에 받아 옵니다.
async function signFiles(list){
  const paths = list.map(f=>f.path).filter(Boolean);
  if(!paths.length) return list;
  try{
    const res = await apiCall('/api/files/urls', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ paths }),
    });
    const { urls } = await res.json();
    return list.map(f=>({ ...f, url: urls[f.path] || f.url || null }));
  }catch(e){ return list; }
}

function readFieldValue(f){
  const el = $('fld_'+f.field_key);
  if(f.field_type==='multiselect'){
    const v = [...document.querySelectorAll(`input[name="fld_${f.field_key}"]:checked`)].map(x=>x.value);
    return v.length ? v : null;
  }
  if(f.field_type==='checkbox') return el ? el.checked : null;
  if(f.field_type==='file'){
    // 볼 때 쓰는 임시 주소(url)는 곧 만료되므로 저장하지 않습니다.
    const list = filesOf('fld_'+f.field_key).map(({path,name,kb})=>({path,name,kb}));
    return list.length ? list : null;
  }
  if(f.field_type==='number') return (!el || el.value==='') ? null : Number(el.value);
  if(f.field_type==='select') return selectValue('fld_'+f.field_key);
  if(f.field_type==='timerange'){
    const st=$('fld_'+f.field_key+'_start')?.value;
    const en=$('fld_'+f.field_key+'_end')?.value;
    // 구버전과 같은 형태(1400-1500)로 저장해 통계·인쇄에서 그대로 씁니다
    return (st && en) ? st.replace(':','') + '-' + en.replace(':','') : null;
  }
  return el ? (el.value.trim() || null) : null;
}
// readFieldValue의 반대 — 저장돼 있던 값을 화면의 입력칸에 채워 넣는다. (기록 수정용)
function setFieldValue(f, v){
  if(v===null || v===undefined || v==='') return;
  const id = 'fld_'+f.field_key;
  if(f.field_type==='multiselect'){
    (Array.isArray(v)?v:[v]).forEach(val=>{
      document.querySelectorAll(`input[name="${id}"]`).forEach(cb=>{
        if(cb.value===String(val)){ cb.checked=true; syncExclusiveLock(id); }
      });
    });
    return;
  }
  if(f.field_type==='checkbox'){ const el=$(id); if(el) el.checked=!!v; return; }
  if(f.field_type==='file'){
    // 예전 기록은 주소 한 줄만 들어 있을 수 있어 그것도 받아 줍니다.
    const list = Array.isArray(v) ? v
      : (typeof v==='string' && v.trim() ? [{ path:null, name:v, url:v }] : []);
    const el=$(id); if(el) el.value = JSON.stringify(list);
    drawThumbs(id);
    signFiles(list).then(signed=>{
      const e2=$(id); if(!e2) return;
      e2.value = JSON.stringify(signed);
      drawThumbs(id);
    });
    return;
  }
  if(f.field_type==='timerange'){
    const m = String(v||'').match(/^(\d{2})(\d{2})-(\d{2})(\d{2})$/);
    if(m){
      const st=$(id+'_start'), en=$(id+'_end');
      if(st) st.value = m[1]+':'+m[2];
      if(en) en.value = m[3]+':'+m[4];
      recalcDuration();
    }
    return;
  }
  if(f.field_type==='select'){ setSelectValue(id, v); return; }
  const el=$(id); if(el) el.value = v;
}
// 이 기록을 지금 로그인한 사람이 고치거나 지울 수 있는가 — 작성한 본인이거나, 관리자.
function canEditRecord(r){
  return !!(S.me && r && (r.author_id===S.me.id || canManage()));
}
// 잘못 입력한 기록을 지운다. 되돌릴 수 없으므로 한 번 더 확인을 구합니다.
// (누가 언제 지웠는지는 form_records에 걸린 trg_audit_records가 그대로 기록에 남깁니다.)
async function deleteRecord(r){
  if(!canEditRecord(r)){ toast('이 기록을 지울 권한이 없습니다','bad'); return; }
  const who = r.client_name ? `'${r.client_name}' 님의 ` : '';
  if(!confirm(`${who}이 기록을 정말 삭제할까요? 되돌릴 수 없습니다.`)) return;
  const { error } = await sb.from('form_records').delete().eq('id', r.id);
  if(error){ toast('삭제하지 못했습니다: '+error.message, 'bad'); return; }
  toast('기록을 삭제했습니다');
  document.querySelectorAll('.overlay').forEach(o=>o.remove());
  if(S.tab) showTab(S.tab);
}
// 이미 저장된 기록 하나를 고친다. 원래 폼 그대로(항목 순서·선택지 포함)를 다시 그려
// 지금 값으로 채운 뒤, 저장하면 그 항목만 업데이트합니다. 내담자(참여자) 자체는 바꾸지
// 않습니다 — 사람을 잘못 골랐을 때는 이 기록을 지우고 새로 만들어야 합니다.
async function editRecordModal(r){
  const { data: fields } = await sb.from('form_fields').select('*')
    .eq('form_id', r.form_id).eq('is_active', true).order('sort_order');
  const editFields = fields || [];
  const bySection = {};
  for(const f of editFields){
    const k = f.section || '입력 항목';
    (bySection[k] = bySection[k] || []).push(f);
  }
  let body = '';
  for(const [sec, list] of Object.entries(bySection)){
    body += `<div class="section-title">${esc(sec)}</div><div class="grid">`
      + list.map(f=>renderField(f, r.region_id)).join('') + `</div>`;
  }
  const title = (S.forms.find(x=>x.id===r.form_id)||{}).title || '기록';
  modal(`${esc(title)} 수정`, body,
    async ()=>{
      const data = {};
      const missing = [];
      for(const f of editFields){
        const v = readFieldValue(f);
        if(f.required && (v===null || v==='')) missing.push(f.label);
        if(v!==null) data[f.field_key] = v;
      }
      if(missing.length){
        toast('채우지 않은 필수 항목이 있습니다: '+missing.slice(0,3).join(', '), 'bad');
        return false;
      }
      const { error } = await sb.from('form_records').update({ data }).eq('id', r.id);
      if(error){ toast('저장하지 못했습니다: '+error.message, 'bad'); return false; }
      toast('기록을 수정했습니다');
      if(S.tab) showTab(S.tab);   // 지금 보던 화면을 새 값으로 다시 불러옵니다
      return true;
    },
    ()=>{ for(const f of editFields) setFieldValue(f, r.data?.[f.field_key]); });
}

async function saveRecord(){
  const btn=$('saveBtn');
  document.querySelectorAll('.err').forEach(e=>e.classList.remove('err'));

  const data = {};
  const missing = [];
  let firstMissingEl = null;

  // 내담자(또는 참여자)를 안 골랐으면 그 영역부터
  if(S.form.links_client){
    if(isGroupForm()){
      if(!S.members.length){ missing.push('참여자'); firstMissingEl = $('memberArea'); }
    }else if(!S.client){
      missing.push('내담자'); firstMissingEl = $('clientArea');
    }
  }

  for(const f of S.fields){
    // 소속·계급 같은 개인별 항목은 여러 명 동시 입력 폼에서는 화면에 그리지 않았으므로
    // 여기서도 건너뜁니다. 저장 시 참여자마다 personalOverridesFor로 따로 채웁니다.
    if(isGroupForm() && isPersonalField(f)) continue;
    const el = $('fld_'+f.field_key);
    const v = readFieldValue(f);

    if(f.required && (v===null || v==='' )){
      missing.push(f.label);
      const target = el || $('fld_'+f.field_key+'_start') || $('fld_'+f.field_key);
      if(target){
        target.classList.add('err');
        if(!firstMissingEl) firstMissingEl = target;
      }
    }
    if(v!==null) data[f.field_key]=v;
  }

  if(missing.length){
    toast('채우지 않은 필수 항목이 '+missing.length+'개 있습니다: '
      + missing.slice(0,2).join(', ') + (missing.length>2?' 외':''), 'bad');
    focusMissing(firstMissingEl);
    return;
  }

  // 여러 명 동시 입력: 소속·계급 같은 개인별 항목은 화면에 공용 입력칸이 없고
  // 참여자마다 명부에서 자동으로 채웁니다. 명부에 값이 없으면 위 참여자 목록에서
  // 그 자리에 직접 채워 넣을 수 있게 해 뒀지만, 급한 상황(대형재난 등)에서는
  // 그것까지 다 채우지 못하고 일단 저장부터 해야 할 때가 있으므로 막지는 않고
  // 확인만 한 번 구합니다. (한 명 상담일 때는 이 항목이 여전히 필수면 그대로 막힙니다.)
  if(isGroupForm() && S.members.length){
    const reqPersonal = (S.fields||[]).filter(f=>isPersonalField(f) && f.required);
    if(reqPersonal.length){
      const bad = S.members
        .map(m => ({ name:m.name, gap: reqPersonal.filter(f=>!personalOverridesFor(m)[f.field_key]) }))
        .filter(x => x.gap.length);
      if(bad.length){
        const msg = `아래 참여자는 명부에 정보가 비어 있습니다 — `
          + bad.map(x=>`${x.name}(${x.gap.map(f=>f.label).join('·')} 없음)`).join(', ')
          + `.\n그래도 저장할까요? (해당 항목은 빈 채로 저장됩니다. 취소를 누르면 위에서 채울 수 있습니다)`;
        if(!confirm(msg)) return;
      }
    }
  }

  // 소요시간이 지나치게 길면 오전·오후를 잘못 고른 경우가 많습니다.
  const durCheck = checkDuration(data);
  if(durCheck && !confirm(durCheck)) return;

  const base = {
    form_id: S.form.id,
    region_id: $('f_region').value,
    data,
    author_id: S.me.id,
    author_name: S.me.name,
  };

  let rows;
  if(isGroupForm()){
    // 같은 group_id로 묶어 참여자마다 한 줄씩 남깁니다.
    // 소속·상세부서·계급·연령대는 공통으로 한 번 입력받은 게 아니라 참여자 각자의
    // 명부 값에서 따로 가져와 채웁니다 — 사람마다 다를 수 있기 때문입니다.
    const groupId = 'GRP_' + Date.now();
    rows = S.members.map(m => Object.assign({}, base, {
      data: Object.assign({}, data, personalOverridesFor(m)),
      group_id: groupId,
      client_id: m.id,
      client_name: m.name,
      birth_date: m.birth_date,
      gender: m.gender,
      client_internal_id: m.internal_id,
    }));
  }else{
    const one = Object.assign({}, base);
    if(S.form.links_client && S.client){
      one.client_id = S.client.id;
      one.client_name = S.client.name;
      one.birth_date = S.client.birth_date;
      one.gender = S.client.gender;
      one.client_internal_id = S.client.internal_id;
    }
    rows = [one];
  }

  btn.disabled=true; btn.textContent='저장 중…';
  const { error } = await sb.from('form_records').insert(rows);
  btn.disabled=false; btn.textContent='저장';
  if(error){ toast('저장하지 못했습니다: '+error.message,'bad'); return; }
  toast(rows.length>1
    ? `${S.form.title}을(를) 저장했습니다 (참여자 ${rows.length}명)`
    : `${S.form.title}을(를) 저장했습니다`);
  renderForm();
}

    html += `<div class="empty">아직 저장된 기록이 없습니다.<br>
      위쪽 '${esc(S.form.title)}' 탭에서 첫 기록을 남겨보세요.</div></div>`;
    c.innerHTML = html; return;
  }

  html += `<div class="rec-list">`;
  recs.forEach((r,i)=>{

              : esc(r.client_name||'이름 없음')}</span>`

        <span class="rec-sub">${fmtDate(r.created_at)} · ${esc(rname[r.region_id]||'')}
          · ${esc(r.author_name||'')}</span>
        ${r.group_id ? `<span class="chip">집단</span>` : ''}

  html += `</div></div>`;
  c.innerHTML = html;
  S._recs = recs;
  console.log('[시모니] 기록 목록', S.form.title, '→', recs.length, '건');

function cellText(v){
  if(v===null||v===undefined) return '';
  if(Array.isArray(v)) return v.join(', ');
  if(typeof v==='boolean') return v?'예':'아니오';
  const s=String(v);
  return s.length>28 ? s.slice(0,28)+'…' : s;
}

/* ── 표 공통: 보이는 항목 고르기 + CSV로 내려받기 ──
   '데이터 관리'(명부)와 '전체 기록' 표에서 함께 씁니다. 기본은 전부 표시이고,
   체크를 풀면 그 항목만 표에서 숨깁니다(브라우저를 새로고침하면 다시 전부 표시됩니다). */
function colPickerHTML(prefix, columns){
  const hidden = S['_'+prefix+'Hidden'] || [];
  return `<details class="col-picker">
    <summary class="btn ghost">표시 항목 ▾</summary>
    <div class="col-picker-box">
      ${columns.map(([k,label])=>`<label style="display:flex;align-items:center;gap:6px;padding:3px 0;font-weight:400">
        <input type="checkbox" ${hidden.includes(k)?'':'checked'}
          onchange="toggleCol('${prefix}','${k}',this.checked)"> ${esc(label)}</label>`).join('')}
    </div></details>`;
}
function toggleCol(prefix, key, checked){
  const skey = '_'+prefix+'Hidden';
  S[skey] = S[skey] || [];
  if(checked) S[skey] = S[skey].filter(k=>k!==key);
  else if(!S[skey].includes(key)) S[skey].push(key);
  if(prefix==='grid') renderGridTable();
  else if(prefix==='rec') renderRecordsTable();
}
function csvCell(v){
  const s = v===null||v===undefined ? '' : String(v);
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadCSV(filename, headers, rows){
  if(!rows.length){ toast('내려받을 내용이 없습니다','bad'); return; }
  const lines = [headers.map(csvCell).join(',')]
    .concat(rows.map(r=>r.map(csvCell).join(',')));
  // 맨 앞 BOM은 엑셀에서 한글이 깨지지 않게 하기 위한 표시입니다.
  const blob = new Blob(['﻿'+lines.join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(a.href);
}

];

let _gridDebounce = null;
function onGridFilterChange(){
  S._gridRegion = $('gridRegion').value;
  S._gridQ = $('gridQ').value.trim();
  S._gridShowLeft = $('gridShowLeft').checked;
  S._gridLimit = 500;   // 조건이 바뀌면 다시 처음 500명부터 봅니다
  clearTimeout(_gridDebounce);
  _gridDebounce = setTimeout(loadGridTable, 250);
}
// 지금 화면에 걸린 필터(지역·검색어·전출표시)를 그대로 적용한 쿼리를 만듭니다.
// 화면 표(제한 있음)와 엑셀 내려받기(제한 없음)가 이 함수를 같이 씁니다.
function buildGridQuery(){
  let q = sb.from('clients').select('*').order('name');
  if(S._gridRegion) q = q.eq('region_id', S._gridRegion);
  if(!S._gridShowLeft) q = q.in('status', ['재직','휴직']);
  if(S._gridQ){
    // or() 안에서는 %가 아니라 *를 와일드카드로 씁니다 (한글 검색이 깨지는 걸 막기 위해)
    const pat = S._gridQ.replace(/[*,()]/g, ' ').trim();
    q = q.or(`name.ilike.*${pat}*,internal_id.ilike.*${pat}*,personal_id.ilike.*${pat}*,`
      + `digital_id.ilike.*${pat}*,employee_no.ilike.*${pat}*`);
  }
  return q;
}
async function loadGridTable(){
  const box = $('gridTableBox');
  if(!box) return;
  S._gridLimit = S._gridLimit || 500;
  const { data, error } = await buildGridQuery().limit(S._gridLimit);
  if(error){ box.innerHTML = `<div class="msg bad">불러오지 못했습니다: ${esc(error.message)}</div>`; return; }
  S._gridData = data || [];
  renderGridTable();
}
function loadMoreGrid(){
  S._gridLimit = (S._gridLimit||500) + 500;
  loadGridTable();
}
function gridRowValues(c){
  const rname = {}; S.allRegions.forEach(r=>rname[r.id]=r.name);
  return {
    name:c.name, birth_date:c.birth_date||'', gender:c.gender||'',
    region:rname[c.region_id]||'', department:c.extra?.department||'', team:c.extra?.team||'',
    rank:c.extra?.rank||'',
    status:c.status||'재직', personal_id:c.personal_id||c.internal_id||'',
    digital_id:c.digital_id||'', employee_no:c.employee_no||'',
  };

/* ── 전체 기록: 모든 폼의 상담 기록을 한 표로 훑어보기 ──
   폼마다 항목이 다 달라서(스크리닝/심층상담/긴급심리지원 등) 항목 내용까지 표로 보여주진
   않고, 어떤 기록이 있는지 훑어본 뒤 행을 눌러 전체 내용을 보는 방식입니다. */
const REC_COLUMNS = [
  ['form','폼'], ['created_at','작성일'], ['client','내담자'],
  ['region','지역'], ['author','작성자'], ['group','집단'],
];
async function adminRecords(){
  const html = `<div class="panel">
    <h2>전체 기록 <span class="cnt" id="recCnt"></span></h2>
    <div class="desc">모든 폼의 상담 기록을 한 표로 훑어봅니다. 행을 누르면 전체 내용을 볼 수
      있습니다. 특정 폼 항목까지 표로 보려면 그 폼의 '기록 목록' 화면을 이용하세요.</div>
    <div class="client-row" style="margin-bottom:14px;align-items:flex-end">
      <div class="field" style="max-width:200px">
        <label>폼</label>
        <select id="recForm" onchange="onRecordsFilterChange()">
          <option value="">전체</option>
          ${S.forms.map(f=>`<option value="${f.id}" ${f.id===S._recForm?'selected':''}>${esc(f.title)}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="max-width:200px">
        <label>지역</label>
        <select id="recRegion" onchange="onRecordsFilterChange()">
          <option value="">전체(권한 있는 지역)</option>${regionOptionsHTML(S._recRegion, {plain:true})}</select>
      </div>
      <div class="field" style="max-width:150px">
        <label>시작일</label>
        <input type="date" id="recFrom" value="${esc(S._recFrom||'')}" onchange="onRecordsFilterChange()">
      </div>
      <div class="field" style="max-width:150px">
        <label>종료일</label>
        <input type="date" id="recTo" value="${esc(S._recTo||'')}" onchange="onRecordsFilterChange()">
      </div>
      <div class="field" style="flex:1">
        <label>내담자·작성자 이름으로 찾기</label>
        <input type="text" id="recQ" placeholder="비워두면 전체 표시"
          value="${esc(S._recQ||'')}" oninput="onRecordsFilterChange()">
      </div>
      <button class="btn ghost" onclick="exportRecordsCSV()">엑셀로 내려받기</button>
      ${colPickerHTML('rec', REC_COLUMNS)}
    </div>
    <div class="scroll-x"><div id="recTableBox" class="empty">불러오는 중…</div></div>
  </div>`;
  $('adminBody').innerHTML = html;
  await loadRecordsTable();
}
let _recDebounce = null;
function onRecordsFilterChange(){
  S._recForm = $('recForm').value;
  S._recRegion = $('recRegion').value;
  S._recFrom = $('recFrom').value;
  S._recTo = $('recTo').value;
  S._recQ = $('recQ').value.trim();
  S._recLimit = 500;   // 조건이 바뀌면 다시 처음 500건부터 봅니다
  clearTimeout(_recDebounce);
  _recDebounce = setTimeout(loadRecordsTable, 250);
}
// 지금 화면에 걸린 필터를 그대로 적용한 쿼리를 만듭니다.
// 화면 표(제한 있음)와 엑셀 내려받기(제한 없음)가 이 함수를 같이 씁니다.
function buildRecordsQuery(){
  let q = sb.from('form_records').select('*').order('created_at',{ascending:false});
  if(S._recForm) q = q.eq('form_id', S._recForm);
  if(S._recRegion) q = q.eq('region_id', S._recRegion);
  if(S._recFrom) q = q.gte('created_at', S._recFrom);
  if(S._recTo) q = q.lte('created_at', S._recTo+'T23:59:59');
  if(S._recQ){
    const pat = S._recQ.replace(/[*,()]/g, ' ').trim();
    q = q.or(`client_name.ilike.*${pat}*,author_name.ilike.*${pat}*`);
  }
  return q;
}
async function loadRecordsTable(){
  const box = $('recTableBox');
  if(!box) return;
  S._recLimit = S._recLimit || 500;
  const { data, error } = await buildRecordsQuery().limit(S._recLimit);
  if(error){ box.innerHTML = `<div class="msg bad">불러오지 못했습니다: ${esc(error.message)}</div>`; return; }
  S._recData = data || [];
  renderRecordsTable();
}
function loadMoreRecords(){
  S._recLimit = (S._recLimit||500) + 500;
  loadRecordsTable();
}
function recRowValues(r){
  const rname = {}; S.allRegions.forEach(x=>rname[x.id]=x.name);
  const fname = {}; S.forms.forEach(f=>fname[f.id]=f.title);
  return {
    form:fname[r.form_id]||'', created_at:fmtDate(r.created_at),
    client:r.client_name||'', region:rname[r.region_id]||'',
    author:r.author_name||'', group:r.group_id?'예':'',
  };
}
function renderRecordsTable(){
  const box = $('recTableBox');
  if(!box) return;
  const data = S._recData || [];
  const limit = S._recLimit || 500;
  const moreLeft = data.length === limit;
  const cnt = $('recCnt'); if(cnt) cnt.textContent = data.length.toLocaleString()+'건'
    + (moreLeft ? ` (${limit.toLocaleString()}건까지 표시 중)` : '');
  if(!data.length){ box.innerHTML = `<div class="empty">조건에 맞는 기록이 없습니다.</div>`; return; }
  const hidden = S._recHidden || [];
  const cols = REC_COLUMNS.filter(([k])=>!hidden.includes(k));
  S._recRows = data;   // openRecordDetailByIndex에서 씁니다
  box.innerHTML = `<table class="grid-table"><thead><tr>
      ${cols.map(([,label])=>`<th>${esc(label)}</th>`).join('')}
    </tr></thead><tbody>${data.map((r,i)=>{
      const v = recRowValues(r);
      return `<tr onclick="openRecordDetailByIndex(${i})">${cols.map(([k],j)=>
        `<td${j===0?' class="g-first"':''}>${esc(v[k])}</td>`).join('')}</tr>`;
    }).join('')}</tbody></table>
    ${moreLeft ? `<div class="actions" style="border-top:0;padding-top:14px">
      <button class="btn ghost" onclick="loadMoreRecords()">더 보기 (500건 더 불러오기)</button>
    </div>` : ''}`;
}
// 화면 표는 제한을 두지만, 엑셀 내려받기는 지금 걸린 필터에 맞는 기록 전체를
// 새로 불러와서 담습니다(화면 제한과 무관합니다).
async function exportRecordsCSV(){
  toast('내려받을 목록을 모으는 중…');

  const hidden = S._recHidden || [];
  const cols = REC_COLUMNS.filter(([k])=>!hidden.includes(k));

  if(data && data.length===5000){

  }
  downloadCSV('시모니_전체기록.csv', cols.map(([,l])=>l), rows);

// '전체 기록' 표에서 행을 누르면, 그 기록이 속한 폼의 항목 정의를 그때그때 불러와
// 상세 내용을 보여줍니다(폼마다 항목이 다르므로 미리 다 불러두지 않습니다).
async function openRecordDetailByIndex(i){
  const r = S._recRows?.[i];
  if(!r) return;
  const form = S.forms.find(f=>f.id===r.form_id);
  const { data: fields, error } = await sb.from('form_fields').select('*')
    .eq('form_id', r.form_id).order('sort_order');
  if(error){ toast('항목을 불러오지 못했습니다: '+error.message,'bad'); return; }
  const rname = {}; S.allRegions.forEach(x=>rname[x.id]=x.name);
  let rows = `<dt>폼</dt><dd>${esc(form?.title||'')}</dd>
    <dt>작성일</dt><dd>${fmtDate(r.created_at)}</dd>
    <dt>지역</dt><dd>${esc(rname[r.region_id]||'')}</dd>
    <dt>작성자</dt><dd>${esc(r.author_name||'')}</dd>`;
  if(form?.links_client){
    rows += `<dt>내담자</dt><dd>${esc(r.client_name||'')} · ${esc(r.birth_date||'')} · ${esc(r.gender||'')} · ID ${esc(r.client_internal_id||'')}</dd>`;
  }
  const photoSlots = [];   // 사진은 주소를 받아 온 뒤에 채웁니다
  for(const f of (fields||[])){
    const v = r.data?.[f.field_key];
    if(v===null||v===undefined||v==='') continue;
    if(f.field_type==='file'){
      const list = Array.isArray(v) ? v : [{ path:null, name:v, url:v }];
      if(!list.length) continue;
      const slot = 'ph_'+Math.random().toString(36).slice(2,9);
      photoSlots.push({ slot, list });
      rows += `<dt>${esc(f.label)}</dt>
        <dd><div class="thumbs" id="${slot}"><span class="hint">${list.length}장 불러오는 중…</span></div></dd>`;
      continue;
    }
    rows += `<dt>${esc(f.label)}</dt><dd>${esc(Array.isArray(v)?v.join(', '):typeof v==='boolean'?(v?'예':'아니오'):v)}</dd>`;
  }
  const ov=document.createElement('div');
  ov.className='overlay';
  // 바깥을 눌러도 닫히지 않습니다. 글을 쓰다 실수로 옆을 눌러 날리는 일이
  // 잦았기 때문입니다. 닫으려면 '취소'를 누르거나 ESC를 누릅니다.
  ov.innerHTML=`<div class="modal"><h3>${esc(form?.title||'기록')} 상세</h3>
    <dl class="dl">${rows}</dl>
    <div class="actions">
      ${canEditRecord(r)?`<button class="btn" onclick="this.closest('.overlay').remove();editRecordModal(S._recRows[${i}])">수정</button>
      <button class="btn ghost" style="color:var(--warn);border-color:var(--warn)"
        onclick="deleteRecord(S._recRows[${i}])">삭제</button>`:''}
      <button class="btn ghost" onclick="this.closest('.overlay').remove()">닫기</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  // 사진은 볼 때마다 잠깐 쓸 주소를 새로 받아 옵니다
  photoSlots.forEach(async ({slot, list})=>{
    const signed = await signFiles(list);
    const box = document.getElementById(slot);
    if(!box) return;
    box.innerHTML = signed.map(f=>
      f.url ? `<div class="thumb"><img src="${esc(f.url)}" alt="${esc(f.name||'')}"
                 onclick="window.open('${esc(f.url)}','_blank','noopener')">
                 <div class="cap">${esc(f.name||'')}</div></div>`
            : `<div class="thumb"><div class="cap">${esc(f.name||'사진')} (열 수 없음)</div></div>`
    ).join('');
  });
}

/* ── 상세소속: 지역별 소속(부서) 목록 + 전 지역 공용 직급·직무 목록 ── */
async function adminMaster(){
  await loadLookups();
  const tops = S.regions;
  let html = `<div class="panel">
    <h2>상세소속 (부서)</h2>
    <div class="desc">여기 넣은 목록이 내담자 등록 화면의 부서 선택지가 됩니다.
      지역을 고르면 그 지역 목록만 나옵니다.</div>
    ${isSuper() ? '' : `<div class="msg info">직급·직무 목록은 모든 지역이 함께 쓰기 때문에
      최종관리자가 관리합니다. 추가할 것이 있으면 말씀해 주세요.</div>`}
    <div class="grid"><div class="field">
      <label>지역</label>
      <select id="mst_region" onchange="S._mstRegion=this.value;adminMaster()">
        ${tops.map(r=>`<option value="${r.id}"
          ${r.id===S._mstRegion?'selected':''}>${esc(r.name)}</option>`).join('')}
      </select></div></div>`;

  const rid = S._mstRegion || tops[0]?.id;
  S._mstRegion = rid;
  const list = S.depts.filter(d=>d.region_id===rid);
  html += `<table><thead><tr><th>부서 이름</th><th>순서</th><th>상태</th><th></th></tr></thead><tbody>`;
  if(!list.length) html += `<tr><td colspan="4"><div class="empty">
    이 지역의 부서가 없습니다. 아래에서 추가하세요.</div></td></tr>`;
  list.forEach(d=>{
    html += `<tr><td><b>${esc(d.name)}</b></td><td>${d.sort_order}</td>
      <td>${d.is_active?'사용 중':'중지'}</td>
      <td style="text-align:right">
        <button class="btn ghost" onclick="editDept('${d.id}')">수정</button>
        <button class="btn ghost" onclick="delDept('${d.id}')">삭제</button></td></tr>`;
  });
  html += `</tbody></table>
    <div class="actions">
      <button class="btn" onclick="editDept(null)">부서 추가</button>
      <button class="btn ghost" onclick="bulkDept()">여러 개 한번에 추가</button>
    </div></div>`;

  // 직급·직무는 전 지역 공용이라 최종관리자만 고칩니다
  for(const [type,label] of (isSuper() ? [['rank','직급'],['duty','직무']] : [])){
    const items = S.codes[type]||[];
    html += `<div class="panel"><h2>${label}</h2>
      <div class="desc">전 지역 공용 목록입니다.</div>
      <table><thead><tr><th>${label} 이름</th><th>순서</th><th>상태</th><th></th></tr></thead><tbody>`;
    if(!items.length) html += `<tr><td colspan="4"><div class="empty">목록이 없습니다.</div></td></tr>`;
    items.forEach(c=>{
      html += `<tr><td><b>${esc(c.label)}</b></td><td>${c.sort_order}</td>
        <td>${c.is_active?'사용 중':'중지'}</td>
        <td style="text-align:right">
          <button class="btn ghost" onclick="editCode('${type}','${c.id}')">수정</button>
          <button class="btn ghost" onclick="delCode('${c.id}')">삭제</button></td></tr>`;
    });
    html += `</tbody></table><div class="actions">
      <button class="btn" onclick="editCode('${type}',null)">${label} 추가</button></div></div>`;
  }
  $('adminBody').innerHTML = html;
}

function editDept(id){
  const d = id ? S.depts.find(x=>x.id===id) : null;
  modal(d?'부서 수정':'부서 추가', `
    <div class="field"><label>부서 이름<span class="req">*</span></label>
      <input type="text" id="m_dname" value="${esc(d?.name||'')}" placeholder="예: 의창소방서"></div>
    <div class="grid" style="margin-top:12px">
      <div class="field"><label>순서</label>
        <input type="number" id="m_dsort" value="${d?.sort_order??10}"></div>
      <div class="field"><label>상태</label>
        <select id="m_dactive">
          <option value="true" ${!d||d.is_active?'selected':''}>사용 중</option>
          <option value="false" ${d&&!d.is_active?'selected':''}>중지</option></select></div>
    </div>`,
    async ()=>{
      const name=$('m_dname').value.trim();
      if(!name){ toast('부서 이름을 입력하세요','bad'); return false; }
      const row={ name, sort_order:Number($('m_dsort').value)||10,
                  is_active:$('m_dactive').value==='true' };
      let error;
      if(d){ ({ error } = await sb.from('departments').update(row).eq('id',d.id)); }
      else { row.region_id = S._mstRegion; ({ error } = await sb.from('departments').insert(row)); }
      if(error){
        toast(error.code==='23505'?'같은 이름의 부서가 이미 있습니다':'저장하지 못했습니다: '+error.message,'bad');
        return false;
      }
      toast('부서를 저장했습니다'); adminMaster(); return true;
    });
}
function bulkDept(){
  modal('부서 여러 개 추가', `

      <textarea id="m_bulk" style="min-height:150px"
        placeholder="창원소방본부&#10;의창소방서&#10;성산소방서"></textarea>
      <div class="hint">이미 있는 이름은 건너뜁니다</div></div>`,
    async ()=>{
      const names=$('m_bulk').value.split('\n').map(x=>x.trim()).filter(Boolean);
      if(!names.length){ toast('추가할 이름을 입력하세요','bad'); return false; }
      const exist=new Set(S.depts.filter(d=>d.region_id===S._mstRegion).map(d=>d.name));
      const rows=names.filter(n=>!exist.has(n))
        .map((n,i)=>({ region_id:S._mstRegion, name:n, sort_order:(i+1)*10 }));
      if(!rows.length){ toast('모두 이미 등록된 부서입니다','bad'); return false; }
      const { error } = await sb.from('departments').insert(rows);
      if(error){ toast('저장하지 못했습니다: '+error.message,'bad'); return false; }
      toast(`부서 ${rows.length}개를 추가했습니다`); adminMaster(); return true;
    });
}
async function delDept(id){
  const d=S.depts.find(x=>x.id===id);
  if(!confirm(`'${d.name}' 부서를 목록에서 지웁니다.\n이미 저장된 기록의 값은 그대로 남습니다. 계속할까요?`)) return;
  const { error } = await sb.from('departments').delete().eq('id',id);
  if(error){ toast('지우지 못했습니다: '+error.message,'bad'); return; }
  toast('부서를 지웠습니다'); adminMaster();
}
function editCode(type,id){

  const c = id ? (S.codes[type]||[]).find(x=>x.id===id) : null;
  const label = type==='rank'?'직급':'직무';
  modal(c?label+' 수정':label+' 추가', `
    <div class="field"><label>${label} 이름<span class="req">*</span></label>
      <input type="text" id="m_clabel" value="${esc(c?.label||'')}"></div>
    <div class="grid" style="margin-top:12px">
      <div class="field"><label>순서</label>
        <input type="number" id="m_csort" value="${c?.sort_order??10}"></div>
      <div class="field"><label>상태</label>
        <select id="m_cactive">
          <option value="true" ${!c||c.is_active?'selected':''}>사용 중</option>
          <option value="false" ${c&&!c.is_active?'selected':''}>중지</option></select></div>
    </div>`,
    async ()=>{
      const lab=$('m_clabel').value.trim();
      if(!lab){ toast('이름을 입력하세요','bad'); return false; }
      const row={ label:lab, sort_order:Number($('m_csort').value)||10,
                  is_active:$('m_cactive').value==='true' };
      let error;
      if(c){ ({ error } = await sb.from('code_options').update(row).eq('id',c.id)); }
      else { row.code_type=type; ({ error } = await sb.from('code_options').insert(row)); }
      if(error){
        toast(error.code==='23505'?'같은 이름이 이미 있습니다':'저장하지 못했습니다: '+error.message,'bad');
        return false;
      }
      toast('저장했습니다'); adminMaster(); return true;
    });
}
async function delCode(id){

// 지금 고른 지역으로 어떻게 들어가는지 알려 줍니다
function showSyncTarget(){
  const box = $('syncTargetNote');
  const id = $('sync_region')?.value || S._syncRegion;
  S._syncRegion = id;
  const r = S.allRegions.find(x=>x.id===id);

  // 양식 받기 쪽 안내
  const tpl = $('tplNote');
  if(tpl && r){
    tpl.innerHTML = r.parent_id
      ? `<div class="msg bad" style="margin-top:12px">
          <b>${esc(r.name)}</b>는 소방서 하나입니다. 이 소방서만을 위한 양식이 만들어집니다.
          <div class="hint" style="color:inherit;margin-top:4px">
            여러 소방서가 담긴 명부를 받으실 거라면 위에서
            <b>${esc(S.allRegions.find(x=>x.id===r.parent_id)?.name || '상위지역')}</b>을 골라 주세요.</div></div>`
      : `<div class="msg info" style="margin-top:12px">
          <b>${esc(r.name)}</b> 전체용 양식입니다. 안내 시트에 소방서 목록이 함께 담깁니다.</div>`;
  }

  if(!box) return;
  if(!r){ box.innerHTML=''; return; }
  if(!r.parent_id){
    const kids = S.allRegions.filter(x=>x.parent_id===r.id);
    box.className = 'msg info';
    box.innerHTML = `<b>${esc(r.name)}</b>의 소방서 ${kids.length}곳으로 나눠 넣습니다.`
      + (kids.length ? `<div class="hint" style="color:inherit;margin-top:4px">${
          kids.map(k=>esc(k.name)).join(' · ')}</div>`
        : `<div class="hint" style="color:var(--warn);margin-top:4px">
            아직 소방서가 없습니다. 관리 → 지역에서 먼저 추가해 주세요.</div>`);
  }else{
    box.className = 'msg info';
    box.innerHTML = `명단 전체가 <b>${esc(r.name)}</b> 한 곳으로 들어갑니다.
      <div class="hint" style="color:inherit;margin-top:4px">
        여러 소방서가 섞인 파일이라면 위에서 상위지역을 골라 주세요.</div>`;
  }
}

function saveApi(){
  const v=$('apiUrl').value.trim().replace(/\/$/,'');
  localStorage.setItem('sb_api', v);
  toast(v?'백엔드 주소를 저장했습니다':'백엔드 주소를 지웠습니다');
  adminSync();
}
async function downloadTemplate(){
  const rid=$('sync_region').value;
  try{
    toast('양식을 만드는 중입니다…');
    const res = await apiCall(`/api/clients/template?region_id=${encodeURIComponent(rid)}`);
    const blob = await res.blob();
    const name = (S.regions.find(r=>r.id===rid)?.name||'지역')+'_내담자명부_양식.xlsx';
    const url = URL.createObjectURL(blob);
    const a=document.createElement('a'); a.href=url; a.download=name; a.click();
    URL.revokeObjectURL(url);
    toast('양식을 내려받았습니다');
  }catch(e){ toast(e.message,'bad'); }
}
// 고른 지역이 상위지역이면 소속 칸을 보고 자동으로 나눕니다
function isParentRegion(id){
  const r = S.allRegions.find(x=>x.id===id);
  return !!(r && !r.parent_id);
}
async function pickSyncFile(file){
  if(!file) return;
  S._syncFile = file;
  const box=$('syncPreview');
  box.innerHTML=`<div class="empty">${esc(file.name)} 을(를) 살펴보는 중…</div>`;
  try{
    const fd=new FormData();
    fd.append('file', file);
    fd.append('region_id', S._syncRegion);
    fd.append('auto_assign', isParentRegion(S._syncRegion) ? 'true' : 'false');
    const res = await apiCall('/api/clients/sync/preview', { method:'POST', body:fd });
    const p = await res.json();
    S._syncPlan = p;
    renderSyncPreview(p, file.name);
  }catch(e){
    box.innerHTML=`<div class="msg bad">${esc(e.message)}</div>`;
  }
}

      </div></div>`;
}
async function applySync(){

  btn.disabled=true; btn.textContent='반영 중…';
  try{
    const fd=new FormData();
    fd.append('file', S._syncFile);
    fd.append('region_id', S._syncRegion);
    fd.append('auto_assign', isParentRegion(S._syncRegion) ? 'true' : 'false');
    fd.append('user_id', S.me.id);
    const res = await apiCall('/api/clients/sync/apply', { method:'POST', body:fd });

    $('syncPreview').innerHTML = `<div class="panel">
      <h2>반영을 마쳤습니다</h2>
      <div class="cards">
        ${card('신규 등록', (r.created||0)+'명')}
        ${card('정보 변경', (r.updated||0)+'명')}
        ${card('전출 처리', (r.left||0)+'명')}
        ${card('변화 없음', (r.unchanged||0)+'명')}
      </div>
      ${Object.keys(r.by_region||{}).length ? `<h2 style="margin-top:18px">소방서별</h2>
        ${barList(Object.entries(r.by_region).sort((a,b)=>b[1]-a[1]))}` : ''}
      <div class="actions"><button class="btn ghost" onclick="adminSync()">닫기</button></div></div>`;
    toast('명부를 갱신했습니다');
  }catch(e){

    btn.disabled=false; btn.textContent='이대로 반영하기';

      <br>둘 다 없으면 이름·소속·나이로 명부를 찾아보고, 확실하지 않으면 '확인 대기'로 남깁니다.</div>
    <div class="dropzone" id="dz_pdf"
      ondragover="event.preventDefault();this.classList.add('over')"
      ondragleave="this.classList.remove('over')"
      ondrop="event.preventDefault();this.classList.remove('over');uploadPdfs(event.dataTransfer.files)"
      onclick="document.getElementById('pdfFiles').click()">
      <b>PDF 파일을 여기에 끌어다 놓으세요</b>
      <span>여러 개를 한 번에 올릴 수 있습니다</span>
    </div>
    <input type="file" id="pdfFiles" class="hidden" accept="application/pdf" multiple
      onchange="uploadPdfs(this.files)">
    <div id="pdfResult"></div>
  </div>`;
}
async function uploadPdfs(files){
  if(!files || !files.length) return;
  const box=$('pdfResult');
  box.innerHTML=`<div class="empty">${files.length}개 파일을 읽고 분석하는 중입니다…
    <br>장수에 따라 1분 이상 걸릴 수 있습니다.</div>`;
  try{
    const fd=new FormData();
    [...files].forEach(f=>fd.append('files', f));
    fd.append('user_id', S.me.id);
    const res = await apiCall('/api/comp-tests/upload', { method:'POST', body:fd });
    const r = await res.json();
    const okCnt=(r.results||[]).filter(x=>x.status==='matched').length;
    const pendCnt=(r.results||[]).filter(x=>x.status==='pending').length;
    const failCnt=(r.results||[]).filter(x=>x.status==='failed').length;
    const dupCnt=(r.results||[]).filter(x=>x.duplicate).length;
    box.innerHTML = `<div class="cards" style="margin-top:16px">
        ${card('자동 연결', okCnt+'건')}
        ${card('확인 대기', pendCnt+'건', pendCnt>0)}
        ${card('실패', failCnt+'건', failCnt>0)}
      </div>
      ${dupCnt>0?`<div class="msg info" style="margin-top:12px">같은 사람의 같은 검사가 이미
        있는 파일이 ${dupCnt}건 있습니다. 재검사라면 그대로 두시고, 실수로 두 번 올린 것이라면
        아래 표에서 '지우기'를 눌러 주세요.</div>`:''}
      <div style="overflow:auto"><table><thead><tr>
        <th>원본 파일</th><th>바뀐 이름</th><th>이름</th><th>생년월일</th>
        <th>위험도</th><th>용량</th><th>결과</th><th></th></tr></thead><tbody>
        ${(r.results||[]).map(x=>`<tr id="upRow_${esc(x.id||'')}">
          <td style="font-size:13px">${esc(x.original)}</td>
          <td style="font-size:13px">${esc(x.renamed||'—')}</td>
          <td><b>${esc(x.name||'—')}</b></td>
          <td>${esc(x.birth_date||'—')}${x.birth_from_roster
              ?'<br><span class="hint">명부에서 채움</span>':''}</td>
          <td>${esc(x.risk_level||'—')}</td>
          <td style="font-size:13px">${x.original_kb!=null
              ? `${x.original_kb}KB → ${x.saved_kb}KB`
                + (x.saved_pct>0 ? `<br><span style="color:var(--warn)">${x.saved_pct}% 절약</span>` : '')
                + (x.saved_as_image ? `<br><span class="hint">그림으로 저장</span>` : '')
              : '—'}</td>
          <td>${x.status==='matched'?'연결됨'
              :x.status==='pending'?'<span style="color:var(--warn)">확인 대기</span>'
              :`<span style="color:var(--warn)">실패: ${esc(x.reason||'')}</span>`}
            ${x.duplicate?`<br><span class="chip risk" style="margin-top:4px">이미 ${x.duplicate.count}건 있음
              · ${fmtDate(x.duplicate.last_at)}</span>`:''}
            ${x.ai_error?`<br><span class="hint" style="color:var(--warn)">AI 분석 실패: ${esc(x.ai_error)}</span>`
              :(x.id && !x.ai_used)?`<br><span class="hint">AI가 내용을 읽지 못했습니다
                (글자 ${x.text_chars??0}자)</span>`
              :x.has_interp?`<br><span class="chip" style="margin-top:4px">해석지 생성됨</span>`:''}</td>
          <td style="white-space:nowrap">
            ${(x.id && x.status==='pending')?`<button class="btn" style="padding:6px 12px"
              onclick="openPendingLink('${x.id}','${jsq(x.name)}','${jsq(x.birth_date)}')">연결하기</button> `:''}
            ${x.id?`<button class="btn ghost" style="padding:6px 12px"
            onclick="deleteCompTest('${x.id}','${jsq(x.name)}',this)">지우기</button>`:''}</td>
        </tr>`).join('')}
      </tbody></table></div>
      <div class="actions"><button class="btn ghost" onclick="showCompTests()">결과 목록 보기</button></div>`;
  }catch(e){
    box.innerHTML=`<div class="msg bad">${esc(e.message)}</div>`;
  }
}

/* ═══════════════════════════════════════════════════

const AUDIT_TABLE_LABEL = {
  clients:'내담자 명부', form_records:'상담·업무 기록', users:'사용자',
  forms:'폼 정의', form_fields:'폼 항목',
};
const AUDIT_ACTION_LABEL = { insert:'새로 만듦', update:'수정', delete:'지움' };

async function adminAudit(){
  if(S.me.role !== 'super_admin'){
    $('adminBody').innerHTML = '<div class="panel"><div class="msg bad">'
      + '변경 이력은 최종관리자만 볼 수 있습니다.</div></div>';
    return;
  }
  $('adminBody').innerHTML = '<div class="panel"><div class="empty">불러오는 중…</div></div>';

  // 항목 이름 사전 (data.station → 소속 소방서)
  if(!S._fieldLabels){
    const { data: ff } = await sb.from('form_fields').select('field_key,label');
    const map = {};
    (ff||[]).forEach(f=>{ map['data.'+f.field_key] = f.label; });
    Object.assign(map, {
      name:'이름', birth_date:'생년월일', gender:'성별', internal_id:'개인식별아이디',
      employee_no:'사번', status:'재직상태', extra:'명부 추가정보', region_id:'지역',
      client_name:'내담자', author_name:'작성자', role:'권한', email:'이메일',
      username:'아이디', title:'이름', label:'항목 이름', options:'선택지',
      required:'필수 여부', is_active:'사용 여부', sort_order:'순서',
    });
    S._fieldLabels = map;
  }

  let q = sb.from('audit_logs').select('*').order('created_at',{ascending:false}).limit(300);
  if(S._auditActor) q = q.eq('actor_id', S._auditActor);
  if(S._auditTable) q = q.eq('table_name', S._auditTable);
  if(S._auditFrom)  q = q.gte('created_at', S._auditFrom);
  if(S._auditTo)    q = q.lte('created_at', S._auditTo + 'T23:59:59');
  const { data: logs, error } = await q;
  if(error){
    $('adminBody').innerHTML = `<div class="panel"><div class="msg bad">
      불러오지 못했습니다: ${esc(error.message)}
      <div class="hint" style="margin-top:6px">patch7.sql을 실행했는지 확인해 주세요.</div></div></div>`;
    return;
  }
  const { data: users } = await sb.from('users').select('id,name,role').order('name');

  const byActor = {};
  (logs||[]).forEach(l=>{
    const k = l.actor_name || '시스템';
    byActor[k] = (byActor[k]||0)+1;
  });

  let html = `<div class="panel">
    <h2>수정 로그</h2>
    <div class="desc">누가 언제 무엇을 바꿨는지 자동으로 쌓입니다.
      이 기록은 아무도 고치거나 지울 수 없습니다.</div>
    <div class="grid">
      <div class="field"><label>누가</label>
        <select id="a_actor" onchange="S._auditActor=this.value;adminAudit()">
          <option value="">전체</option>
          ${(users||[]).map(u=>`<option value="${u.id}"
            ${u.id===S._auditActor?'selected':''}>${esc(u.name)}</option>`).join('')}
        </select></div>
      <div class="field"><label>무엇을</label>
        <select id="a_table" onchange="S._auditTable=this.value;adminAudit()">
          <option value="">전체</option>
          ${Object.entries(AUDIT_TABLE_LABEL).map(([k,v])=>`<option value="${k}"
            ${k===S._auditTable?'selected':''}>${esc(v)}</option>`).join('')}
        </select></div>
      <div class="field"><label>시작일</label>
        <input type="date" id="a_from" value="${esc(S._auditFrom||'')}"
          onchange="S._auditFrom=this.value;adminAudit()"></div>
      <div class="field"><label>종료일</label>
        <input type="date" id="a_to" value="${esc(S._auditTo||'')}"
          onchange="S._auditTo=this.value;adminAudit()"></div>
    </div>
    <div class="actions">
      <button class="btn ghost" onclick="S._auditActor='';S._auditTable='';S._auditFrom='';S._auditTo='';adminAudit()">
        조건 지우기</button>
    </div>
  </div>`;

  if(Object.keys(byActor).length){
    html += `<div class="panel"><h2>사람별 건수</h2>`
      + barList(Object.entries(byActor).sort((a,b)=>b[1]-a[1])) + `</div>`;
  }

  html += `<div class="panel"><h2>변경 내역 ${logs?.length||0}건</h2>`;
  if(!logs?.length){
    html += `<div class="empty">조건에 맞는 변경 기록이 없습니다.</div></div>`;
    $('adminBody').innerHTML = html; return;
  }

  // 날짜별로 묶어 보여 줍니다
  const byDay = {};
  logs.forEach(l=>{ (byDay[fmtDate(l.created_at)] = byDay[fmtDate(l.created_at)] || []).push(l); });

  for(const [day, items] of Object.entries(byDay)){
    html += `<div class="audit-day">${esc(day)} · ${items.length}건</div><div class="tl">`;
    items.forEach(l=>{
      const roleLab = { super_admin:'최종관리자', manager:'중간관리자',
                        counselor:'상담사', system:'시스템' }[l.actor_role] || l.actor_role;
      const t = new Date(l.created_at);
      const hhmm = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;
      const chips = (l.changes||[]).slice(0,6).map(ch=>{
        const label = S._fieldLabels[ch.field] || ch.field.replace(/^data\./,'');
        return `<div class="chg">
          <span class="chg-f">${esc(label)}</span>
          <span class="chg-b">${esc(shorten(ch.before))}</span>
          <span class="chg-arrow">→</span>
          <span class="chg-a">${esc(shorten(ch.after))}</span></div>`;
      }).join('');
      const more = (l.changes||[]).length > 6
        ? `<div class="hint">외 ${l.changes.length-6}개 항목</div>` : '';
      html += `<div class="tl-item" style="cursor:default">
        <div class="tl-date">${hhmm} · <b>${esc(l.actor_name||'시스템')}</b>
          (${esc(roleLab)}) · ${esc(AUDIT_TABLE_LABEL[l.table_name]||l.table_name)}</div>
        <div class="tl-title">${esc(AUDIT_ACTION_LABEL[l.action]||l.action)} — ${esc(l.summary||'')}</div>
        ${chips}${more}</div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  $('adminBody').innerHTML = html;
}
function shorten(v){
  if(v===null || v===undefined || v==='') return '(비어 있음)';
  const s = String(v);
  return s.length > 40 ? s.slice(0,40)+'…' : s;
}

    <h2>폼</h2>

function pickForm(id){ S._pickForm=id; adminForms(); }

function editForm(id){

  const f = id ? S._aforms.find(x=>x.id===id) : null;
  modal(`${f?'폼 수정':'새 폼 만들기'}`, `
    <div class="grid">
      <div class="field wide"><label>폼 이름<span class="req">*</span></label>
        <input type="text" id="m_title" value="${esc(f?.title||'')}" placeholder="예: 스크리닝 기록"></div>
      <div class="field wide"><label>설명</label>
        <input type="text" id="m_desc" value="${esc(f?.description||'')}"></div>
      <div class="field"><label>내담자 연결</label>
        <select id="m_lc">
          <option value="true" ${f?.links_client?'selected':''}>연결함 (내담자를 고름)</option>
          <option value="false" ${f&&!f.links_client?'selected':''}>연결 안 함</option>
        </select>
        <div class="hint">상담 기록이면 연결함, 업무보고면 연결 안 함</div></div>
      <div class="field"><label>여러 명 한꺼번에 입력</label>
        <select id="m_group">
          <option value="false" ${!f||!f.allow_group?'selected':''}>한 명씩 (기본)</option>
          <option value="true" ${f&&f.allow_group?'selected':''}>여러 명 동시 입력 (집단상담처럼)</option>
        </select>
        <div class="hint">같은 사건으로 여러 명을 한 번에 상담했을 때, 내용을 한 번만 입력하고
          참여자만 여러 명 고르게 합니다. '내담자 연결'이 켜져 있어야 동작합니다.</div></div>
      <div class="field"><label>순서</label>
        <input type="number" id="m_sort" value="${f?.sort_order??10}"></div>
      <div class="field"><label>사용 여부</label>
        <select id="m_active">
          <option value="true" ${!f||f.is_active?'selected':''}>사용 중</option>
          <option value="false" ${f&&!f.is_active?'selected':''}>중지 (탭에서 숨김)</option>
        </select></div>
    </div>`,
    async ()=>{
      const title=$('m_title').value.trim();
      if(!title){ toast('폼 이름을 입력하세요','bad'); return false; }
      const row = {
        title, description:$('m_desc').value.trim()||null,
        links_client:$('m_lc').value==='true',
        allow_group:$('m_group').value==='true',
        sort_order:Number($('m_sort').value)||10,
        is_active:$('m_active').value==='true',
      };
      let error;
      if(f){ ({ error } = await sb.from('forms').update(row).eq('id', f.id)); }
      else {
        row.slug = 'form-'+Date.now().toString(36);
        row.created_by = S.me.id;
        ({ error } = await sb.from('forms').insert(row));
      }
      if(error){ toast('저장하지 못했습니다: '+error.message,'bad'); return false; }
      toast(f?'폼을 수정했습니다':'폼을 만들었습니다');
      await reloadForms(); adminForms(); return true;
    });
}
async function reloadForms(){
  const { data } = await sb.from('forms').select('*').eq('is_active',true).order('sort_order');

/* 폼 항목 하나를 아주 지웁니다 (최종관리자만).

   보통은 '중지'가 맞습니다. 중지하면 입력 화면에서는 사라지지만 과거 기록의
   값은 그대로 남아 나중에 볼 수 있습니다. 지우는 것은 '잘못 만들어 붙은 항목'
   처럼 애초에 있으면 안 됐던 것을 치울 때 씁니다.

   그래서 지우기 전에 그 항목에 값이 들어 있는 기록이 있는지 세어 보고,
   있으면 몇 건인지 알려 준 뒤 한 번 더 확인을 구합니다. */
async function deleteField(id, label){
  if(!isSuper()){ toast('최종관리자만 지울 수 있습니다','bad'); return; }
  const f = S._afields.find(x=>x.id===id);
  if(!f) return;

  let used = 0;
  try{
    const { count } = await sb.from('form_records')
      .select('id', { count:'exact', head:true })
      .eq('form_id', S._pickForm)
      .not(`data->>${f.field_key}`, 'is', null);
    used = count || 0;
  }catch(e){ used = -1; }   // 세지 못했으면 -1로 두고 그렇게 알려 줍니다

  const warn = used > 0
    ? `\n\n이 항목에 값이 든 기록이 ${used}건 있습니다.\n항목을 지워도 기록 자체는 남지만, 그 값은 화면에서 보이지 않게 됩니다.\n기록을 살려 두려면 '취소'하고 상태를 «중지»로 바꾸세요.`
    : used === 0 ? '\n\n이 항목이 쓰인 기록은 없습니다.' : '';
  if(!confirm(`'${label}' 항목을 아주 지울까요?${warn}\n\n되돌릴 수 없습니다.`)) return;

  const { error } = await sb.from('form_fields').delete().eq('id', id);
  if(error){ toast('지우지 못했습니다: '+error.message,'bad'); return; }
  toast(`'${label}' 항목을 지웠습니다`);
  renderFieldEditor();
}

async function moveField(i,dir){
  const a = S._afields[i], b = S._afields[i+dir];
  if(!b) return;
  await sb.from('form_fields').update({ sort_order:b.sort_order }).eq('id',a.id);
  await sb.from('form_fields').update({ sort_order:a.sort_order }).eq('id',b.id);
  renderFieldEditor();
}

function editField(id){
  if(!isSuper()){ toast('폼 항목은(는) 최종관리자만 다룰 수 있습니다','bad'); return; }
  const f = id ? S._afields.find(x=>x.id===id) : null;
  const sections = [...new Set(S._afields.map(x=>x.section).filter(Boolean))];
  const typeOpts = FIELD_TYPES.map(([v,l])=>

  modal(f?'항목 수정':'항목 추가', `
    <div class="grid">
      <div class="field"><label>이름<span class="req">*</span></label>
        <input type="text" id="m_label" value="${esc(f?.label||'')}" placeholder="예: 상담 방법"></div>
      <div class="field"><label>유형<span class="req">*</span></label>
        <select id="m_type" onchange="toggleOptBox()">${typeOpts}</select></div>
      <div class="field"><label>구획</label>
        <input type="text" id="m_section" value="${esc(f?.section||'')}"

      <div class="field"><label>필수 여부</label>

        <select id="m_stats">

          <option value="false" ${f&&!f.stats_enabled?'selected':''}>집계 안 함</option></select></div>
      <div class="field"><label>상태</label>
        <select id="m_fa">
          <option value="true" ${!f||f.is_active?'selected':''}>사용 중</option>
          <option value="false" ${f&&!f.is_active?'selected':''}>중지</option></select></div>
      <div class="field wide" id="optBox">
        <label>선택지 (한 줄에 하나)</label>
        <textarea id="m_opts">${esc((f?.options||[]).join('\n'))}</textarea>
        <div class="hint">선택지가 ${CHIP_MAX}개 이하이면 드롭다운 대신 버튼으로 펼쳐 보여 줍니다.</div></div>
      <div class="field wide" id="defBox">
        <label>처음부터 골라 둘 값 (기본값)</label>
        <input type="text" id="m_def" value="${esc(f?.default_value||'')}"
          placeholder="예: 대면상담 — 비워 두면 아무것도 미리 고르지 않습니다">
        <div class="hint">선택지에 있는 말과 똑같이 적어야 합니다.
          여러 개 고르는 항목은 쉼표(,)로 나눠 적고, 예/아니오 항목은 «예»라고 적습니다.
          위험도·문제유형처럼 판단이 들어가는 항목에는 적어도 적용되지 않습니다.</div></div>
    </div>`,
    async ()=>{
      const label=$('m_label').value.trim();
      if(!label){ toast('항목 이름을 입력하세요','bad'); return false; }
      const type=$('m_type').value;
      const needOpts=['select','multiselect'].includes(type);
      const opts=$('m_opts').value.split('\n').map(s=>s.trim()).filter(Boolean);
      const active=$('m_fa').value==='true';
      // 선택지는 '쓰고 있는' 항목일 때만 있어야 합니다. 중지하려는 항목까지 막으면
      // 선택지가 비어 있는 항목은 지울 수도 멈출 수도 없게 됩니다.
      if(needOpts && active && !opts.length){
        toast('선택지를 한 줄에 하나씩 입력하세요. (중지하려면 상태를 «중지»로 바꾸세요)','bad');
        return false;
      }
      const row = {
        label, field_type:type,
        section:$('m_section').value.trim()||null,
        required:$('m_req').value==='true',
        stats_enabled:$('m_stats').value==='true',
        is_active:$('m_fa').value==='true',
        options: needOpts ? opts : null,
        default_value: $('m_def').value.trim() || null,
      };
      // 기본값이 선택지에 없으면 영영 적용되지 않습니다. 미리 알려 줍니다.
      if(row.default_value && type==='select' && opts.length && !opts.includes(row.default_value)){
        toast(`'${row.default_value}'은(는) 선택지에 없는 말입니다. 선택지와 똑같이 적어 주세요.`,'bad');
        return false;
      }
      let error;
      if(f){ ({ error } = await sb.from('form_fields').update(row).eq('id', f.id)); }
      else{
        row.form_id = S._pickForm;
        row.field_key = 'f_'+Date.now().toString(36);
        row.sort_order = (Math.max(0,...S._afields.map(x=>x.sort_order))||0)+10;
        ({ error } = await sb.from('form_fields').insert(row));
      }
      if(error){ toast('저장하지 못했습니다: '+error.message,'bad'); return false; }
      toast(f?'항목을 수정했습니다':'항목을 추가했습니다');
      renderFieldEditor(); return true;
    }, toggleOptBox);
}
function toggleOptBox(){
  const t=$('m_type')?.value;
  const box=$('optBox');
  if(box) box.style.display = ['select','multiselect'].includes(t) ? '' : 'none';
  const dbox=$('defBox');
  if(dbox) dbox.style.display = ['select','multiselect','checkbox'].includes(t) ? '' : 'none';
}

/* ── 지역 ── */
async function adminRegions(){
  const { data: regions } = await sb.from('regions').select('*').order('sort_order');
  S._aregions = regions||[];
  const tops = regions.filter(r=>!r.parent_id);

  let html = `<div class="panel">
    <h2>지역</h2>
    <div class="desc">상위지역 아래 하위지역을 둡니다. 상위지역 권한을 받은 사람은 그 아래 전부를 봅니다.</div>
    <table><thead><tr><th>지역</th><th>소속</th><th></th></tr></thead><tbody>`;
  if(!regions.length) html += `<tr><td colspan="3"><div class="empty">지역이 없습니다.</div></td></tr>`;
  for(const t of tops){
    html += regionRow(t, false);
    for(const c of regions.filter(r=>r.parent_id===t.id)) html += regionRow(c, true, t.name);
  }
  html += `</tbody></table>
    <div class="actions"><button class="btn" onclick="editRegion(null,null)">상위지역 추가</button></div></div>`;
  $('adminBody').innerHTML = html;
}
function regionRow(r, child, parentName){
  return `<tr>
    <td>${child?'<span style="color:var(--sub)">└ </span>':'<b>'}${esc(r.name)}${child?'':'</b>'}</td>
    <td>${child?esc(parentName):'—'}</td>
    <td style="text-align:right;white-space:nowrap">
      ${child?'':`<button class="btn ghost" onclick="editRegion(null,'${r.id}')">하위지역 추가</button> `}
      <button class="btn ghost" onclick="editRegion('${r.id}',null)">이름 변경</button>
      <button class="btn ghost" onclick="delRegion('${r.id}')">삭제</button>
    </td></tr>`;
}
function editRegion(id, parentId){
  if(!isSuper()){ toast('지역은(는) 최종관리자만 다룰 수 있습니다','bad'); return; }
  const r = id ? S._aregions.find(x=>x.id===id) : null;
  const isNew = !r;
  /* 설정 복사는 '상위지역을 새로 만들 때'만 뜻이 있습니다.
     하위지역(소방서)은 그 아래 부서 목록을 따로 갖지 않으므로 가져올 것이 없습니다. */
  const sources = (isNew && !parentId)
    ? S._aregions.filter(x=>!x.parent_id)
    : [];
  const copyBox = sources.length ? `
    <div class="field" style="margin-top:14px">
      <label>다른 지역의 설정 가져오기 (선택)</label>
      <select id="m_rcopy" onchange="toggleCopyDetail()">
        <option value="">가져오지 않고 새로 시작</option>
        ${sources.map(x=>`<option value="${x.id}">${esc(x.name)}에서 가져오기</option>`).join('')}
      </select>
      <div class="hint">이미 만들어 둔 지역이 있으면 그 설정을 그대로 옮겨 올 수 있습니다.
        새 시도를 추가할 때 처음부터 만들지 않아도 됩니다. 안 써도 괜찮습니다.</div>
      <div id="copyDetail" class="hidden" style="margin-top:10px">
        <label style="display:flex;align-items:center;gap:7px;font-weight:400">
          <input type="checkbox" id="cp_dept" checked> 상세소속(부서) 목록</label>
        <label style="display:flex;align-items:center;gap:7px;font-weight:400;margin-top:5px">
          <input type="checkbox" id="cp_fields" checked> 내담자 명부 항목 정의</label>
        <label style="display:flex;align-items:center;gap:7px;font-weight:400;margin-top:5px">
          <input type="checkbox" id="cp_subs"> 하위지역 이름까지 복사</label>
        <div class="hint" id="copySummary"></div>
      </div>
    </div>` : '';

  modal(r?'지역 이름 변경':(parentId?'하위지역 추가':'상위지역 추가'), `
    <div class="field"><label>지역 이름<span class="req">*</span></label>
      <input type="text" id="m_rname" value="${esc(r?.name||'')}"
        placeholder="${parentId ? '예: 마산소방서' : '예: 경남소방'}">
      ${parentId ? `<div class="hint">명부의 '소속' 칸에 적히는 이름과 같게 적어 주세요.
        예를 들어 명부에 '창원소방본부 소방정책과'라고 적힌다면 여기에는
        <b>창원소방본부</b>라고 적습니다.</div>` : ''}</div>
    <div class="field" style="margin-top:12px"><label>순서</label>
      <input type="number" id="m_rsort" value="${r?.sort_order??10}"></div>
    ${copyBox}`,
    async ()=>{
      const name=$('m_rname').value.trim();
      if(!name){ toast('지역 이름을 입력하세요','bad'); return false; }
      const row={ name, sort_order:Number($('m_rsort').value)||10 };

      if(r){
        const { error } = await sb.from('regions').update(row).eq('id', r.id);
        if(error){
          toast(error.code==='23505'?'같은 이름의 지역이 이미 있습니다':'저장하지 못했습니다: '+error.message,'bad');
          return false;
        }
        toast('지역 이름을 바꿨습니다');
        await refreshRegions(); await loadLookups(); adminRegions(); return true;
      }

      row.parent_id = parentId;
      const { data: made, error } = await sb.from('regions').insert(row).select('id').single();
      if(error){
        toast(error.code==='23505'?'같은 이름의 지역이 이미 있습니다':'저장하지 못했습니다: '+error.message,'bad');
        return false;
      }

      const src = $('m_rcopy')?.value;
      let copied = [];
      if(src){
        copied = await copyRegionSetup(src, made.id, {
          dept:   $('cp_dept')?.checked,
          fields: $('cp_fields')?.checked,
          subs:   $('cp_subs')?.checked,
        });
      }
      toast(copied.length ? `지역을 만들고 ${copied.join(', ')}을(를) 복사했습니다`
                          : '지역을 만들었습니다');
      await refreshRegions(); await loadLookups(); adminRegions(); return true;
    },
    ()=>{ toggleCopyDetail(); });
}
function toggleCopyDetail(){
  const sel=$('m_rcopy'), box=$('copyDetail');
  if(!sel||!box) return;
  const on = !!sel.value;
  box.classList.toggle('hidden', !on);
  if(!on) return;
  const srcId = sel.value;
  const nDept = S.depts.filter(d=>d.region_id===srcId).length;
  const nSub  = S._aregions.filter(r=>r.parent_id===srcId).length;
  const sum=$('copySummary');
  if(sum) sum.textContent = `부서 ${nDept}개 · 하위지역 ${nSub}개를 가져올 수 있습니다.`;
}

// 기존 지역의 설정을 새 지역으로 옮겨 심습니다
async function copyRegionSetup(srcId, dstId, opts){
  const done = [];
  try{
    if(opts.dept){
      const { data } = await sb.from('departments').select('*').eq('region_id', srcId);
      const rows = (data||[]).map(d=>({
        region_id: dstId, name: d.name, sort_order: d.sort_order, is_active: d.is_active,
      }));
      if(rows.length){
        const { error } = await sb.from('departments').insert(rows);
        if(!error) done.push(`부서 ${rows.length}개`);
      }
    }
    if(opts.fields){
      const { data } = await sb.from('client_field_defs').select('*').eq('region_id', srcId);
      const rows = (data||[]).map(f=>({
        region_id: dstId, field_key: f.field_key, label: f.label,
        field_type: f.field_type, options: f.options, required: f.required,
        sort_order: f.sort_order, lookup_source: f.lookup_source, allow_other: f.allow_other,
      }));
      if(rows.length){
        const { error } = await sb.from('client_field_defs').insert(rows);
        if(!error) done.push(`명부 항목 ${rows.length}개`);
      }
    }
    if(opts.subs){
      const kids = S._aregions.filter(r=>r.parent_id===srcId);
      const rows = kids.map(k=>({ name:k.name, parent_id:dstId, sort_order:k.sort_order }));
      if(rows.length){
        const { error } = await sb.from('regions').insert(rows);
        if(!error) done.push(`하위지역 ${rows.length}개`);
      }
    }
  }catch(e){
    toast('일부 설정을 복사하지 못했습니다: '+e.message,'bad');
  }
  return done;
}

async function delRegion(id){
  if(!isSuper()){ toast('지역은(는) 최종관리자만 다룰 수 있습니다','bad'); return; }
  const r = S._aregions.find(x=>x.id===id);
  const kids = S._aregions.filter(x=>x.parent_id===id).length;
  if(kids){ toast(`하위지역 ${kids}개를 먼저 옮기거나 지우세요`,'bad'); return; }
  const { count } = await sb.from('clients').select('id',{count:'exact',head:true}).eq('region_id',id);
  if(count){ toast(`이 지역에 내담자 ${count}명이 있어 지울 수 없습니다`,'bad'); return; }
  if(!confirm(`'${r.name}' 지역을 지웁니다. 계속할까요?`)) return;
  const { error } = await sb.from('regions').delete().eq('id',id);
  if(error){ toast('지우지 못했습니다: '+error.message,'bad'); return; }
  toast('지역을 지웠습니다');
  await refreshRegions(); adminRegions();
}
async function refreshRegions(){
  const { data: all } = await sb.from('regions').select('*').order('sort_order');
  S.allRegions = all || [];
  if(S.me.role==='super_admin'){ S.regions = all||[]; return; }
  const { data: mine } = await sb.from('user_regions').select('region_id').eq('user_id', S.me.id);
  const seed=new Set((mine||[]).map(x=>x.region_id));
  let grew=true;
  while(grew){ grew=false;
    for(const r of (all||[])) if(r.parent_id&&seed.has(r.parent_id)&&!seed.has(r.id)){ seed.add(r.id); grew=true; } }
  S.regions=(all||[]).filter(r=>seed.has(r.id));
}

            : (rs.join(', ') || '<span style="color:var(--warn)">없음</span>')}</div>
          <div><span>로그인 주소</span>${(()=>{
            const L = S._logins?.[u.id];
            if(!L) return '<span style="color:var(--sub)">확인 못 함</span>';
            if(!L.email) return '<span style="color:var(--warn)">로그인 계정 없음</span>';
            return esc(L.email) + (L.matches ? ''
              : ` <span class="chip risk" title="아이디로는 로그인되지 않습니다">아이디와 다름</span>`);
          })()}</div>
          <div><span>알림 메일</span>${esc(u.email||'—')}</div>
          <div><span>알림 받기</span>${u.notify_email===false?'끔':'켬'}</div>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  html += `<div class="actions">
    <button class="btn" onclick="editUser(null)">계정 만들기</button></div></div>`;
  $('adminBody').innerHTML = html;
}

// 계정 만들기·고치기
function editUser(id){
  const u = id ? S._ausers.find(x=>x.id===id) : null;
  const isNew = !u;
  const mineIds = new Set(S.regions.map(r=>r.id));
  const picked = new Set(S._amaps.filter(m=>m.user_id===id).map(m=>m.region_id));

  // 중간관리자는 상담사만, 그리고 자기 지역만 고를 수 있습니다
  const roles = isSuper()
    ? [['counselor','상담사'],['manager','중간관리자'],['super_admin','최종관리자']]
    : [['counselor','상담사']];

  const tops = S._aregions.filter(r=>!r.parent_id);
  let regHtml='';
  for(const t of tops){
    const okTop = isSuper() || mineIds.has(t.id);
    regHtml += `<label style="display:block;font-weight:600;margin-top:6px;${okTop?'':'opacity:.4'}">
      <input type="checkbox" name="ur" value="${t.id}"
        ${picked.has(t.id)?'checked':''} ${okTop?'':'disabled'}> ${esc(t.name)}</label>`;
    for(const c of S._aregions.filter(r=>r.parent_id===t.id)){
      const okKid = isSuper() || mineIds.has(c.id);
      regHtml += `<label style="display:block;margin-left:18px;font-weight:400;${okKid?'':'opacity:.4'}">
        <input type="checkbox" name="ur" value="${c.id}"
          ${picked.has(c.id)?'checked':''} ${okKid?'':'disabled'}> ${esc(c.name)}</label>`;
    }
  }

  modal(isNew?'계정 만들기':'계정 수정', `
    <div class="grid">
      <div class="field"><label>이름<span class="req">*</span></label>
        <input type="text" id="m_uname" value="${esc(u?.name||'')}" placeholder="예: 김상담"></div>
      <div class="field"><label>아이디<span class="req">*</span></label>
        <input type="text" id="m_ulogin" value="${esc(u?.username||'')}"
          ${isNew?'':'disabled'} autocapitalize="off" spellcheck="false"
          placeholder="예: gnkim">
        <div class="hint">${isNew
          ? '영문 소문자로 시작하고, 소문자와 숫자만 3~30자. 로그인할 때 씁니다.'
          : '아이디는 나중에 바꿀 수 없습니다.'}</div></div>
      ${isNew?`<div class="field"><label>비밀번호<span class="req">*</span></label>
        <input type="text" id="m_upw" placeholder="6자 이상">
        <div class="hint">본인에게 알려 준 뒤 바꾸도록 안내해 주세요.</div></div>`:''}
      <div class="field"><label>권한</label>
        <select id="m_urole" onchange="document.getElementById('regPick').style.display=this.value==='super_admin'?'none':''">
          ${roles.map(([v,l])=>`<option value="${v}" ${u?.role===v?'selected':''}>${l}</option>`).join('')}
        </select>
        ${isSuper()?'':'<div class="hint">중간관리자는 상담사 계정만 만들 수 있습니다.</div>'}</div>
      <div class="field"><label>알림 받을 메일</label>
        <input type="email" id="m_uemail" value="${esc(u?.email||'')}"
          placeholder="실제로 받는 주소 (선택)">
        <div class="hint">고위험군이 나오면 이 주소로 알려 줍니다. 비워 두셔도 됩니다.</div></div>
      <div class="field"><label>알림 받기</label>
        <select id="m_unotify">
          <option value="true" ${!u||u.notify_email!==false?'selected':''}>받기</option>
          <option value="false" ${u&&u.notify_email===false?'selected':''}>받지 않기</option></select></div>
      <div class="field wide" id="regPick" style="${u?.role==='super_admin'?'display:none':''}">
        <label>담당 지역<span class="req">*</span></label>
        <div class="checks" style="display:block">${regHtml||'<span class="hint">지역을 먼저 만드세요</span>'}</div>
        <div class="hint">상위지역을 고르면 그 아래 소방서도 함께 볼 수 있습니다.
          ${isSuper()?'':'담당하지 않는 지역은 고를 수 없습니다.'}</div></div>
    </div>`,
    async ()=>{
      const name=$('m_uname').value.trim();
      if(!name){ toast('이름을 입력하세요','bad'); focusMissing($('m_uname')); return false; }
      const role=$('m_urole').value;
      const picked=[...document.querySelectorAll('input[name="ur"]:checked')].map(x=>x.value);
      if(role!=='super_admin' && !picked.length){
        toast('담당 지역을 한 곳 이상 고르세요','bad'); return false;
      }
      const body = {
        name, role,
        region_ids: picked,
        email: $('m_uemail').value.trim() || null,
        notify_email: $('m_unotify').value==='true',
      };

      try{
        if(isNew){
          const username=$('m_ulogin').value.trim().toLowerCase();
          if(!/^[a-z][a-z0-9]{2,29}$/.test(username)){
            toast('아이디는 영문 소문자로 시작하고 소문자·숫자만 3~30자로 지어 주세요','bad');
            focusMissing($('m_ulogin')); return false;
          }
          const pw=$('m_upw').value;
          if(pw.length<6){ toast('비밀번호는 6자 이상으로 정해 주세요','bad');
            focusMissing($('m_upw')); return false; }
          body.username=username; body.password=pw;

          await apiCall('/api/users', {
            method:'POST',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify(body),
          });
          toast(`${name} 님의 계정을 만들었습니다`);
          showNewAccount(name, username, $('m_upw').value);
        }else{
          await apiCall('/api/users/'+u.id, {
            method:'PATCH',
            headers:{ 'Content-Type':'application/json' },
            body: JSON.stringify(body),
          });
          toast('고쳤습니다');
        }
        adminUsers();
        return true;
      }catch(e){
        toast(e.message,'bad');
        return false;
      }
    });
}

// 비밀번호 다시 정하기
/* 로그인 주소 고치기.

   화면에서는 아이디만 치지만 실제로는 '아이디@simony.local'로 로그인합니다.
   예전에 만든 계정 중 이 규칙과 어긋난 것이 있어(아이디 gnmanager /
   주소 gn-manager@simony.local) 비밀번호를 바꿔도 로그인이 안 되는 일이 있었습니다.
   최종관리자가 회사 메일을 그대로 쓰는 것처럼 일부러 다르게 둔 경우도 있으므로
   한꺼번에 맞추지 않고 한 사람씩 고르게 합니다. */
function editLoginEmail(id){
  const u = S._ausers.find(x=>x.id===id);
  const L = S._logins?.[u.id] || {};
  const expected = L.expected || (u.username + '@simony.local');
  modal(`${u.name} 님 로그인 주소`, `
    <div class="msg ${L.matches===false?'bad':'info'}" style="margin-top:0">
      지금 주소: <b>${esc(L.email||'없음')}</b><br>
      아이디에 맞춘 주소: <b>${esc(expected)}</b>
      ${L.matches===false
        ? '<br>둘이 달라서 <b>아이디로는 로그인되지 않습니다.</b> 지금 주소를 그대로 아이디 칸에 치면 들어가집니다.'
        : '<br>아이디로 로그인됩니다.'}
    </div>
    <div class="field"><label>새 로그인 주소</label>
      <input type="text" id="m_login" value="${esc(L.email||expected)}">
      <div class="hint">비워 두고 저장하면 아이디에 맞춘 주소(${esc(expected)})로 바뀝니다.</div></div>`,
    async ()=>{
      const v=$('m_login').value.trim();
      if(v && v===L.email){ toast('바뀐 것이 없습니다','bad'); return false; }
      if(!confirm(`로그인 주소를 '${v||expected}'로 바꿀까요?\n\n`
        + `이 주소로 로그인하게 됩니다. 비밀번호는 그대로입니다.`)) return false;
      try{
        const res = await apiCall(`/api/users/${id}/login-email`, {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ email: v }),
        });
        const r = await res.json();
        toast(`로그인 주소를 ${r.email}로 바꿨습니다`);
        adminUsers();
        return true;
      }catch(e){ toast(e.message,'bad'); return false; }
    });
}

// 계정 잠그기 / 다시 쓰기
async function toggleUser(id, activate){
  const u = S._ausers.find(x=>x.id===id);
  const msg = activate
    ? `${u.name} 님이 다시 로그인할 수 있게 합니다. 계속할까요?`
    : `${u.name} 님의 로그인을 막습니다.\n지금까지 남긴 기록은 그대로 보존됩니다. 계속할까요?`;
  if(!confirm(msg)) return;
  try{
    await apiCall(`/api/users/${id}/disable`, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ active: !!activate }),
    });
    toast(activate?'다시 쓸 수 있습니다':'로그인을 막았습니다');
    adminUsers();
  }catch(e){ toast(e.message,'bad'); }
}

/* ── 공용 모달 ── */
function modal(title, bodyHtml, onSave, afterOpen){
  const ov=document.createElement('div');
  ov.className='overlay';
  // 바깥을 눌러도 닫히지 않습니다. 글을 쓰다 실수로 옆을 눌러 날리는 일이
  // 잦았기 때문입니다. 닫으려면 '취소'를 누르거나 ESC를 누릅니다.
  ov.innerHTML=`<div class="modal"><h3>${esc(title)}</h3>${bodyHtml}
    <div class="actions">
      <button class="btn" id="mSave">저장</button>
      <button class="btn ghost" onclick="this.closest('.overlay').remove()">취소</button>
    </div></div>`;
  document.body.appendChild(ov);
  if(afterOpen) afterOpen();
  ov.querySelector('#mSave').onclick = async (e)=>{
    e.target.disabled=true; e.target.textContent='저장 중…';
    const ok = await onSave();
    if(ok) ov.remove();
    else { e.target.disabled=false; e.target.textContent='저장'; }
  };
}

/* ═══════════════════════════════════════════════════
   대시보드 — 지금 상태를 한 화면에
   ═══════════════════════════════════════════════════ */
function thisMonthStart(){
  const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
async function countOf(table, build){
  let q = sb.from(table).select('id',{count:'exact',head:true});
  if(build) q = build(q);
  const { count, error } = await q;
  return error ? 0 : (count||0);
}

async function renderHome(){
  const c=$('content');
  c.innerHTML='<div class="panel"><div class="empty">불러오는 중…</div></div>';

  const [total, month, clients, pendingComp, pendingSimple, highRisk] = await Promise.all([
    countOf('form_records'),
    countOf('form_records', q=>q.gte('created_at', thisMonthStart())),
    countOf('clients'),
    countOf('comp_tests', q=>q.neq('match_status','matched')),
    countOf('simple_tests', q=>q.neq('match_status','matched')),
    countOf('simple_tests', q=>q.or('suicide_risk.gte.1,ptsd_score.gte.6,dep_score.gte.3')),
  ]);
  const pending = pendingComp+pendingSimple;

  let html = `<div class="panel">
    <div class="searchbar">
      <input type="text" id="q" placeholder="이름·개인식별아이디·디지털 식별번호·사번으로 찾기"
        onkeydown="if(event.key==='Enter')searchPeople()">
      <button class="btn" onclick="searchPeople()">검색</button>
    </div>
    <div class="hint">이름 일부만 넣어도 됩니다. 검색 결과에서 이름을 누르면 그 사람의 전체 이력이 열립니다.
      화면이 좁으면 표를 옆으로 밀어서 볼 수 있습니다.</div>
    <div id="searchResult"></div>
  </div>`;

  html += `<div class="cards">
    ${card('전체 기록', total.toLocaleString()+'건')}
    ${card('이번 달', month.toLocaleString()+'건')}
    ${card('내담자', clients.toLocaleString()+'명')}
    ${card('고위험군', highRisk+'명', highRisk>0)}
  </div>`;

  /* 첫 화면에서 갈 수 있는 곳들.

     구버전(0.5) 대시보드에 있던 메뉴를 성격별로 다시 묶었습니다. 상단 메뉴로도
     갈 수 있는 것이 있지만, 구버전을 쓰던 분들이 첫 화면만 보고도 무엇을 할 수
     있는지 알 수 있도록 여기에도 둡니다. 아직 만들지 않은 화면은 감추지 않고
     '준비 중'으로 자리를 남겨 둡니다. */

  // ── 자주 쓰는 것 (상담사·관리자 모두)
  // 폼 이름은 저장된 실제 제목을 그대로 씁니다. 관리자가 이름을 바꾸면 버튼 글자도 따라 바뀝니다.
  html += `<div class="eyebrow">자주 쓰는 것</div><div class="quick">`;
  html += qbtn('내 내담자 보기','내가 맡은 사람 목록',"openTab('myclients')");
  TOP_NAV_FORMS.forEach(({words})=>{
    const f = findForm(words);
    if(f) html += qbtn(f.title+' 작성','새로 기록하기',`openTab('form:${f.id}')`);
  });
  html += `</div>`;

  // ── 목록 보기 (상담사·관리자 모두 — 구버전과 같게)
  html += `<div class="eyebrow">목록 보기</div><div class="quick">`;
  [['group','목록'],['task','내역']].forEach(([key,word])=>{
    const spec = TOP_NAV_FORMS.find(x=>x.key===key);
    const f = spec && findForm(spec.words);
    if(f) html += qbtn(f.title+' '+word,'지난 기록 훑어보기',`openTab('list:${f.id}')`);
  });
  html += qbtn('종합심리검사 결과','해석지 열람','showCompTests()');
  html += qbtn('간이검사 결과','점수와 판정 보기','showSimpleTests()');
  html += `</div>`;

  // ── 검사
  html += `<div class="eyebrow">검사</div><div class="quick">`;
  html += qbtn('간이검사 실시','7문항 마음건강 검사','openSimpleTest()');
  html += qbtn('고위험군 관리', highRisk>0?`확인 필요 ${highRisk}명`:'해당 없음',
               'showHighRisk()', highRisk>0?'alert':'');
  if(canManage()){

  // ── 관리자 전용 (구버전의 '관리자 전용 메뉴'와 같은 자리)

    html += `<div class="eyebrow">관리자 전용</div><div class="quick">`;
    html += qbtn('통계','기간별 집계 보기',"openTab('stats')");

    html += qsoon('특수 상담 리스트','심층·긴급 상담 모아보기',
      '특수 상담 리스트는 준비 중입니다. 지금은 기록 목록에서 폼별로 볼 수 있습니다.');
    html += qsoon('신규 내담자 일괄등록','표로 한번에 등록',
      '일괄등록은 준비 중입니다. 지금은 관리 → 내담자 DB에서 명부를 올릴 수 있습니다.');
    html += qsoon('긴급심리지원 일괄등록','여러 명 한번에',
      '일괄등록은 준비 중입니다. 지금은 한 명씩 기록해 주세요.');
    html += `</div>`;

    html += `<div class="eyebrow">다른 시스템</div><div class="quick">`;
    EXTERNAL_APPS.forEach(([name, sub, url])=>{
      html += qbtn(name, sub, `window.open('${url}','_blank','noopener')`);
    });
    html += `</div>`;
  }

  // 최근 기록
  const { data: recent } = await sb.from('form_records')
    .select('*').order('created_at',{ascending:false}).limit(8);
  const rname={}; S.regions.forEach(r=>rname[r.id]=r.name);
  const fname={}; S.forms.forEach(f=>fname[f.id]=f.title);
  html += `<div class="eyebrow">최근 기록</div><div class="panel">`;
  if(!recent?.length){
    html += `<div class="empty">첫 기록을 남기면 여기에 표시됩니다.</div>`;
  }else{
    html += `<table><thead><tr><th>작성일</th><th>폼</th><th>지역</th>
      <th>내담자</th><th>작성자</th></tr></thead><tbody>`;
    recent.forEach(r=>{
      const go = r.client_id ? `openClient('${r.client_id}')` : `openTab('list:${r.form_id}')`;
      html += `<tr onclick="${go}">
        <td>${fmtDate(r.created_at)}</td><td>${esc(fname[r.form_id]||'')}</td>
        <td>${esc(rname[r.region_id]||'')}</td>
        <td><b>${esc(r.client_name||'—')}</b></td>
        <td>${esc(r.author_name||'')}</td></tr>`;
    });
    html += `</tbody></table>`;
  }
  html += `</div>`;
  c.innerHTML = html;
}
// 아직 만들지 않은 화면
function soon(name){
  toast(name+' 화면은 아직 준비 중입니다');
}
function qbtn(title, sub, onclick, kind){
  return `<button class="qbtn ${kind||''}" onclick="${onclick}">
    <b>${esc(title)}</b><span>${esc(sub)}</span></button>`;
}
/* 아직 만들지 않은 화면의 자리입니다.

   구버전(0.5)에 있던 메뉴를 아예 감추면 상담사가 "기능이 없어졌다"고 오해합니다.
   그래서 자리는 그대로 두고 흐리게 보여 주며, 누르면 무엇이 준비 중인지 알려 줍니다.
   나중에 화면을 만들면 이 자리를 그대로 바꿔 끼우면 됩니다. */
function qsoon(title, sub, note){
  return `<button class="qbtn soon" onclick="toast(${JSON.stringify(note||(title+' 화면은 준비 중입니다'))})">
    <b>${esc(title)}</b>
    <span><span class="soon-tag">준비 중</span>${esc(sub)}</span></button>`;
}
// 구버전에서 쓰던 별도 시스템 세 개 — 주소만 걸어 새 탭으로 엽니다.
const EXTERNAL_APPS = [
  ['세보니', '통합과업', 'https://script.google.com/macros/s/AKfycbwCoxjRIApXUaPPvv6o4yRPR8KyH8rItEvKBGUMPIA_P0ZR_VMLqMDk9pbbKVo4Fbj5ZQ/exec'],
  ['내보니', '만족도 조사', 'https://script.google.com/macros/s/AKfycbyu3ZI-5M8-OeUDtVkSK1utQWmaC_c7QmfUlsS69TK-Yqj16GzIM4GofM6k2FOPwHnhUg/exec'],
